<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#2c3e50" flood-opacity="0.18"/>
    </filter>
    <filter id="crane-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="8" stdDeviation="5" flood-color="#1a252f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- NỀN ĐẤT ĐÔ THỊ BUỔI CHIỀU NẮNG ẤM -->
  <rect x="0" y="0" width="1000" height="500" fill="#a2d16f"/>
  
  <!-- LÔ ĐẤT QUY HOẠCH VỈA HÈ & GẠCH LÁT KHU PHỐ (TÂY BẮC) -->
  <g transform="translate(60, 40)" filter="url(#soft-shadow)">
    <!-- Nền ô phố lát vỉa hè hiện đại -->
    <rect x="0" y="0" width="400" height="230" rx="8" fill="#e9ecef" stroke="#ced4da" stroke-width="2"/>
    <!-- Sân cỏ nội khu & đường nội bộ -->
    <rect x="15" y="15" width="370" height="200" rx="6" fill="#b8e28a"/>
    
    <!-- DÃY NHÀ PHỐ LIỀN KỀ MÁI BẰNG ĐỒNG BỘ PASTEL -->
    <!-- Nhà 1: Hồng san hô pastel -->
    <g transform="translate(30, 30)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="65" height="95" rx="3" fill="#f4a261" stroke="#e76f51" stroke-width="1.5"/>
      <rect x="5" y="5" width="55" height="45" rx="2" fill="#e76f51" opacity="0.3"/>
      <!-- Sân thượng có giàn lam & cây cảnh -->
      <line x1="10" y1="14" x2="55" y2="14" stroke="#fff" stroke-width="2"/>
      <line x1="10" y1="24" x2="55" y2="24" stroke="#fff" stroke-width="2"/>
      <line x1="10" y1="34" x2="55" y2="34" stroke="#fff" stroke-width="2"/>
      <circle cx="48" cy="34" r="5" fill="#40916c"/>
      <!-- Sân trước lát gạch & cửa kính xanh ngọc -->
      <rect x="12" y="58" width="41" height="30" rx="2" fill="#7fc8c0" stroke="#3d8b83" stroke-width="1.2"/>
    </g>

    <!-- Nhà 2: Vàng kem pastel -->
    <g transform="translate(105, 30)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="65" height="95" rx="3" fill="#fefae0" stroke="#dda15e" stroke-width="1.5"/>
      <rect x="5" y="5" width="55" height="45" rx="2" fill="#dda15e" opacity="0.25"/>
      <!-- Giếng trời kính & bồn hoa -->
      <rect x="12" y="12" width="41" height="30" rx="2" fill="#a8dadc" stroke="#457b9d" stroke-width="1.2"/>
      <rect x="8" y="58" width="49" height="30" rx="2" fill="#e9edc9"/>
      <circle cx="16" cy="70" r="4" fill="#52b788"/>
      <circle cx="48" cy="70" r="4" fill="#52b788"/>
    </g>

    <!-- Nhà 3: Xanh mint bạc hà pastel -->
    <g transform="translate(180, 30)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="65" height="95" rx="3" fill="#c3fae8" stroke="#63e6be" stroke-width="1.5"/>
      <rect x="5" y="5" width="55" height="45" rx="2" fill="#63e6be" opacity="0.3"/>
      <line x1="10" y1="16" x2="55" y2="16" stroke="#fff" stroke-width="2.5"/>
      <line x1="10" y1="28" x2="55" y2="28" stroke="#fff" stroke-width="2.5"/>
      <circle cx="18" cy="34" r="5" fill="#2d6a4f"/>
      <rect x="10" y="58" width="45" height="30" rx="2" fill="#7fc8c0" stroke="#2a9d8f" stroke-width="1.2"/>
    </g>

    <!-- CHUNG CƯ THẤP TẦNG HIỆN ĐẠI (KHỐI LỚN) -->
    <g transform="translate(260, 30)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="105" height="155" rx="4" fill="#9aa8b5" stroke="#6c757d" stroke-width="2"/>
      <!-- Tum thang & bồn nước mái -->
      <rect x="18" y="15" width="70" height="45" rx="2" fill="#495057"/>
      <rect x="28" y="22" width="50" height="30" rx="2" fill="#ced4da"/>
      <!-- Các ban công kính xanh ngọc -->
      <rect x="10" y="72" width="40" height="30" rx="1.5" fill="#7fc8c0" stroke="#fff" stroke-width="1.2"/>
      <rect x="55" y="72" width="40" height="30" rx="1.5" fill="#7fc8c0" stroke="#fff" stroke-width="1.2"/>
      <rect x="10" y="112" width="40" height="30" rx="1.5" fill="#7fc8c0" stroke="#fff" stroke-width="1.2"/>
      <rect x="55" y="112" width="40" height="30" rx="1.5" fill="#7fc8c0" stroke="#fff" stroke-width="1.2"/>
    </g>

    <!-- HÀNG CÂY NON ĐÔ THỊ BỒN VUÔNG GỌN GÀNG -->
    <g transform="translate(45, 175)">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#d8c29d" stroke="#b99e74" stroke-width="1"/>
      <circle cx="0" cy="0" r="11" fill="#40916c"/>
      <circle cx="-2" cy="-2" r="7" fill="#52b788"/>
    </g>
    <g transform="translate(120, 175)">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#d8c29d" stroke="#b99e74" stroke-width="1"/>
      <circle cx="0" cy="0" r="11" fill="#40916c"/>
      <circle cx="-2" cy="-2" r="7" fill="#52b788"/>
    </g>
    <g transform="translate(195, 175)">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#d8c29d" stroke="#b99e74" stroke-width="1"/>
      <circle cx="0" cy="0" r="11" fill="#40916c"/>
      <circle cx="-2" cy="-2" r="7" fill="#52b788"/>
    </g>
  </g>

  <!-- CÔNG TRƯỜNG XÂY DỰNG CÓ RÀO TÔN VÀ CẦN CẨU THÁP VÀNG (ĐÔNG BẮC) -->
  <g transform="translate(520, 40)" filter="url(#soft-shadow)">
    <!-- Hàng rào tôn sóng bảo vệ công trường -->
    <rect x="0" y="0" width="420" height="230" rx="4" fill="#dccb9d" stroke="#8d6e63" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="230" fill="none" stroke="#228be6" stroke-width="6" stroke-dasharray="14 4"/>
    
    <!-- Móng bê tông đang thi công -->
    <rect x="40" y="30" width="180" height="150" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
    <!-- Lưới cột dầm sắt thép -->
    <line x1="40" y1="80" x2="220" y2="80" stroke="#868e96" stroke-width="2"/>
    <line x1="40" y1="130" x2="220" y2="130" stroke="#868e96" stroke-width="2"/>
    <line x1="100" y1="30" x2="100" y2="180" stroke="#868e96" stroke-width="2"/>
    <line x1="160" y1="30" x2="160" y2="180" stroke="#868e96" stroke-width="2"/>

    <!-- Xe trộn bê tông đỗ trong công trường -->
    <g transform="translate(260, 50)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="65" height="34" rx="4" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
      <ellipse cx="28" cy="17" rx="22" ry="12" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
      <path d="M 12,8 L 44,26 M 18,26 L 38,8" stroke="#fab005" stroke-width="2.5"/>
      <rect x="50" y="4" width="12" height="26" rx="2" fill="#ffd43b" stroke="#e67700" stroke-width="1"/>
      <circle cx="56" cy="17" r="3" fill="#339af0"/>
    </g>

    <!-- Đống gạch đỏ và đống cát xây dựng -->
    <rect x="250" y="120" width="34" height="24" rx="2" fill="#c92a2a" stroke="#a61e4d" stroke-width="1"/>
    <ellipse cx="330" cy="140" rx="25" ry="16" fill="#fcc419" stroke="#d9480f" stroke-width="1"/>

    <!-- CẦN CẨU THÁP VÀNG RỰC RỠ (TOWER CRANE) -->
    <g transform="translate(200, 115)" filter="url(#crane-shadow)">
      <!-- Trụ tháp khung giàn thép -->
      <rect x="-9" y="-9" width="18" height="18" fill="#f59f00" stroke="#d9480f" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#212529"/>
      <!-- Tay cần dài (Jib) vươn xa -->
      <line x1="-120" y1="0" x2="60" y2="0" stroke="#fab005" stroke-width="7" stroke-linecap="round"/>
      <line x1="-120" y1="0" x2="60" y2="0" stroke="#e67700" stroke-width="2" stroke-dasharray="6 3"/>
      <!-- Đối trọng bê tông phía đuôi -->
      <rect x="40" y="-8" width="24" height="16" rx="2" fill="#495057" stroke="#212529" stroke-width="1.2"/>
      <!-- Cáp treo & Khối móc cẩu vật liệu -->
      <circle cx="-75" cy="0" r="4" fill="#212529"/>
      <rect x="-82" y="-5" width="14" height="10" rx="1.5" fill="#ffd43b" stroke="#d9480f" stroke-width="1"/>
    </g>
    
    <!-- Biển dự án công trình (không chữ thật) -->
    <g transform="translate(15, 195)">
      <rect x="0" y="0" width="40" height="18" rx="2" fill="#fff" stroke="#1971c2" stroke-width="1.5"/>
      <line x1="5" y1="5" x2="35" y2="5" stroke="#1971c2" stroke-width="1.5"/>
      <line x1="5" y1="9" x2="28" y2="9" stroke="#adb5bd" stroke-width="1.2"/>
      <line x1="5" y1="13" x2="22" y2="13" stroke="#adb5bd" stroke-width="1.2"/>
    </g>
  </g>

  <!-- TUYẾN ĐẠI LỘ PHÍA NAM (ĐƯỜNG LỚN: RỘNG 64PX CÓ DẢI PHÂN CÁCH TRỒNG CÂY Ở GIỮA) -->
  <g transform="translate(0, 310)">
    <!-- Vỉa hè lát đá hoa cương 2 bên đại lộ -->
    <rect x="0" y="0" width="1000" height="96" fill="#ced4da"/>
    <!-- Lòng đường nhựa cao cấp xám đậm -->
    <rect x="0" y="10" width="1000" height="76" fill="#343a40"/>
    
    <!-- Làn xe chạy phía trên: vạch đứt trắng -->
    <line x1="0" y1="27" x2="1000" y2="27" stroke="#f8f9fa" stroke-width="2.5" stroke-dasharray="24 18"/>
    <!-- Làn xe chạy phía dưới: vạch đứt trắng -->
    <line x1="0" y1="69" x2="1000" y2="69" stroke="#f8f9fa" stroke-width="2.5" stroke-dasharray="24 18"/>

    <!-- DẢI PHÂN CÁCH CÂY XANH ĐÔ THỊ Ở GIỮA ĐẠI LỘ -->
    <rect x="0" y="42" width="1000" height="12" fill="#e9ecef" stroke="#adb5bd" stroke-width="1"/>
    <rect x="0" y="44" width="1000" height="8" fill="#52b788"/>
    <!-- Cụm cây cảnh tỉa tròn thẳng hàng trên dải phân cách -->
    <g filter="url(#soft-shadow)">
      <circle cx="80" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="160" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="240" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="320" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="400" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="480" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="560" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="640" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="720" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="800" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="880" cy="48" r="5" fill="#2d6a4f"/>
      <circle cx="960" cy="48" r="5" fill="#2d6a4f"/>
    </g>

    <!-- Biển vuông cao tốc màu xanh dương bên lề đường -->
    <g transform="translate(450, -18)" filter="url(#soft-shadow)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="#1c7ed6" stroke="#fff" stroke-width="1.8"/>
      <path d="M 5,18 L 8,4 M 17,18 L 14,4 M 3,11 L 19,11" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- KHU VỰC KHO 1: BÃI VẬT LIỆU (TÂY NAM) -->
  <g transform="translate(60, 420)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="220" height="70" rx="6" fill="#e3d5b8" stroke="#b99e74" stroke-width="1.5"/>
    <!-- Đống cát vàng lớn -->
    <ellipse cx="45" cy="35" rx="25" ry="18" fill="#fcc419" stroke="#d9480f" stroke-width="1.2"/>
    <ellipse cx="42" cy="32" rx="15" ry="10" fill="#ffe066"/>
    <!-- Đống đá dăm xám -->
    <ellipse cx="100" cy="42" rx="20" ry="14" fill="#adb5bd" stroke="#495057" stroke-width="1.2"/>
    <ellipse cx="97" cy="39" rx="12" ry="7" fill="#dee2e6"/>
    <!-- Lán điều hành mái tôn sóng màu ghi xanh -->
    <rect x="145" y="15" width="55" height="42" rx="3" fill="#8a9aa3" stroke="#495057" stroke-width="1.5"/>
    <line x1="155" y1="15" x2="155" y2="57" stroke="#ced4da" stroke-width="2"/>
    <line x1="165" y1="15" x2="165" y2="57" stroke="#ced4da" stroke-width="2"/>
    <line x1="175" y1="15" x2="175" y2="57" stroke="#ced4da" stroke-width="2"/>
    <line x1="185" y1="15" x2="185" y2="57" stroke="#ced4da" stroke-width="2"/>
  </g>

  <!-- TIÊU ĐỀ KHU VỰC MẪU -->
  <g transform="translate(740, 450)" filter="url(#soft-shadow)">
    <rect x="-10" y="-22" width="260" height="38" rx="8" fill="rgba(255,255,255,0.92)" stroke="#ced4da" stroke-width="1.5"/>
    <text x="120" y="2" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="900" font-size="14" fill="#2b3a4a">Khu Đô Thị Mới (Mẫu thiết kế)</text>
  </g>
</svg>