<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bản thử trải nghiệm</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#1b1f24;font-family:"Nunito","Segoe UI",sans-serif;touch-action:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #stage{position:relative;width:844px;height:390px;overflow:hidden;transform-origin:center;background:#8fd16a;border-radius:6px}
  #view{position:absolute;inset:0;display:block}
  .abs{position:absolute}
  svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  button{font-family:inherit;border:0;cursor:pointer;touch-action:none}
  .dim{opacity:.55;filter:grayscale(.85)}
  .glow{box-shadow:0 0 0 3px #ffd84d,0 0 16px 6px rgba(255,214,60,.85)!important}
  .sel{background:#ffd84d!important;box-shadow:0 0 0 3px #fff,0 0 16px 6px rgba(255,214,60,.9)!important}
  .label{font-size:9px;font-weight:900;letter-spacing:.2px;margin-top:1px}

  /* nhiệm vụ (đề xuất 3) */
  .chip{background:rgba(20,28,38,.82);color:#fff;border-radius:22px}
  #timer{left:12px;top:12px;padding:5px 14px;font-size:24px;font-weight:900;display:flex;align-items:center;gap:7px}
  #timer svg{width:20px;height:20px}
  #timer.warn{background:#e03131}
  #tl{left:12px;top:10px;display:flex;gap:8px;align-items:center}
  .tlb{width:44px;height:44px;position:relative}
  .tlb svg{width:22px;height:22px}
  .tlb .bd{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e03131;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid #fff;padding:0 3px}
  #missions{left:12px;top:62px;cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;width:250px;row-gap:14px}
  .mc{width:50px;height:50px;border-radius:50%;position:relative;display:grid;place-items:center}
  .mc svg.ring{position:absolute;inset:0;width:50px;height:50px;transform:rotate(-90deg)}
  .mc .c{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:10px;font-weight:900;line-height:1}
  .mc .c svg{width:16px;height:16px;margin-bottom:2px}
  .mc .dd{position:absolute;z-index:2;bottom:-8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;padding:1px 5px;border-radius:7px;background:#fff;color:#1d2733;white-space:nowrap}
  .mc.warn .dd{background:#ff4d42;color:#fff}
  .mc.done{opacity:.5}
  .mc .onb{position:absolute;z-index:2;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:#ffd84d;border:2px solid #1d2733;display:none}
  .mc.carry .onb{display:block}

  /* điều khiển + mini map (đề xuất 1) */
  .rbtn{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);display:grid;place-items:center;color:#2d3440}
  .rbtn .in{display:flex;flex-direction:column;align-items:center;pointer-events:none}
  .rbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  #bPause{right:242px;top:10px;width:40px;height:40px}
  #bPause svg{width:18px;height:18px}
  #mm{right:10px;top:10px;width:224px;height:128px;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer;background:#9ad877}
  #mm svg{display:block;width:100%;height:100%}
  .dpad{left:12px;bottom:10px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:3px}
  .dpad .rbtn{width:52px;height:52px}
  .dpad .rbtn svg{width:28px;height:28px}
  #bN{grid-column:2;grid-row:1}#bW{grid-column:1;grid-row:2}#bE{grid-column:3;grid-row:2}#bS{grid-column:2;grid-row:3}
  #bW svg{transform:rotate(-90deg)}#bE svg{transform:rotate(90deg)}#bS svg{transform:rotate(180deg)}
  .br{right:16px;bottom:14px}
  #bUturn{width:64px;height:64px}

  /* bảng hỏi */
  #ask{left:calc(50% + 30px);transform:translateX(-50%);bottom:12px;display:none;background:#fff;border-radius:16px;padding:8px 10px 10px;box-shadow:0 5px 0 rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25);z-index:5;width:max-content;max-width:600px}
  #ask.on{display:block}
  #ask .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}
  #ask .hd b{font-size:14px;font-weight:900;color:#2d3440;display:flex;align-items:center;gap:6px}
  #ask .hd b i{width:12px;height:12px;border-radius:50%;display:inline-block}
  #ask .hd span{font-size:10px;font-weight:900;color:#fff;background:rgba(20,28,38,.85);padding:3px 8px;border-radius:9px}
  #ask .opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #ask .opt{background:#37c26b;color:#fff;border-radius:14px;padding:10px 14px;font-weight:900;font-size:13px;box-shadow:0 4px 0 #24995a;display:flex;gap:6px;align-items:center;white-space:nowrap}
  #ask .opt svg{width:18px;height:18px}
  #ask .opt.skip{background:#fff;color:#2d3440;border:2px solid #dfe4ea;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  #ask .opt kbd{font-family:inherit;font-size:9px;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 3px}

  /* màn phủ */
  .ov{position:absolute;inset:0;display:none;z-index:20}
  .ov.on{display:flex}
  .panel{background:#fff;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.2);color:#2d3440}
  .cta{background:#37c26b;color:#fff;border-radius:22px;padding:10px 24px;font-weight:900;font-size:15px;box-shadow:0 4px 0 #24995a}
  .cta.alt{background:#fff;color:#2d3440;box-shadow:0 4px 0 rgba(0,0,0,.2);border:2px solid #e3e6ea}
  .cta.sm{padding:7px 14px;font-size:12px}
  #home{background:#8fd16a}
  #hLeft{position:absolute;left:0;top:0;bottom:0;width:200px;background:#2b3440;padding:12px 10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  #hLeft .brand{color:#fff;font-size:20px;font-weight:900;line-height:1;margin:2px 4px 4px}
  #hLeft .brand small{display:block;font-size:10px;color:#9aa5b1;font-weight:800;margin-top:3px;letter-spacing:.5px}
  .chp{background:#fff;border-radius:12px;padding:7px 10px;box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:left;color:#2d3440;font-size:12px;font-weight:900}
  .chp small{display:block;font-size:9.5px;color:#6b7686;font-weight:800;line-height:1.3;margin-top:1px}
  .chp .bar{height:5px;border-radius:3px;background:#e9ecef;margin-top:5px;overflow:hidden}
  .chp .bar i{display:block;height:100%;background:#37c26b}
  .chp.on{box-shadow:0 0 0 3px #ffd43b,0 3px 0 rgba(0,0,0,.25)}
  .chp.soon{background:#dee2e6}
  .chp .soonTag{float:right;font-size:9px;background:#868e96;color:#fff;border-radius:6px;padding:1px 5px}
  #hMap{position:absolute;left:200px;top:0;width:644px;height:390px}
  #hMap .nd{cursor:pointer}
  #hCard{position:absolute;right:12px;top:40px;width:214px;padding:11px 12px;display:flex;flex-direction:column;gap:4px}
  #hCard .n{font-size:10px;font-weight:900;color:#1c7ed6}
  #hCard .t{font-size:16px;font-weight:900;line-height:1.15}
  #hCard .d{font-size:11px;font-weight:800;color:#6b7686;line-height:1.35}
  #hCard .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;font-weight:900;margin-top:2px}
  #hCard .tag{background:#fff3bf;color:#8a6d00;border-radius:8px;padding:2px 7px;font-size:10px}
  #hCard .ok{background:#d3f9d8;color:#2b8a3e;border-radius:8px;padding:2px 7px;font-size:10px}
  #hCard .cta{margin-top:6px}
  /* bản đồ lớn: phóng to/thu nhỏ/kéo (D-33) — dùng ở màn chuẩn bị và khi mở bản đồ lúc chơi */
  .mview{position:absolute;overflow:hidden;background:#8fd16a;touch-action:none;cursor:grab}
  .mview.drag{cursor:grabbing}
  .mview>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .fullmap use{--pin:0}
  .mtool{position:absolute;z-index:2;display:flex;gap:6px}
  .zbox{right:8px;bottom:8px}
  .zb{width:36px;height:36px;border-radius:12px;background:#fff;color:#2d3440;box-shadow:0 2px 0 rgba(0,0,0,.2);display:grid;place-items:center}
  .zb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .zb.dis{opacity:.35}
  .lgd{left:8px;bottom:8px;flex-wrap:wrap;gap:4px 10px;align-items:center;background:rgba(255,255,255,.94);border-radius:12px;padding:6px 10px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .lgd:empty{display:none}
  .li{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;color:#2d3440;white-space:nowrap;cursor:pointer}
  .li i{flex:none;width:18px;border-radius:2px;display:inline-block}
  .tip{position:absolute;left:8px;bottom:52px;z-index:3;display:none;align-items:center;gap:8px;background:#1d2733;color:#fff;font-size:12px;font-weight:800;line-height:1.3;padding:6px 10px;border-radius:10px;max-width:320px}
  .tip.on{display:flex}
  .tip svg{flex:none}
  /* màn chuẩn bị (PA2 — D-34): bản đồ bên trái, nhiệm vụ ghi ngay dưới điểm giao; cột phải hẹp chỉ còn tên màn, thời gian, xe, nút */
  #prep{background:#8fd16a}
  #pMap{left:0;top:0;bottom:0;right:156px}
  #pUI{position:absolute;right:0;top:0;bottom:0;width:156px;z-index:5;display:flex;flex-direction:column;gap:6px;color:#2d3440;background:#fff;padding:10px 10px 12px;box-shadow:-3px 0 10px rgba(0,0,0,.18)}
  #pUI .sec{font-size:12px;font-weight:900;color:#7b8494;letter-spacing:.4px}
  .ph{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .ph small{font-size:12px;font-weight:900;color:#1c7ed6;letter-spacing:.3px}
  .ptime{background:#1d2733;color:#fff;border-radius:12px;padding:2px 10px;font-size:15px;font-weight:900;white-space:nowrap}
  .pn{font-size:18px;font-weight:900;line-height:1.15}
  .pi{font-size:12px;font-weight:800;color:#5c6573;line-height:1.3}
  .vrow{display:flex;flex-direction:column;gap:6px}
  .vb{border:2px solid #e3e6ea;border-radius:12px;background:#fff;display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:12px;font-weight:900;color:#2d3440;min-height:40px}
  .vb.on{border-color:#37c26b;background:#ebfbee}
  .vb svg{pointer-events:none}
  .vinfo{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#5c6573}
  .vinfo b{color:#2d3440}
  .pbtn{display:flex;gap:8px;align-items:center;margin-top:auto}
  .pbtn .cta{flex:1;font-size:15px;padding:11px 4px}
  .rb.sm{width:46px;height:46px;flex:none}
  .rb.sm svg{width:22px;height:22px}
  /* bản đồ lớn khi đang chơi */
  #mapv{background:rgba(25,32,40,.8)}
  #vMap{left:8px;top:8px;right:8px;bottom:8px;border-radius:14px;box-shadow:0 0 0 3px #fff}
  #vMap .vtag{left:8px;top:8px;background:rgba(20,28,38,.85);color:#fff;font-size:12px;font-weight:900;padding:5px 10px;border-radius:10px}
  #vMap .vclose{right:8px;top:8px}
  #vMap .lgd{flex-direction:column;align-items:flex-start}
  #vMap .zbox{flex-direction:column}
  #vMap .tip{left:150px;bottom:8px}
  #pausev{background:rgba(15,20,28,.32);align-items:center;justify-content:center}
  #pausev .pp{padding:12px 20px 14px;border-radius:26px;background:rgba(255,255,255,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center}
  #pausev .pt{font-size:12px;font-weight:800;color:#2d3440;opacity:.8;margin-bottom:10px}
  #pausev .pb{display:flex;gap:18px;align-items:center;justify-content:center}
  .rb{width:58px;height:58px;border-radius:50%;background:#fff;color:#2d3440;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .rb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .rb.big{width:70px;height:70px;background:#37c26b;color:#fff;box-shadow:0 4px 0 #24995a}
  .rb.big svg{width:30px;height:30px}
  .rb:active{transform:translateY(2px)}
  .btnrow{display:flex;gap:10px}
  #result{background:rgba(25,32,40,.6);align-items:center;justify-content:center}
  #result .panel{width:360px;padding:18px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
  #result h2{font-size:24px;font-weight:900}
  #result .why{font-size:13px;font-weight:800;color:#e03131}
  #result .st{font-size:12.5px;font-weight:800;color:#5c6573}
  #result .rec{background:#fff3bf;color:#8a6d00;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:900}
  #bSkip{position:absolute;right:12px;top:12px;z-index:30;display:none;background:rgba(20,28,38,.8);color:#fff;border-radius:16px;padding:7px 14px;font-weight:900;font-size:12px}
  #cutv{background:rgba(15,20,28,.35);align-items:center;justify-content:center}
  #cutv .panel{padding:12px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:620px}
  #cutv h2{font-size:22px;font-weight:900;color:#2b8a3e}
  #cutv .note{font-size:12.5px;font-weight:800;color:#5c6573}
  #cutv .pic{width:520px;height:235px;border-radius:12px;overflow:hidden;border:3px solid #e9ecef;background:#8fd16a}
  #cutv .pic svg{width:100%;height:100%;display:block}
  .cta.gold{background:#f59f00;box-shadow:0 4px 0 #c77c00}

  /* ===== BẢN THỬ: chờ xuất phát ===== */
  @keyframes goPulse{0%{box-shadow:0 0 0 3px #ffd84d,0 0 0 0 rgba(255,214,60,.85)}100%{box-shadow:0 0 0 3px #ffd84d,0 0 0 18px rgba(255,214,60,0)}}
  .rbtn.go{animation:goPulse 1.1s ease-out infinite;background:#ffd84d!important}
  #goHint{left:186px;bottom:74px;display:none;align-items:center;gap:8px;background:#fff;color:#2d3440;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18);z-index:4}
  #goHint.on{display:flex}
  #goHint:before{content:'';position:absolute;left:-7px;bottom:16px;border:7px solid transparent;border-left:0;border-right-color:#fff}
  #goHint .k{width:26px;height:26px;border-radius:50%;background:#ffd84d;display:grid;place-items:center}
  #goHint .k svg{width:18px;height:18px}
  #goHint small{display:block;font-size:12px;font-weight:800;color:#6b7686}
  /* ===== BẢN THỬ: popup nhiệm vụ / hướng dẫn ===== */
  #infov{background:rgba(15,20,28,.32);align-items:center;justify-content:center}
  .ip{width:660px;max-height:350px;border-radius:22px;background:rgba(255,255,255,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.25);padding:10px 12px 12px 16px;display:flex;flex-direction:column;color:#2d3440;gap:8px}
  .ip.help{height:350px}
  .ih{display:flex;align-items:center;gap:10px}
  .ih b{font-size:17px;font-weight:900;flex:1;display:flex;align-items:center;gap:8px}
  .ih b svg{width:22px;height:22px}
  .itag{font-size:15px;font-weight:900;background:rgba(20,28,38,.85);color:#fff;padding:4px 12px 4px 8px;border-radius:14px;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .itag svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round}
  .ix{width:44px;height:44px;flex:none}
  .ib{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .ifoot{display:flex;gap:14px;align-items:center;font-size:12px;font-weight:900;color:#5c6573;border-top:1px solid rgba(0,0,0,.08);padding-top:6px}
  .ifoot b{color:#2d3440}
  .pk{display:inline-grid;place-items:center;width:20px;height:20px;flex:none;color:#fff}
  .pk svg{width:13px;height:13px}
  .pk.sq{border-radius:5px}.pk.ci{border-radius:50%}
  .rt{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:900;white-space:nowrap}
  .rt .ar{color:#9aa1a9;font-weight:900}
  .chipS{font-size:12px;font-weight:900;border-radius:9px;padding:3px 8px;white-space:nowrap}
  .s-wait{background:#e9ecef;color:#495057}.s-carry{background:#fff3bf;color:#8a6d00}.s-done{background:#d3f9d8;color:#2b8a3e}
  .dl{background:#ffe3e3;color:#c92a2a}.dl.hot{background:#e03131;color:#fff}
  .pb2{height:7px;border-radius:4px;background:#e9ecef;overflow:hidden;width:70px}.pb2 i{display:block;height:100%}
  /* PA1 danh sách */
  .mrow{display:grid;grid-template-columns:16px 1fr 128px 100px 112px;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:12px;padding:7px 10px}
  .mrow.done{opacity:.55}
  .mrow .no{font-size:12px;font-weight:900;color:#9aa1a9}
  .pg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;white-space:nowrap}
  /* PA2 nhóm theo kho */
  .grp{display:flex;flex-direction:column;gap:8px}
  .gc{background:rgba(255,255,255,.75);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  .gc .gh{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:900}
  .gc .gh small{margin-left:auto;font-size:12px;font-weight:800;color:#6b7686}
  .gl{display:grid;grid-template-columns:1fr 130px 118px;gap:6px;align-items:center;font-size:12px;font-weight:900;padding:5px 6px;border-radius:10px;background:#f8f9fa}
  .gl.done{opacity:.55}
  /* PA3 thẻ */
  .cards{display:flex;gap:10px;justify-content:center;align-items:stretch;flex:1}
  .mcard{width:148px;background:rgba(255,255,255,.78);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .mcard.done{opacity:.55}
  .mcard .rt{flex-direction:column;gap:3px;font-size:12.5px;white-space:normal}
  /* Hướng dẫn */
  .tabs{display:flex;gap:10px;flex:1;min-height:0}
  .tl{display:flex;flex-direction:column;gap:5px;width:140px;flex:none}
  .tb{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;color:#495057;background:rgba(255,255,255,.6);border-radius:12px;padding:0 10px;min-height:44px;text-align:left}
  .tb.on{background:#1d2733;color:#fff}
  .tb svg{width:18px;height:18px;flex:none}
  .tb .nw{margin-left:auto;font-size:9px;background:#e03131;color:#fff;border-radius:7px;padding:1px 5px}
  .tc{flex:1;min-width:0;overflow:auto;background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .hrow{display:flex;gap:10px;align-items:flex-start}
  .hrow .hi{flex:none;width:34px;height:34px;border-radius:10px;background:#1d2733;color:#fff;display:grid;place-items:center}
  .hrow .hi svg{width:20px;height:20px}
  .hrow>span>b{display:block;font-size:13.5px;font-weight:900}
  .hrow>span>span{display:block;font-size:12.5px;font-weight:800;color:#495057;line-height:1.35}
  .hrow>span>span b{color:#2d3440;font-weight:900}
  .ill svg{width:100%;height:100%;display:block}
  .ill{flex:none;width:168px;height:106px;border-radius:12px;overflow:hidden;background:#8fd16a}

function house(x,y,w,h,c,p){
  el('rect',{x:x+5,y:y+6,width:w,height:h,fill:PAL.shadow,rx:2},p);el('rect',{x,y,width:w,height:h,fill:PAL.wall,rx:2},p);

    el('polygon',{points:`${x-2},${y-2} ${x+h/2-2},${y+h/2} ${x-2},${y+h+2}`,fill:shade(c,-.1)},p);

  N={};for(let a=0;a<cols;a++)for(let b=0;b<rows;b++)N[`c${a}r${b}`]={x:100+a*SP,y:100+b*SP,i:a,j:b};
  const types={};for(const t in (LV.types||{}))for(const [a,b] of LV.types[t])types[keyE(a,b)]=t;
  const removed=new Set((LV.remove||[]).map(([a,b])=>keyE(a,b)));
  E=[];
  const inReg=(n)=>!LV.region||(N[n].i<=LV.region[0]&&N[n].j<=LV.region[1]);
  const add=(a,b)=>{if(!removed.has(keyE(a,b))&&inReg(a)&&inReg(b))E.push({a,b,len:SP,type:types[keyE(a,b)]||'thuong'});};
  for(let b=0;b<rows;b++)for(let a=0;a<cols-1;a++)add(`c${a}r${b}`,`c${a+1}r${b}`);
  for(let a=0;a<cols;a++)for(let b=0;b<rows-1;b++)add(`c${a}r${b}`,`c${a}r${b+1}`);
  ZONES=Object.entries(LV.points).map(([id,[a,b,f]])=>({id,a,b,d1:f*SP-ZONE_HALF,d2:f*SP+ZONE_HALF,name:PLACE[id],col:PCOL[id],kho:KHO.has(id)}));

function zoneXY(z,d){const A=N[z.a],u=unit(A,N[z.b]);return{x:A.x+u.x*d,y:A.y+u.y*d,u};}

  });

  for(let i=0;i<nc;i++){let r=null;for(let j=0;j<nr-1;j++){const t=typeOf(`c${i}r${j}`,`c${i}r${j+1}`);
    if(t&&t!=='thuong'&&r&&r.t===t){r.n++;}else{r=t&&t!=='thuong'?{t,h:0,i,j,n:1}:null;if(r)runs.push(r);}}}

// Vẽ bản đồ Chương 2 theo trạng thái xây dựng. opts: region [c1,r1], built[5], constructing (chỉ số công trình đang xây hoặc -1), pins

      const w=60+r()*50,h=40+r()*45,x=x0+a*cw+(cw-w)*r(),y=y0+b*ch+(ch-h)*r();

const unit=(p,q)=>{const dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy);return{x:dx/l,y:dy/l};};
const getE=(u,v)=>E.find(e=>(e.a===u&&e.b===v)||(e.a===v&&e.b===u));
const factor=e=>ROAD[e.type].f[VK];
const canGo=(u,v)=>{const e=getE(u,v);return !!e&&factor(e)!==null;};
const nbrs=n=>E.filter(e=>e.a===n||e.b===n).map(e=>e.a===n?e.b:e.a);
const absDir=v=>Math.abs(v.x)>Math.abs(v.y)?(v.x>0?'E':'W'):(v.y>0?'S':'N');
const heading=(from,to)=>absDir(unit(N[from],N[to]));
function options(from,to){const r={};for(const nb of nbrs(to)){if(nb===from||!canGo(to,nb))continue;r[absDir(unit(N[to],N[nb]))]=nb;}return r;}

// Tại vùng đỗ: tự giao → hỏi việc cần chọn → hết việc tự chạy tiếp (D-23)
function choices(z){

}

  const c=G.car,del=deliverables(z);

  const ch=choices(z);

}

function step(dt){
  const c=G.car;G.t+=dt;
  if(c.busy){c.busy.t+=dt;if(c.busy.t>=c.busy.dur){const b=c.busy;c.busy=null;b.done();}}
  else if(!c.stopped&&!c.wait){
    const nd=c.d+speed()*dt;
    if(nd>=SP){
      const over=nd-SP,o=options(c.from,c.to),hd=heading(c.from,c.to);let nx=null;
      if(c.cmd&&o[c.cmd])nx=o[c.cmd];else if(o[hd])nx=o[hd];
      c.cmd=null;
      if(nx){c.from=c.to;c.to=nx;c.d=over;}else{c.d=SP;c.wait=true;}
    }else c.d=nd;
    const z=curZone();
    if(c.skip&&(!z||z.id!==c.skip))c.skip=null;
    if(z&&z.id!==c.skip&&!c.busy&&hasWork(z))zoneProcess(z);
  }
  if(G.M.every(m=>m.delivered>=m.qty))return end(true);
  for(const m of G.M)if(m.dl&&G.t>m.dl&&m.delivered<m.qty)return end(false,`Đơn ${m.src} → ${m.name} đã quá hạn ${fmt(m.dl)} (mới giao ${m.delivered}/${m.qty} kiện).`);
  if(G.t>=LV.T0){G.t=LV.T0;return end(false,`Hết thời gian. Còn ${G.M.filter(m=>m.delivered<m.qty).map(m=>m.name).join(', ')} chưa giao đủ.`);}
}

    // giữ bản đồ (cộng lề 14px) trong phần khung không bị che; bản đồ nhỏ hơn khung thì căn giữa
    const m=MARGIN/v.s;
    v.x=W+2*m<=uw?-l/v.s-(uw-W)/2:cl(v.x,-m-l/v.s,W+m-uw-l/v.s);
    v.y=H+2*m<=uh?-t/v.s-(uh-H)/2:cl(v.y,-m-t/v.s,H+m-uh-t/v.s);
    svg.setAttribute('viewBox',`${v.x} ${v.y} ${bw()/v.s} ${bh()/v.s}`);
    v.items.forEach(it=>it.g.setAttribute('transform',`translate(${it.x},${it.y}) scale(${1/v.s})`));
    rg.setAttribute('opacity',(cl((.5-v.s)/.15,0,1)*.9).toFixed(2));
    zb.children[0].classList.toggle('dis',v.s>=v.smax*.999);zb.children[1].classList.toggle('dis',v.s<=v.smin*1.001);
    v.layout();};
  // Xếp nhãn: mỗi khối chữ thử 4 chỗ quanh ký hiệu (dưới, trên, phải, trái), chọn chỗ ít chồng lên ký hiệu/nhãn khác
  // và ít tràn ra ngoài phần khung nhìn thấy; tính lại mỗi khi phóng/kéo vì chữ giữ cỡ cố định còn khoảng cách thì đổi.
  v.layout=()=>{const [t,r,b,l]=v.ins,X1=bw()-r,Y1=bh()-b,R=(x0,y0,x1,y1)=>({x0,y0,x1,y1});
    const P=v.items.map(it=>({it,x:(it.x-v.x)*v.s,y:(it.y-v.y)*v.s})),obs=P.map(p=>R(p.x-17,p.y-17,p.x+17,p.y+17));
    P.forEach(p=>{if(p.it.car)obs.push(R(p.x+10,p.y-9,p.x+32,p.y+7));});
    const ov=(a,o)=>Math.max(0,Math.min(a.x1,o.x1)-Math.max(a.x0,o.x0))*Math.max(0,Math.min(a.y1,o.y1)-Math.max(a.y0,o.y0));
    P.filter(p=>p.it.lab).map(p=>{const bb=p.it.lab.getBBox();p.w=bb.width+6;p.h=bb.y+bb.height+3;return p;}).sort((a,c)=>c.h-a.h).forEach(p=>{
      const {w,h}=p;let best=null;
      [[0,17],[0,-17-h],[17+w/2,-h/2],[-17-w/2,-h/2]].forEach(([dx,dy],k)=>{const a=R(p.x+dx-w/2,p.y+dy,p.x+dx+w/2,p.y+dy+h);
        let sc=k*4+(Math.max(0,l-a.x0)+Math.max(0,a.x1-X1)+Math.max(0,t-a.y0)+Math.max(0,a.y1-Y1))*h;
        obs.forEach(o=>sc+=ov(a,o));if(!best||sc<best.sc)best={sc,dx,dy,a};});
      p.it.lab.setAttribute('transform',`translate(${best.dx},${best.dy})`);obs.push(best.a);});};
  v.zoomAt=(px,py,f)=>{const s2=cl(v.s*f,v.smin,v.smax),wx=v.x+px/v.s,wy=v.y+py/v.s;v.s=s2;v.x=wx-px/s2;v.y=wy-py/s2;v.apply();};
  v.fitTo=(x0,y0,x1,y1)=>{const [t,r,b,l]=v.ins,uw=bw()-l-r,uh=bh()-t-b;v.s=cl(Math.min((uw-2*MARGIN)/(x1-x0),(uh-2*MARGIN)/(y1-y0)),v.smin,v.smax);
    v.x=(x0+x1)/2-(uw/2+l)/v.s;v.y=(y0+y1)/2-(uh/2+t)/v.s;v.apply();};
  // khung nhìn ban đầu: vùng đang thông xe của màn (Chương 2) hoặc toàn bộ bản đồ
  v.home=()=>{const R=LV.region;R?v.fitTo(0,0,Math.min(W,100+R[0]*SP+175),Math.min(H,100+R[1]*SP+175)):v.fitTo(0,0,W,H);};
  v.refresh=(mode,ins)=>{v.ins=ins;const [t,r,b,l]=ins;
    v.smin=Math.min((bw()-l-r-2*MARGIN)/W,(bh()-t-b-2*MARGIN)/H);v.smax=MAX_ZOOM;
    rg.innerHTML='';const RWm={lon:30,dong:22,gogh:22,hem:12};
    E.forEach(e=>{if(RCOL[e.type])el('line',{x1:N[e.a].x,y1:N[e.a].y,x2:N[e.b].x,y2:N[e.b].y,stroke:RCOL[e.type],'stroke-width':RWm[e.type]},rg);});
    buildMarks(v,og,mode);v.home();};
  const P=new Map();
  const loc=e=>{const r=box.getBoundingClientRect(),k=r.width/box.offsetWidth;return{x:(e.clientX-r.left)/k,y:(e.clientY-r.top)/k};};
  box.addEventListener('pointerdown',e=>{
    const z=e.target.closest('.zb');if(z){e.preventDefault();z.dataset.z==='fit'?v.home():v.zoomAt(bw()/2,bh()/2,z.dataset.z==='in'?1.6:1/1.6);return;}
    if(e.target.closest('button,.mtool'))return;
    e.preventDefault();try{box.setPointerCapture(e.pointerId);}catch(_){}P.set(e.pointerId,loc(e));box.classList.add('drag');});
  box.addEventListener('pointermove',e=>{const q=P.get(e.pointerId);if(!q)return;const p=loc(e);

    else{let o=null;P.forEach((val,k)=>{if(k!==e.pointerId)o=val;});
      const d0=Math.hypot(q.x-o.x,q.y-o.y)||1,d1=Math.hypot(p.x-o.x,p.y-o.y)||1,m0={x:(q.x+o.x)/2,y:(q.y+o.y)/2},m1={x:(p.x+o.x)/2,y:(p.y+o.y)/2};
      const wx=v.x+m0.x/v.s,wy=v.y+m0.y/v.s;v.s=cl(v.s*d1/d0,v.smin,v.smax);v.x=wx-m1.x/v.s;v.y=wy-m1.y/v.s;v.apply();}
    P.set(e.pointerId,p);});

  box.addEventListener('dblclick',e=>{if(e.target.closest('button,.mtool'))return;const p=loc(e);v.zoomAt(p.x,p.y,1.6);});

}
// Ký hiệu cỡ cố định trên bản đồ lớn: ▲ kho (vuông), ● điểm giao (tròn), tên điểm, vị trí xe.
// 'prep': dưới tên điểm giao ghi nhiệm vụ (×số kiện, nơi lấy, hạn); 'play': hiện trạng thái (vòng vàng = đang chở hàng tới, xám ✓ = xong).
function buildMarks(v,og,mode){
  og.innerHTML='';v.items=[];const add=(x,y,o)=>{const g=el('g',{},og);v.items.push(Object.assign({g,x,y},o));return g;};
  const tx=(g,t,y,o)=>{const e=el('text',Object.assign({x:0,y,'text-anchor':'middle','font-size':12.5,'font-weight':900,'font-family':'Nunito,Segoe UI',fill:'#1d2733',stroke:'#fff','stroke-width':3.5,'stroke-linejoin':'round','paint-order':'stroke'},o||{}),g);e.textContent=t;return e;};
  const site=LV.chapter===2?CH2.sites[LV.stage]:null;
  ZONES.forEach(z=>{const b=buildingRect(z),st=mode==='play'?zState(z):'on',col=st==='done'?'#adb5bd':z.col,lab=el('g',{});
    const g=add(b.px,b.py-26,{lab});
    if(st==='carry')el('circle',{r:18,fill:'none',stroke:'#ffd43b','stroke-width':4},g);
    if(z.kho)el('rect',{x:-12,y:-12,width:24,height:24,rx:6,fill:col,stroke:'#fff','stroke-width':2.5},g);else el('circle',{r:12.5,fill:col,stroke:'#fff','stroke-width':2.5},g);
    if(st==='done')el('path',{d:'M-5.5 0 L-1.5 4 L5.5 -4.5',fill:'none',stroke:'#fff','stroke-width':2.8,'stroke-linecap':'round','stroke-linejoin':'round'},g);
    else glyph(g,z.kho?'up':'down',0,0,1);
    g.appendChild(lab);
    const nm=tx(lab,z.name,12);
    if(mode==='prep'&&z.id===site){const sp=el('tspan',{fill:'#c77c00','font-size':12},nm);sp.textContent=' · công trình';}
    if(mode==='prep'&&!z.kho)G.M.filter(m=>m.to===z.id).forEach((m,i)=>tx(lab,`×${m.qty} từ ${m.src}${m.dl?' · hạn '+fmt(m.dl):''}`,27+i*14,{'font-size':12,fill:m.dl?'#c92a2a':'#3b4350'}));});
  const c=add(G.disp.x,G.disp.y,{car:true});el('circle',{r:9,fill:'#fff',stroke:'#e8590c','stroke-width':4},c);
  tx(c,'Xe',4.5,{x:14,'text-anchor':'start',fill:'#e8590c'});
}

function eff(t,k){const f=ROAD[t].f[k];if(f===null)return['x','✕ Không vào'];if(f>=1.2)return['f','Nhanh hơn'];if(f>=.95)return['n','Bình thường'];if(f>=.75)return['n','Hơi chậm'];if(f>=.55)return['s','Chậm'];return['vs','Rất chậm'];}
const ROADDESC={thuong:'Mốc so sánh',lon:'Rộng, nhiều làn',dong:'Xe càng to càng chậm',gogh:'Ổ gà, xe máy chậm nhất',hem:'Chỉ xe máy vào được'};
function roadSw(t){const c={thuong:'#4a4f57',lon:'#3b4048',dong:'#4f4a4a',gogh:'#8a6a4a',hem:'#7d838c'}[t];return`<span style="display:inline-block;width:30px;height:${t==='lon'?14:t==='hem'?6:10}px;background:${c};border-radius:2px;box-shadow:0 0 0 2px #dfe2d9"></span>`;}
function roadTable(){const used=new Set(E.map(e=>e.type)),vs=['may','van','tai'],order=['thuong','lon','dong','gogh','hem'].sort((a,b)=>used.has(b)-used.has(a));
  return order.map(t=>`<div class="rrow ${used.has(t)?'':'off'}"><span class="rn">${t==='thuong'?roadSw(t):legendSVG(t)}<span><b>${ROAD[t].name}</b><small>${ROADDESC[t]}</small></span></span>
    ${vs.map(k=>{const [c,l]=eff(t,k);return`<span class="rv ${k===VK?'me':''}"><small>${VEH[k].name}</small><span class="ef ${c}">${l}</span></span>`;}).join('')}</div>`).join('')+
  `<span style="font-size:12px;font-weight:800;color:#6b7686">Mờ = không có trong màn này · viền xanh = xe bạn đang dùng. Đường xe không vào được thì nút hướng không sáng.</span>`;}
// minh họa nhỏ (SVG)
const ILL={
  drive:`<svg viewBox="0 0 190 120" width="190" height="120"><rect width="190" height="120" fill="#8fd16a"/><rect x="0" y="48" width="190" height="26" fill="#4a4f57"/><rect x="118" y="0" width="26" height="120" fill="#4a4f57"/><rect x="74" y="50" width="40" height="22" fill="#ffd84d" opacity=".45"/><text x="94" y="45" text-anchor="middle" font-size="9" font-weight="900" fill="#5c3d00" font-family="Nunito">vùng chọn hướng</text><rect x="40" y="62" width="24" height="11" rx="3" fill="#fff" stroke="#2d3440"/><path d="M68 67 H80" stroke="#2d3440" stroke-width="2" stroke-dasharray="3 2"/><path d="M131 40 V18 M126 23 L131 18 L136 23" stroke="#ffd84d" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M131 82 V104 M126 99 L131 104 L136 99" stroke="#ffd84d" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M152 61 H176 M171 56 L176 61 L171 66" stroke="#ffd84d" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`,
  start:`<svg viewBox="0 0 190 120" width="190" height="120"><rect width="190" height="120" fill="#8fd16a"/><rect x="0" y="22" width="190" height="26" fill="#4a4f57"/><rect x="40" y="36" width="26" height="12" rx="3" fill="#fff" stroke="#2d3440"/><path d="M70 42 H96 M90 37 L96 42 L90 47" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><g transform="translate(95 88)"><circle r="17" fill="#fff"/><circle cx="-40" r="15" fill="#fff" opacity=".6"/><circle cx="40" r="15" fill="#ffd84d" stroke="#fff" stroke-width="3"/><path d="M33 0 H47 M42 -5 L47 0 L42 5" stroke="#2d3440" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M0 7 V-7 M-5 -2 L0 -7 L5 -2" stroke="#2d3440" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-33 0 H-47 M-42 -5 L-47 0 L-42 5" stroke="#2d3440" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="135" y="118" text-anchor="middle" font-size="9" font-weight="900" fill="#1d2733" font-family="Nunito">cùng hướng đầu xe</text></svg>`,
  point:`<svg viewBox="0 0 190 120" width="190" height="120"><rect width="190" height="120" fill="#8fd16a"/><rect x="0" y="54" width="190" height="24" fill="#4a4f57"/><rect x="22" y="22" width="26" height="26" rx="6" fill="#1c7ed6" stroke="#fff" stroke-width="3"/><path d="M35 41 V29 M30 34 L35 29 L40 34" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><text x="35" y="16" text-anchor="middle" font-size="9" font-weight="900" fill="#1d2733" font-family="Nunito">lấy hàng</text><circle cx="152" cy="35" r="13" fill="#f76707" stroke="#fff" stroke-width="3"/><path d="M152 29 V41 M147 36 L152 41 L157 36" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><text x="152" y="16" text-anchor="middle" font-size="9" font-weight="900" fill="#1d2733" font-family="Nunito">giao hàng</text><rect x="24" y="60" width="24" height="11" rx="3" fill="#fff" stroke="#2d3440"/><rect x="14" y="84" width="104" height="28" rx="8" fill="#fff"/><rect x="20" y="89" width="56" height="18" rx="6" fill="#37c26b"/><text x="48" y="101" text-anchor="middle" font-size="8.5" font-weight="900" fill="#fff" font-family="Nunito">Lấy 2 kiện</text><rect x="80" y="89" width="34" height="18" rx="6" fill="#f1f3f5"/><text x="97" y="101" text-anchor="middle" font-size="8.5" font-weight="900" fill="#2d3440" font-family="Nunito">Đi tiếp</text><text x="160" y="104" text-anchor="middle" font-size="9" font-weight="900" fill="#1d2733" font-family="Nunito">tự giao</text></svg>`,
  time:`<svg viewBox="0 0 190 120" width="190" height="120"><rect width="190" height="120" fill="#e9f5e1"/><rect x="12" y="12" width="78" height="30" rx="15" fill="#1d2733"/><text x="51" y="33" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Nunito">⏱ 1:52</text><rect x="100" y="16" width="78" height="22" rx="9" fill="#ffe3e3"/><text x="139" y="31" text-anchor="middle" font-size="10" font-weight="900" fill="#c92a2a" font-family="Nunito">⏱ Hạn còn 0:38</text><text x="12" y="62" font-size="10" font-weight="900" fill="#2d3440" font-family="Nunito">Đồng hồ dừng khi:</text>${['⏸ Tạm dừng','🗺 Bản đồ','📋 Nhiệm vụ','? Hướng dẫn','Bảng hỏi'].map((t,i)=>`<rect x="${12+(i%3)*58}" y="${70+Math.floor(i/3)*22}" width="54" height="18" rx="8" fill="#fff"/><text x="${39+(i%3)*58}" y="${82+Math.floor(i/3)*22}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#2d3440" font-family="Nunito">${t}</text>`).join('')}</svg>`};
function HSEC(){const lv=LV,tot=G.M.reduce((s,m)=>s+m.qty,0),used=[...new Set(E.map(e=>e.type))].filter(t=>t!=='thuong'),mech=MECH[LVI];
  return[
  {id:'lv',ic:IC.star,t:'Màn này',nw:1,body:()=>`<div class="hrow"><span class="hi">${IC.star}</span><span><b>Mục tiêu</b><span>Giao đủ <b>${tot} kiện</b> cho <b>${G.M.length} đơn</b> trước khi đồng hồ về 0:00 (có ${fmt(lv.T0)}).</span></span></div>
    <div class="hrow"><span class="hi" style="background:#e03131">!</span><span><b>Mới ở màn này: ${mech}</b><span>${MECHTXT[mech]||''}</span></span></div>
    <div class="hrow"><span class="hi">${IC.road}</span><span><b>Đường trong màn</b><span style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${used.length?used.map(t=>`<span style="display:flex;gap:4px;align-items:center">${legendSVG(t)}${ROAD[t].name}</span>`).join(''):'Chỉ có đường thường'}</span></span></div>
    <div class="hrow"><span class="hi">${IC.car}</span><span><b>${V().name}</b><span>Chở tối đa ${V().cap} kiện mỗi chuyến · ${V().spd.toLowerCase()}${V().note?' · '+V().note:''}</span></span></div>`},
  {id:'drive',ic:IC.car,t:'Lái xe',ill:['start','drive'],body:()=>`<div class="hrow"><span class="hi">${IC.play}</span><span><b>Xuất phát</b><span>Nhấn mũi tên <b>cùng hướng đầu xe</b>. Sau đó xe tự chạy.</span></span></div>
    <div class="hrow"><span class="hi">${IC.turn}</span><span><b>Rẽ</b><span>Gần giao lộ, nút hướng đi được <b>sáng vàng</b>: bấm để chọn, bấm lại để hủy.</span></span></div>
    <div class="hrow"><span class="hi">${IC.stop}</span><span><b>Không bấm gì</b><span>Xe đi thẳng; không đi thẳng được thì xe dừng chờ.</span></span></div>
    <div class="hrow"><span class="hi">${I.uturn}</span><span><b>Quay đầu</b><span>Bấm bất cứ lúc nào.</span></span></div>`},
  {id:'deliver',ic:IC.pin,t:'Lấy & giao',ill:'point',body:()=>`<div class="hrow"><span class="hi">${IC.pin}</span><span><b>Ký hiệu</b><span>▲ ô vuông: <b>lấy hàng</b> · ▼ hình tròn: <b>giao hàng</b>.</span></span></div>
    <div class="hrow"><span class="hi">${IC.stop}</span><span><b>Xe tự dừng khi có việc</b><span>Hàng của điểm này <b>tự được giao</b>. Lấy hàng: chọn trên bảng hỏi, hoặc "Đi tiếp".</span></span></div>
    <div class="hrow"><span class="hi">${I.box}</span><span><b>Sức chứa</b><span>Số trên đầu xe (2/3) = đang chở / tối đa. Nhiều hàng thì chia chuyến.</span></span></div>`},
  {id:'road',ic:IC.road,t:'Loại đường',body:()=>roadTable()},
  {id:'time',ic:IC.clock,t:'Thời gian',ill:'time',body:()=>`<div class="hrow"><span class="hi">${IC.clock}</span><span><b>Đồng hồ đếm ngược</b><span>Hết giờ chưa giao đủ là thua. Chỉ chạy khi xe đã xuất phát.</span></span></div>
    <div class="hrow"><span class="hi" style="background:#e03131">⏱</span><span><b>Đơn có hạn ⏱</b><span>Giao xong trước khi "hạn còn" về 0:00.</span></span></div>
    <div class="hrow"><span class="hi">${I.pause}</span><span><b>Đồng hồ đứng yên khi</b><span>Tạm dừng, xem bản đồ, nhiệm vụ, hướng dẫn, bảng hỏi.</span></span></div>`}];}
const HELP={
  C:()=>{const S=HSEC(),cur=S.find(x=>x.id===hTab)||S[0];
    return`<div class="tabs"><div class="tl">${S.map(x=>`<button class="tb ${x.id===cur.id?'on':''}" data-tab="${x.id}">${x.ic}${x.t}${x.nw?'<span class="nw">MỚI</span>':''}</button>`).join('')}</div>
      <div class="tc">${cur.ill?`<div style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;gap:8px">${[].concat(cur.ill).map(k=>`<div class="ill">${ILL[k]}</div>`).join('')}</div><div style="flex:1;display:flex;flex-direction:column;gap:8px">${cur.body()}</div></div>`:cur.body()}</div></div>`;},
  A:()=>{const S=HSEC(),c=S[hCard];
    return`<div style="display:flex;gap:10px;align-items:center;flex:1;min-height:0"><button class="nav" data-nav="-1" style="${hCard?'':'opacity:.3'}"><svg viewBox="0 0 28 28"><path d="M17 6 L9 14 L17 22"/></svg></button>
      <div class="tc" style="height:100%"><div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900">${c.ic}${c.t}<span style="margin-left:auto;font-size:12px;color:#6b7686">${hCard+1}/${S.length}</span></div>${c.ill?`<div style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;gap:8px">${[].concat(c.ill).map(k=>`<div class="ill">${ILL[k]}</div>`).join('')}</div><div style="flex:1;display:flex;flex-direction:column;gap:8px">${c.body()}</div></div>`:c.body()}</div>
      <button class="nav" data-nav="1" style="${hCard<S.length-1?'':'opacity:.3'}"><svg viewBox="0 0 28 28"><path d="M11 6 L19 14 L11 22"/></svg></button></div>
      <div class="dots">${S.map((_,i)=>`<i class="${i===hCard?'on':''}"></i>`).join('')}</div>`;},
  B:()=>{const mech=MECH[LVI],used=[...new Set(E.map(e=>e.type))].filter(t=>t!=='thuong');
    const L=(b,t)=>`<div class="li3"><span>•</span><span><b>${b}</b> ${t}</span></div>`;
    return`<div style="font-size:12.5px;font-weight:900;background:#fff3bf;color:#8a6d00;border-radius:10px;padding:5px 10px">★ Màn này: ${mech} — ${MECHTXT[mech]||''}</div><div class="cols3">
      <div class="col3"><h4>${IC.car}Lái xe</h4>${L('Xuất phát:','nhấn mũi tên cùng hướng đầu xe.')}${L('Rẽ:','nút sáng vàng gần giao lộ — bấm để chọn, bấm lại để hủy.')}${L('Không bấm:','xe đi thẳng; ngã ba/cụt thì xe dừng chờ.')}${L('Quay đầu:','bấm bất cứ lúc nào.')}</div>
      <div class="col3"><h4>${IC.pin}Lấy & giao</h4>${L('▲ vuông','= lấy hàng, ▼ tròn = giao hàng.')}${L('Xe tự dừng','khi có việc; hàng tự giao.')}${L('Lấy hàng:','chọn trên bảng hỏi, hoặc "Đi tiếp".')}${L('Sức chứa:',`xe chở tối đa ${V().cap} kiện — chia chuyến.`)}</div>
      <div class="col3"><h4>${IC.road}Đường & giờ</h4>${used.map(t=>`<div class="li3" style="align-items:center">${legendSVG(t)}<span><b>${ROAD[t].name}:</b> ${ROADDESC[t].toLowerCase()}</span></div>`).join('')}${L('⏱ Hạn:','giao trễ là thua ngay.')}${L('Giờ đứng yên:','khi tạm dừng, xem bản đồ, nhiệm vụ, hướng dẫn, bảng hỏi.')}</div></div>`;}};
function renderInfo(){const k=INFO.kind;document.querySelector('.ip').classList.toggle('help',k==='help');
  $('iTitle').innerHTML=k==='mis'?`${IC.list}Nhiệm vụ · Màn ${LVI+1} ${LV.name}`:`${IC.help}Cách chơi`;
  $('iTag').innerHTML=`<svg viewBox="0 0 28 28"><path d="M10 7 V21 M18 7 V21"/></svg>${fmt(LV.T0-G.t)}`;
  $('iBody').innerHTML=k==='mis'?MIS[MV]():HELP[HV]();renderPick();}
function renderPick(){const b=(g,v,cur,l)=>`<button data-g="${g}" data-v="${v}" class="${v===cur?'on':''}">${l}</button>`;
  $('pick').innerHTML=`Bản thử · Nhiệm vụ ${b('m','1',MV,'PA1')}${b('m','2',MV,'PA2')}${b('m','3',MV,'PA3')} · Hướng dẫn ${b('h','C',HV,'PA-C')}${b('h','A',HV,'PA-A')}${b('h','B',HV,'PA-B')}`;}
$('pick').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.g==='m'){MV=t.dataset.v;if(G&&G.state==='info'&&INFO.kind!=='mis'){INFO.kind='mis';}}else{HV=t.dataset.v;hCard=0;if(G&&G.state==='info'&&INFO.kind!=='help'){INFO.kind='help';}}if(G&&G.state==='info')renderInfo();else renderPick();});
renderPick();

/* ======================= Khung hình ======================= */
function fit(){const s=/real/.test(location.hash)?548/844:Math.min(innerWidth/844,innerHeight/390);$('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
const DT=1/60;let acc=0,last=performance.now();
function loop(now){acc+=Math.min(.25,(now-last)/1000);last=now;
  while(acc>=DT){if(G&&G.state==='play')step(DT);else if(G&&G.state==='cut')stepCut(DT);acc-=DT;}
  render();requestAnimationFrame(loop);}
const vPrep=makeViewer('pMap'),vPlay=makeViewer('vMap');
// dựng sẵn màn 1 phía sau trang chủ
buildLevel(0);buildCarLayer();reset();G.state='home';
renderHome();show('home');
// mở thẳng một màn qua địa chỉ, ví dụ index.html#lv=3
const hc=location.hash.match(/ch=(\d)/);if(hc&&CHAPTERS[+hc[1]-1]){HCH=+hc[1]-1;HSEL=null;renderHome();}
const hm=location.hash.match(/lv=(\d+)/);if(hm&&LEVELS[+hm[1]-1]){openLevel(+hm[1]-1);if(/play/.test(location.hash))startGame();if(/pause/.test(location.hash))pauseGame();if(/[&#]mis\b/.test(location.hash))openInfo('mis');if(/[&#]help\b/.test(location.hash))openInfo('help');if(/[&#]map/.test(location.hash))mapView();
  if(/win/.test(location.hash)){startGame();G.M.forEach(m=>{m.picked=m.delivered=m.qty;});step(1/60);startCut();if(/cutend/.test(location.hash))finishCut();}}
requestAnimationFrame(loop);
</script>
</body>
</html>
