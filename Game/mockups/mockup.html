<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=844,initial-scale=1">
<title>Mockup giao diện chơi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:844px;height:390px;overflow:hidden;background:#222;font-family:"Nunito","Segoe UI",sans-serif}
  #phone{position:relative;width:844px;height:390px;overflow:hidden}
  #map{position:absolute;inset:0}
  #hud{position:absolute;inset:0;pointer-events:none}
  .abs{position:absolute}
  svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .dim{opacity:.62;filter:grayscale(.85)}
  .glow{box-shadow:0 0 0 3px #ffd84d,0 0 16px 6px rgba(255,214,60,.85)!important}
  .label{font-size:9px;font-weight:800;letter-spacing:.2px;margin-top:1px}

  /* ---------- V1: Góc truyền thống ---------- */
  .v1 .card{background:rgba(255,255,255,.95);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .v1 .mis{left:10px;top:10px;width:226px;padding:8px 10px}
  .v1 .mis h4{font-size:11px;color:#4a5260;font-weight:900;margin-bottom:4px;display:flex;justify-content:space-between}
  .v1 .row{display:flex;align-items:center;gap:7px;padding:4px 0;border-top:1px solid #eef0f2;font-size:11px;color:#2d3440;font-weight:700}
  .v1 .row .ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
  .v1 .row .ico svg{width:15px;height:15px}
  .v1 .row .t{flex:1;line-height:1.15}
  .v1 .row .t small{display:block;color:#7b8494;font-size:9.5px;font-weight:700}
  .v1 .dl{font-size:10px;font-weight:900;padding:2px 6px;border-radius:8px;background:#eef1f5;color:#4a5260}
  .v1 .dl.warn{background:#ff5a4f;color:#fff}
  .v1 .row.lock{opacity:.6}
  .v1 .timer{left:50%;transform:translateX(-50%);top:10px;padding:4px 18px;display:flex;align-items:center;gap:8px;font-size:28px;font-weight:900;color:#2d3440}
  .v1 .timer svg{width:24px;height:24px;color:#2d3440}
  .v1 .veh{left:50%;transform:translateX(-50%);top:58px;padding:3px 12px;font-size:11px;font-weight:800;color:#2d3440;display:flex;gap:6px;align-items:center}
  .v1 .veh b{color:#e8590c}
  .v1 .mm{right:10px;top:10px;width:132px;height:90px;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .v1 .rbtn{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);display:grid;place-items:center;color:#2d3440;text-align:center}
  .v1 .rbtn .in{display:flex;flex-direction:column;align-items:center}
  .v1 .pause{right:150px;top:10px;width:40px;height:40px}
  .v1 .pause svg{width:18px;height:18px}
  .v1 .bl{left:16px;bottom:14px;display:flex;gap:12px;align-items:flex-end}
  .v1 .br{right:16px;bottom:14px;display:flex;gap:12px;align-items:flex-end}
  .v1 .big{width:66px;height:66px}
  .v1 .stop{background:#ff5a4f;color:#fff}
  .v1 .go{background:#37c26b;color:#fff}
  .v1 .act{left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:10px}
  .v1 .pill{background:#fff;border-radius:24px;padding:10px 18px;font-weight:900;font-size:13px;color:#2d3440;box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;gap:6px;align-items:center}

  /* ---------- V2: Bảng bên trái ---------- */
  .v2 .side{left:0;top:0;bottom:0;width:212px;background:rgba(250,251,252,.96);box-shadow:4px 0 0 rgba(0,0,0,.08);padding:10px 12px;display:flex;flex-direction:column}
  .v2 .tm{display:flex;align-items:baseline;gap:8px}
  .v2 .tm b{font-size:34px;font-weight:900;color:#1f2a37;line-height:1}
  .v2 .tm span{font-size:10px;color:#6b7686;font-weight:800}
  .v2 .bar{height:6px;border-radius:4px;background:#e4e8ee;margin:6px 0 8px;overflow:hidden}
  .v2 .bar i{display:block;height:100%;width:52%;background:#f2a93b}
  .v2 .vh{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e4e8ee;border-radius:10px;padding:5px 8px;font-size:11px;font-weight:800;color:#1f2a37}
  .v2 .slots{display:flex;gap:3px;margin-left:auto}
  .v2 .slots i{width:12px;height:12px;border-radius:3px;background:#e8590c}
  .v2 .mt{font-size:10px;font-weight:900;color:#6b7686;margin:9px 0 4px;letter-spacing:.5px}
  .v2 .m{background:#fff;border:1.5px solid #e4e8ee;border-left:5px solid #2f80ed;border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:11px;font-weight:800;color:#1f2a37}
  .v2 .m small{display:flex;justify-content:space-between;color:#6b7686;font-size:9.5px;font-weight:800;margin-top:2px}
  .v2 .m.warn{border-left-color:#ff5a4f;background:#fff4f3}
  .v2 .m.warn small b{color:#e03131}
  .v2 .m.lock{opacity:.55;border-left-color:#f5b800}
  .v2 .prog{height:4px;background:#eef1f5;border-radius:3px;margin-top:3px;overflow:hidden}
  .v2 .prog i{display:block;height:100%;background:#2f80ed}
  .v2 .turns{margin-top:auto;display:flex;gap:10px}
  .v2 .tb{flex:1;height:58px;border-radius:14px;background:#fff;border:2px solid #dfe4ea;display:grid;place-items:center;color:#1f2a37;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .v2 .tb .in{display:flex;flex-direction:column;align-items:center}
  .v2 .mm{right:10px;top:10px;width:150px;height:100px;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .v2 .pz{right:168px;top:10px;width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:#1f2a37;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .v2 .pz svg{width:18px;height:18px}
  .v2 .ctl{right:14px;bottom:14px;display:flex;gap:10px;align-items:flex-end}
  .v2 .sq{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .v2 .sq .in{display:flex;flex-direction:column;align-items:center}
  .v2 .act{right:14px;bottom:88px;display:flex;gap:8px}
  .v2 .ab{background:#fff;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:900;color:#1f2a37;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;gap:6px;align-items:center}

  /* ---------- V3: Tối giản nổi ---------- */
  .v3 .chip{background:rgba(20,28,38,.82);backdrop-filter:blur(4px);color:#fff;border-radius:22px}
  .v3 .tm{left:12px;top:12px;padding:5px 14px;font-size:24px;font-weight:900;display:flex;align-items:center;gap:7px}
  .v3 .tm svg{width:20px;height:20px}
  .v3 .ms{left:12px;top:56px;display:flex;gap:8px}
  .v3 .mc{width:50px;height:50px;border-radius:50%;position:relative;display:grid;place-items:center}
  .v3 .mc svg.ring{position:absolute;inset:0;width:50px;height:50px;transform:rotate(-90deg)}
  .v3 .mc .c{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:9.5px;font-weight:900;line-height:1}
  .v3 .mc .c svg{width:16px;height:16px;margin-bottom:2px}
  .v3 .mc .dd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;padding:1px 5px;border-radius:7px;background:#fff;color:#1d2733;white-space:nowrap}
  .v3 .mc.warn .dd{background:#ff4d42;color:#fff}
  .v3 .mc.lock{opacity:.6}
  .v3 .radar{right:12px;top:12px;width:96px;height:96px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .v3 .pz{right:116px;top:12px;width:36px;height:36px;display:grid;place-items:center}
  .v3 .pz svg{width:16px;height:16px}
  .v3 .tl{left:14px;bottom:14px;display:flex;gap:10px}
  .v3 .tbtn{width:70px;height:62px;display:grid;place-items:center;background:rgba(255,255,255,.82);border:2px solid #fff;color:#1d2733;border-radius:20px;backdrop-filter:blur(3px)}
  .v3 .tbtn svg{width:30px;height:30px}
  .v3 .tr{right:14px;bottom:14px;display:flex;gap:10px;align-items:flex-end}
  .v3 .tog{width:76px;height:76px;border-radius:50%;background:rgba(255,77,66,.9);border:3px solid #fff;color:#fff;display:grid;place-items:center}
  .v3 .tog .in{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:900}
  .v3 .ut{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;color:#1d2733}
  .v3 .bub{left:522px;top:176px;background:#fff;border-radius:14px;padding:6px 11px;font-size:11px;font-weight:900;color:#1d2733;box-shadow:0 3px 8px rgba(0,0,0,.25);display:flex;gap:5px;align-items:center}
  .v3 .bub:after{content:"";position:absolute;left:34px;bottom:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
  .v3 .cap{left:344px;top:190px;font-size:10px;font-weight:900;padding:2px 7px;border-radius:9px;background:#e8590c;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3)}

  /* ---------- V4: Bảng táp-lô ---------- */
  .v4 .top{left:10px;top:8px;right:158px;display:flex;gap:6px}
  .v4 .tk{background:rgba(43,38,33,.85);color:#fff3e0;border-radius:10px;padding:5px 9px;font-size:10.5px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .v4 .tk svg{width:15px;height:15px}
  .v4 .tk b{background:#ffe8c2;color:#3a2f26;border-radius:6px;padding:1px 5px;font-size:9.5px}
  .v4 .tk.warn b{background:#ff5a4f;color:#fff}
  .v4 .tk.lock{opacity:.6}
  .v4 .mm{right:10px;top:8px;width:140px;height:92px;border-radius:12px;overflow:hidden;border:3px solid #3a332c}
  .v4 .pz{right:10px;top:106px;width:38px;height:38px;border-radius:10px;background:rgba(43,38,33,.85);color:#fff3e0;display:grid;place-items:center}
  .v4 .pz svg{width:16px;height:16px}
  .v4 .dash{left:0;right:0;bottom:0;height:92px;background:linear-gradient(#3a332c,#2a2520);border-top:3px solid #5a4e43;border-radius:26px 26px 0 0;display:flex;align-items:center;padding:0 18px;gap:14px}
  .v4 .sig{width:74px;height:64px;border-radius:14px;background:#463d35;border:2px solid #5d5147;display:grid;place-items:center;color:#ffb627}
  .v4 .sig svg{width:34px;height:34px}
  .v4 .sig.glow{background:#5b4a2a}
  .v4 .gauge{width:108px;height:108px;margin-top:-34px;border-radius:50%;background:radial-gradient(#3a332c 58%,#2a2520 60%);border:4px solid #5a4e43;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff3e0;position:relative}
  .v4 .gauge b{font-size:28px;font-weight:900;line-height:1}
  .v4 .gauge small{font-size:9px;font-weight:800;color:#c9b8a5}
  .v4 .gauge svg.arc{position:absolute;inset:-4px;width:108px;height:108px;transform:rotate(135deg)}
  .v4 .load{display:flex;flex-direction:column;gap:4px;color:#fff3e0;font-size:10px;font-weight:800}
  .v4 .cells{display:flex;gap:4px}
  .v4 .cells i{width:20px;height:20px;border-radius:5px;background:#ffb627;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .v4 .actb{background:#463d35;border:2px solid #5d5147;color:#fff3e0;border-radius:12px;padding:10px 14px;font-weight:900;font-size:12px;display:flex;gap:6px;align-items:center}
  .v4 .sp{flex:1}
  .v4 .ut{width:52px;height:52px;border-radius:12px;background:#463d35;border:2px solid #5d5147;color:#fff3e0;display:grid;place-items:center}
  .v4 .rock{width:74px;height:74px;border-radius:16px;background:#463d35;border:2px solid #5d5147;display:flex;flex-direction:column;overflow:hidden}
  .v4 .rock div{flex:1;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff}
  .v4 .rock .s{background:#e8463a}
  .v4 .rock .g{background:#2f6b45;color:#9fc7a9}

  /* ---------- V5: Vé nhiệm vụ / kẹo ---------- */
  .v5 .tix{left:10px;top:10px;display:flex;gap:7px}
  .v5 .tkt{width:118px;background:#fff;border-radius:12px;padding:6px 8px 6px 10px;box-shadow:0 4px 0 #c9b6f0;position:relative;font-size:10px;font-weight:800;color:#3b2e5a}
  .v5 .tkt:before{content:"";position:absolute;left:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#a7e3c4}
  .v5 .tkt .h{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:900}
  .v5 .tkt .h svg{width:14px;height:14px}
  .v5 .tkt .n{font-size:18px;font-weight:900;color:#6c4ad6;line-height:1.1}
  .v5 .tkt .n span{font-size:10px;color:#9a8cc0}
  .v5 .tkt .d{display:inline-block;background:#f1ecff;color:#6c4ad6;padding:1px 6px;border-radius:7px;font-size:9.5px}
  .v5 .tkt.warn{box-shadow:0 4px 0 #ffb3ad}
  .v5 .tkt.warn .d{background:#ff6b5e;color:#fff}
  .v5 .tkt.lock{opacity:.65}
  .v5 .clock{left:50%;margin-left:30px;top:6px;width:92px;height:92px;border-radius:50%;background:#ffd84d;border:5px solid #fff;box-shadow:0 5px 0 #e0a800;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3b2e5a}
  .v5 .clock b{font-size:28px;font-weight:900;line-height:1}
  .v5 .clock small{font-size:9px;font-weight:900}
  .v5 .mm{right:10px;top:10px;width:128px;height:88px;border-radius:16px;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 0 #c9b6f0}
  .v5 .pz{right:10px;top:108px;width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #c9b6f0;display:grid;place-items:center;color:#6c4ad6}
  .v5 .pz svg{width:18px;height:18px}
  .v5 .veh{right:58px;top:110px;background:#fff;border-radius:12px;padding:5px 10px;font-size:10.5px;font-weight:900;color:#3b2e5a;box-shadow:0 4px 0 #c9b6f0;display:flex;gap:5px;align-items:center}
  .v5 .veh i{display:inline-block;width:10px;height:10px;border-radius:3px;background:#ff8a3d}
  .v5 .cb{border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:900}
  .v5 .cb .in{display:flex;flex-direction:column;align-items:center;font-size:10px}
  .v5 .bl{left:14px;bottom:14px;display:flex;gap:10px}
  .v5 .turn{width:68px;height:62px;background:#ffc93c;box-shadow:0 5px 0 #d99a00;color:#3b2e5a}
  .v5 .br{right:14px;bottom:14px;display:flex;gap:10px;align-items:flex-end}
  .v5 .stop{width:70px;height:70px;background:#ff6b5e;box-shadow:0 5px 0 #c9392e}
  .v5 .go{width:70px;height:70px;background:#3ccf7d;box-shadow:0 5px 0 #24995a}
  .v5 .ut{width:52px;height:52px;background:#9b7bff;box-shadow:0 5px 0 #6c4ad6}
  .v5 .act{left:50%;transform:translateX(-50%);bottom:16px}
  .v5 .ab{background:#ff8a3d;box-shadow:0 5px 0 #d4621c;border-radius:20px;padding:11px 20px;color:#fff;font-weight:900;font-size:13px;display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="phone"><svg id="map" viewBox="0 0 844 390" xmlns="http://www.w3.org/2000/svg"></svg><div id="hud"></div></div>
<script>
const V = new URLSearchParams(location.search).get('v') || '1';
const PAL = {
  day:   {grass:'#8fd16a',dot:'#a8e07f',road:'#4a4f57',walk:'#dfe2d9',line:'#f6f6f2',wall:'#f1e9dc',tree:'#5aa83a',treeD:'#3f8526',roofs:['#c4623f','#5b6b7d','#8b6a52','#4f7a5a','#b0563a','#6d5f8a'],shadow:'rgba(0,0,0,.18)'},
  fresh: {grass:'#88cf7a',dot:'#9edb8e',road:'#474d58',walk:'#e6e8e3',line:'#ffffff',wall:'#f6f2ea',tree:'#4fae5c',treeD:'#378a45',roofs:['#d0674a','#4f6d8f','#9a7b5c','#3f8a6b','#c58b3c','#7d6aa0'],shadow:'rgba(0,0,0,.16)'},
  soft:  {grass:'#a7d98c',dot:'#b7e19f',road:'#5a606a',walk:'#eceee8',line:'#ffffff',wall:'#f7f4ee',tree:'#79b85a',treeD:'#5d9a43',roofs:['#d9896c','#7a8ea6','#b39b80','#7aa58a','#d3aa6a','#9a8fb5'],shadow:'rgba(0,0,0,.12)'},
  warm:  {grass:'#e3c88d',dot:'#ecd6a6',road:'#56493f',walk:'#f3e5cc',line:'#fff6e4',wall:'#f8ecd8',tree:'#7ea85a',treeD:'#5f8a40',roofs:['#c4552f','#9c4a2c','#d07a3a','#7a5a44','#b8682e','#8d3f2a'],shadow:'rgba(60,30,0,.2)'},
  candy: {grass:'#a7e3c4',dot:'#bdebd3',road:'#5d6787',walk:'#eef1fb',line:'#ffffff',wall:'#ffffff',tree:'#6cc99a',treeD:'#4aa97a',roofs:['#ff8fa3','#7fb2ff','#ffc857','#b39cff','#ff9f6b','#6fd6c9'],shadow:'rgba(60,40,120,.16)'}
};
const P = PAL[{1:'day',2:'fresh',3:'soft',4:'warm',5:'candy',6:'day'}[V]];
const root = document.getElementById('map');
const NS='http://www.w3.org/2000/svg';
const svg=document.createElementNS('http://www.w3.org/2000/svg','g');root.appendChild(svg);if(V==='2')svg.setAttribute('transform','translate(110,0)');
function el(t,a,p=svg){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

// grass + speckles
el('rect',{x:-200,y:0,width:1244,height:390,fill:P.grass});
for(let i=0;i<260;i++)el('circle',{cx:rnd()*844,cy:rnd()*390,r:1+rnd()*1.6,fill:P.dot});

// roads: [x1,y1,x2,y2,width,dashed]
const roads=[[-140,215,864,215,42,1],[470,-20,470,410,42,1],[140,215,140,410,34,0],[470,55,864,55,34,0],[740,55,740,215,30,0],[640,215,640,410,18,0]];
const g=el('g',{});
roads.forEach(r=>el('line',{x1:r[0],y1:r[1],x2:r[2],y2:r[3],stroke:P.walk,'stroke-width':r[4]+14,'stroke-linecap':'square'},g));
roads.forEach(r=>el('line',{x1:r[0],y1:r[1],x2:r[2],y2:r[3],stroke:P.road,'stroke-width':r[4],'stroke-linecap':'square'},g));
// center dashes on main roads (skip intersection)
el('line',{x1:-140,y1:215,x2:440,y2:215,stroke:P.line,'stroke-width':2,'stroke-dasharray':'12 12',opacity:.75});
el('line',{x1:500,y1:215,x2:864,y2:215,stroke:P.line,'stroke-width':2,'stroke-dasharray':'12 12',opacity:.75});
el('line',{x1:470,y1:-20,x2:470,y2:185,stroke:P.line,'stroke-width':2,'stroke-dasharray':'12 12',opacity:.75});
el('line',{x1:470,y1:245,x2:470,y2:410,stroke:P.line,'stroke-width':2,'stroke-dasharray':'12 12',opacity:.75});
// crosswalks
function zebra(x,y,w,h,vert){for(let i=0;i<5;i++){vert?el('rect',{x:x,y:y+i*h/5+1,width:w,height:h/10,fill:P.line,opacity:.8}):el('rect',{x:x+i*w/5+1,y:y,width:w/10,height:h,fill:P.line,opacity:.8});}}
zebra(436,192,8,46,true);zebra(496,192,8,46,true);zebra(447,182,46,8,false);zebra(447,242,46,8,false);
// stop line before intersection (eastbound lane)
el('rect',{x:430,y:216,width:4,height:20,fill:'#fff'});

// houses
function house(x,y,w,h,c){
  el('rect',{x:x+5,y:y+6,width:w,height:h,fill:P.shadow,rx:2});
  el('rect',{x:x,y:y,width:w,height:h,fill:P.wall,rx:2});
  const dark=shade(c,-0.22);
