<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chủ đề khung cảnh</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#15181d;color:#fff;font-family:"Nunito","Segoe UI",sans-serif;padding:18px}
  .wrap{max-width:1200px}
  h1{font-size:20px;font-weight:900;margin-bottom:2px}
  .sub{font-size:13px;color:#aab3bd;margin-bottom:10px;line-height:1.4}
  .bar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
  .bar button{font:inherit;font-size:13px;font-weight:900;border:0;border-radius:18px;padding:7px 13px;background:#2c323b;color:#dfe5ec;cursor:pointer}
  .bar button.on{background:#ffd84d;color:#1d2733}
  .bar .lb{font-size:12px;color:#8d97a3;font-weight:800;margin-right:4px}
  .cap{font-size:13px;color:#dfe5ec;margin:12px 0 6px;font-weight:900}.cap span{color:#8d97a3;font-weight:800}
  #ov{display:block;width:100%;border-radius:10px;background:#000}
  .frame{position:relative;width:100%;max-width:1200px;aspect-ratio:844/390;border-radius:10px;overflow:hidden;background:#000}
  .frame>svg{position:absolute;inset:0;width:100%;height:100%}
  .hud{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;pointer-events:none;font-family:"Nunito",sans-serif}
  .chip{position:absolute;background:rgba(20,28,38,.85);color:#fff;border-radius:22px}
  .rb{position:absolute;width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);display:grid;place-items:center;color:#2d3440}
  .rb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .rb.glow{box-shadow:0 0 0 3px #ffd84d,0 0 14px 5px rgba(255,214,60,.8)}
  .rb.dim{opacity:.5}
  .mc{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(20,28,38,.85);display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff}
  .mc svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .mm{position:absolute;right:10px;top:10px;width:224px;height:112px;border-radius:12px;background:rgba(20,28,38,.85);border:2px solid #fff;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
<h1 id="ttl">Chủ đề khung cảnh</h1>
<div class="sub" id="sub"></div>
<div class="bar" id="bTheme"><span class="lb">Chủ đề</span></div>
<div class="bar" id="bStage"><span class="lb">Tiến độ chương</span></div>
<div class="cap">Toàn cảnh <span>— bản đồ chuẩn bị / bản đồ lớn, có cảnh ngoài mép và kỳ quan</span></div>
<svg id="ov"></svg>
<div class="cap">Lúc lái xe <span>— đúng tỉ lệ demo (khung 844×390), có giao diện điều khiển</span></div>
<div class="frame" id="frame"><svg id="drive" viewBox="0 0 844 390"><use href="#world"/></svg>
  <div class="hud" id="hud">
    <div class="chip" style="left:12px;top:12px;padding:5px 14px;font-size:24px;font-weight:900">⏱ 1:12</div>
    <div class="mc" style="left:12px;top:58px"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="22" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/><circle cx="25" cy="25" r="22" fill="none" stroke="#ff922b" stroke-width="4" stroke-dasharray="83 200"/></svg><span style="position:relative">1/3</span></div>
    <div class="mc" style="left:70px;top:58px"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="22" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/></svg><span style="position:relative">0/2</span></div>
    <div class="rb" style="right:242px;top:10px;width:40px;height:40px"><svg viewBox="0 0 26 26" style="width:18px;height:18px"><path d="M9 6 V20 M17 6 V20"/></svg></div>
    <div class="mm" id="mm"></div>
    <div class="rb glow" style="left:72px;bottom:120px"><svg viewBox="0 0 26 26"><path d="M13 20 V6 M7 12 L13 6 L19 12"/></svg></div>
    <div class="rb dim" style="left:14px;bottom:64px"><svg viewBox="0 0 26 26"><path d="M20 13 H6 M12 7 L6 13 L12 19"/></svg></div>
    <div class="rb glow" style="left:130px;bottom:64px"><svg viewBox="0 0 26 26"><path d="M6 13 H20 M14 7 L20 13 L14 19"/></svg></div>
    <div class="rb dim" style="left:72px;bottom:8px"><svg viewBox="0 0 26 26"><path d="M13 6 V20 M7 14 L13 20 L19 14"/></svg></div>
    <div class="rb" style="right:16px;bottom:14px"><svg viewBox="0 0 26 26"><path d="M8 20 V11 a5 5 0 0 1 10 0 V17 M14 13 L18 17 L22 13"/></svg></div>
  </div>
</div>
</div>
<script>
/* ======================= Nền tảng ======================= */
const NS='http://www.w3.org/2000/svg',SP=350,COLS=6,ROWS=4,W=200+(COLS-1)*SP,H=200+(ROWS-1)*SP,TL=.36; // TL: độ nghiêng camera (mặt tiền hiện ra = chiều cao × TL)
const RWD={thuong:46,lon:64,dong:46,gogh:46,hem:24};
const X=i=>100+i*SP,Y=j=>100+j*SP,N=(i,j)=>`c${i}r${j}`;
const row=(j,i0,i1)=>{const r=[];for(let i=i0;i<i1;i++)r.push([N(i,j),N(i+1,j)]);return r;};
const col=(i,j0,j1)=>{const r=[];for(let j=j0;j<j1;j++)r.push([N(i,j),N(i,j+1)]);return r;};
const EDGES=[];for(let j=0;j<ROWS;j++)for(let i=0;i<COLS-1;i++)EDGES.push([i,j,i+1,j]);for(let i=0;i<COLS;i++)for(let j=0;j<ROWS-1;j++)EDGES.push([i,j,i,j+1]);
let TH,STG,TY,L,OBJ,DEFS,UID=0;
const rv=k=>STG>k; // kỳ quan thứ k đã lộ
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
function rng(n){return()=>{n|=0;n=n+0x6D2B79F5|0;let t=Math.imul(n^n>>>15,1|n);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p):v+(255-v)*p)));return'#'+[f(n>>16),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');}
const pick=(a,r)=>a[Math.floor(r()*a.length)];
const ty=(i,j,i2,j2)=>TY[N(i,j)+'|'+N(i2,j2)]||'thuong';
const ty0=(i,j,i2,j2)=>{for(const t in TH.types)if(TH.types[t].some(([a,b])=>(a===N(i,j)&&b===N(i2,j2))||(b===N(i,j)&&a===N(i2,j2))))return t;return'thuong';};
function blockOf(bi,bj){const t=ty(bi,bj,bi+1,bj),b=ty(bi,bj+1,bi+1,bj+1),l=ty(bi,bj,bi,bj+1),r=ty(bi+1,bj,bi+1,bj+1),hw=k=>RWD[k]/2+7;
  return{x:X(bi)+hw(l),y:Y(bj)+hw(t),x2:X(bi+1)-hw(r),y2:Y(bj+1)-hw(b),T:t,B:b,L:l,R:r,bi,bj};}
function grad(type,stops,attrs={}){const id='g'+(UID++),g=el(type,{id,...attrs},DEFS);stops.forEach(([o,c,a])=>el('stop',{offset:o,'stop-color':c,'stop-opacity':a??1},g));return`url(#${id})`;}
const add=(k,fn)=>OBJ.push([k,fn]);
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const p of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(const p of P.reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}return lo.slice(0,-1).concat(up.slice(0,-1));}
function shadowRect(x,y,w,d,h){const dx=TH.sun[0]*h,dy=TH.sun[1]*h;
  el('polygon',{points:hull([[x,y],[x+w,y],[x+w,y+d],[x,y+d],[x+dx,y+dy],[x+w+dx,y+dy],[x+w+dx,y+d+dy],[x+dx,y+d+dy]]).map(p=>p.join(',')).join(' ')},L.shadow);}
function shadowDot(x,y,r,h){el('ellipse',{cx:x+TH.sun[0]*h*.9,cy:y+TH.sun[1]*h*.9,rx:r,ry:r*.8},L.shadow);}

/* ---------- khối nhà nghiêng nhẹ: mái + mặt tiền hướng nam ---------- */
function box(o){const {x,y,w,d,h}=o,hb=o.hb||0,t=h*TL,tb=hb*TL;
  if(!o.noShadow)shadowRect(x,y,w,d,h);
  add(y+d+(o.z||0),g=>{const fy=y+d-t,fh=t-tb;
    if(fh>.5){el('rect',{x,y:fy,width:w,height:fh,fill:o.wall},g);
      if(o.win)windows(g,x,fy,w,fh,o);
      if(o.facade)o.facade(g,x,fy,w,fh);
      el('rect',{x,y:fy+fh-1.6,width:w,height:1.6,fill:'rgba(0,0,0,.28)'},g);
      if(TH.night&&o.win)el('rect',{x:x-6,y:fy-4,width:w+12,height:fh+14,fill:'#ffb547',opacity:.07},L.glow);}
    (ROOF[o.roof||'flat'])(g,o,x,y-t,w,d);
    if(o.top)o.top(g,x,y-t,w,d);});}
function windows(g,x,y,w,h,o){const c=o.win,gx=c.gx||8,gy=c.gy||9,ww=c.w||4.2,wh=c.h||5,r=o.r;
  const cols=Math.floor((w-4)/gx),rows=Math.floor((h-2)/gy);if(cols<1||rows<1)return;
  const ox=x+(w-cols*gx)/2+(gx-ww)/2,oy=y+(h-rows*gy)/2+(gy-wh)/2-1;
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const lit=r()<(c.lit??TH.lit);el('rect',{x:ox+j*gx,y:oy+i*gy,width:ww,height:wh,fill:lit?pick(c.cols||TH.winLit,r):TH.winOff},g);}}
const ROOF={
  flat(g,o,x,y,w,d){el('rect',{x,y,width:w,height:d,fill:shade(o.roofC,-.18)},g);el('rect',{x:x+2.5,y:y+2.5,width:w-5,height:d-5,fill:o.roofC},g);
    el('path',{d:`M${x+.8} ${y+d-.8} V${y+.8} H${x+w-.8}`,fill:'none',stroke:shade(o.roofC,TH.rim||.28),'stroke-width':1.6},g);},
  none(){},
  hip(g,o,x,y,w,d){const c=o.roofC;el('rect',{x,y,width:w,height:d,fill:shade(c,-.2)},g);
    if(w>=d){el('polygon',{points:`${x},${y} ${x+w},${y} ${x+w-d/2},${y+d/2} ${x+d/2},${y+d/2}`,fill:shade(c,.08)},g);el('polygon',{points:`${x},${y+d} ${x+w},${y+d} ${x+w-d/2},${y+d/2} ${x+d/2},${y+d/2}`,fill:shade(c,-.16)},g);
      el('polygon',{points:`${x},${y} ${x+d/2},${y+d/2} ${x},${y+d}`,fill:c},g);el('polygon',{points:`${x+w},${y} ${x+w-d/2},${y+d/2} ${x+w},${y+d}`,fill:shade(c,-.26)},g);}
    else{el('polygon',{points:`${x},${y} ${x},${y+d} ${x+w/2},${y+d-w/2} ${x+w/2},${y+w/2}`,fill:c},g);el('polygon',{points:`${x+w},${y} ${x+w},${y+d} ${x+w/2},${y+d-w/2} ${x+w/2},${y+w/2}`,fill:shade(c,-.26)},g);
      el('polygon',{points:`${x},${y} ${x+w},${y} ${x+w/2},${y+w/2}`,fill:shade(c,.08)},g);el('polygon',{points:`${x},${y+d} ${x+w},${y+d} ${x+w/2},${y+d-w/2}`,fill:shade(c,-.16)},g);}},
  vault(g,o,x,y,w,d){const f=grad('linearGradient',[[0,shade(o.roofC,.35)],[.45,o.roofC],[1,shade(o.roofC,-.22)]],{x1:0,y1:0,x2:0,y2:1});
    el('rect',{x,y,width:w,height:d,rx:Math.min(w,d)*.18,fill:f},g);},
  dome(g,o,x,y,w,d){const cx=x+w/2,cy=y+d/2,R=Math.min(w,d)/2;el('rect',{x,y,width:w,height:d,fill:shade(o.wall,-.05)},g);
    const f=grad('radialGradient',[[0,shade(o.roofC,.45)],[.55,o.roofC],[1,shade(o.roofC,-.35)]],{cx:.38,cy:.32,r:.75});
    el('ellipse',{cx,cy:cy-R*.25,rx:R,ry:R*.95,fill:f},g);el('circle',{cx,cy:cy-R*1.05,r:1.8,fill:shade(o.roofC,.6)},g);},
};
function tree(x,y,r,h,c,c2){c=c||TH.tree;c2=c2||shade(c,-.25);shadowDot(x,y,r,h);
  add(y,g=>{const t=h*TL;el('line',{x1:x,y1:y,x2:x,y2:y-t+2,stroke:TH.trunk||'#5a4636','stroke-width':2},g);
    const p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;p.push([x+r*Math.cos(a),y-t+r*.92*Math.sin(a)]);}
    el('polygon',{points:p.map(q=>q.join(',')).join(' '),fill:c},g);
    el('polygon',{points:`${x},${y-t} ${p[0]} ${p[1]} ${p[2]}`,fill:c2},g);el('polygon',{points:`${x},${y-t} ${p[3]} ${p[4]} ${p[5]}`,fill:shade(c,.12)},g);});}
function palm(x,y,r,h){shadowDot(x,y,r*.8,h);
  add(y,g=>{const t=h*TL,cx=x,cy=y-t;el('path',{d:`M${x} ${y} Q${x+2} ${y-t/2} ${cx} ${cy}`,stroke:'#8a6a45','stroke-width':2.2,fill:'none'},g);
    for(let i=0;i<8;i++){const a=Math.PI*2*i/8+.2,ex=cx+Math.cos(a)*r,ey=cy+Math.sin(a)*r*.85;
      el('path',{d:`M${cx} ${cy} Q${(cx+ex)/2+Math.sin(a)*3} ${(cy+ey)/2-Math.cos(a)*3} ${ex} ${ey}`,stroke:i%2?TH.palm:shade(TH.palm,-.25),'stroke-width':3.4,'stroke-linecap':'round',fill:'none'},g);}
    el('circle',{cx,cy,r:2.2,fill:shade(TH.palm,-.4)},g);});}
function lamp(x,y,s=1,free){add(y,g=>{el('line',{x1:x,y1:y,x2:x,y2:y-13,stroke:'#1c1f25','stroke-width':1.6},g);el('circle',{cx:x,cy:y-13,r:2.1,fill:'#fff3cf'},g);});
  el('circle',{cx:x,cy:y-3,r:36*s,fill:'url(#lampG)'},free?L.light:L.lamp);}
function unitRect(side,B,p,w,sb,d){return side==='T'?{x:p,y:B.y+sb,w,h:d}:side==='B'?{x:p,y:B.y2-sb-d,w,h:d}:side==='L'?{x:B.x+sb,y:p,w:d,h:w}:{x:B.x2-sb-d,y:p,w:d,h:w};}
// Dãy nhà dọc một cạnh ô. Mái nghiêng lên phía bắc nên nhà sát cạnh bắc được lùi vào để không che đường.
function frontage(B,side,sp,r,a0,a1,fn){let p=a0,gi=0,left=0,grp=null;
  while(p<a1-6){let w=sp.uw[0]+r()*(sp.uw[1]-sp.uw[0]);const gap=sp.gap?sp.gap[0]+r()*(sp.gap[1]-sp.gap[0]):0;
    if(!gap){if(a1-p<w+sp.uw[0]*.7)w=a1-p;}else{if(a1-p<sp.uw[0])break;w=Math.min(w,a1-p);}
    if(left<=0){left=(sp.grp||[1,1])[0]+Math.floor(r()*(((sp.grp||[1,1])[1]-(sp.grp||[1,1])[0])+1));grp={k:gi++,r:r()};}left--;
    let h=sp.h[0]+r()*(sp.h[1]-sp.h[0]);const u=unitRect(side,B,p,w,sp.sb,sp.d);
    if(side==='T')u.y+=h*TL;else{const m=(u.y-B.y)/TL;if(h>m)h=Math.max(4,m);}
    fn(u,h,grp,side);p+=w+gap;}}
function depthOf(sp,side){return sp.sb+sp.d+(side==='T'?sp.h[1]*TL:0);}

/* ---------- biển báo loại đường (giữ nguyên ở mọi chủ đề) ---------- */
function sign(t,x,y){const g=el('g',{transform:`translate(${x},${y})`},L.top);
  el('ellipse',{cx:3,cy:13,rx:7,ry:2.5,fill:'rgba(0,0,0,.35)'},g);el('line',{x1:0,y1:12,x2:0,y2:0,stroke:'#9aa1a9','stroke-width':2},g);
  const s=el('g',{transform:'translate(0,-6)'},g);
  if(t==='lon'){el('rect',{x:-11,y:-11,width:22,height:22,rx:4,fill:'#1c7ed6',stroke:'#fff','stroke-width':2},s);[-5,0,5].forEach(dx=>el('line',{x1:dx,y1:-6,x2:dx,y2:6,stroke:'#fff','stroke-width':1.6,'stroke-dasharray':dx?'3 2':''},s));}
  else if(t==='hem'){el('circle',{r:11,fill:'#fff',stroke:'#e03131','stroke-width':3},s);el('rect',{x:-6,y:-3,width:12,height:6,rx:2,fill:'#1d2733'},s);el('line',{x1:-7,y1:7,x2:7,y2:-7,stroke:'#e03131','stroke-width':2.4},s);}
  else{el('path',{d:'M0 -12 L12 9 H-12Z',fill:'#ffd43b',stroke:t==='dong'?'#e8590c':'#8d5a2b','stroke-width':2.6,'stroke-linejoin':'round'},s);
    if(t==='dong'){el('rect',{x:-7,y:0,width:6,height:4,rx:1,fill:'#1d2733'},s);el('rect',{x:1,y:0,width:6,height:4,rx:1,fill:'#1d2733'},s);}
    else el('path',{d:'M-7 5 q2 -5 4 0 q2 -5 4 0 q2 -5 4 0',fill:'none',stroke:'#1d2733','stroke-width':1.6},s);}}
function pin(p){const g=el('g',{transform:`translate(${p.x},${p.y})`},L.top);
  if(TH.night)el('circle',{r:26,fill:p.col,opacity:.35,filter:'url(#blur6)'},g);
  el('ellipse',{cx:2,cy:17,rx:11,ry:4,fill:'rgba(0,0,0,.35)'},g);
  const ring=TH.pinRing||'#fff';if(TH.pinEdge){p.sq?el('rect',{x:-16.5,y:-16.5,width:33,height:33,rx:8,fill:'#1d2733'},g):el('circle',{r:17.5,fill:'#1d2733'},g);}
  p.sq?el('rect',{x:-14,y:-14,width:28,height:28,rx:6,fill:p.col,stroke:ring,'stroke-width':3},g):el('circle',{r:15,fill:p.col,stroke:ring,'stroke-width':3},g);
  el('path',{d:p.sq?'M0 4 V-7 M-5 -2 L0 -7 L5 -2 M-6 7 H6':'M0 -7 V4 M-5 -1 L0 4 L5 -1 M-6 8 H6',fill:'none',stroke:'#fff','stroke-width':2.4,'stroke-linecap':'round'},g);
  const t=el('text',{y:34,'text-anchor':'middle','font-size':15,'font-weight':900,fill:'#fff',stroke:'#11161d','stroke-width':4,'paint-order':'stroke','font-family':'Nunito'},g);t.textContent=p.name;}
function car(g,x,y,ang,c,o={}){const t=el('g',{transform:`translate(${x},${y}) rotate(${ang})`},g),len=o.len||18;
  el('rect',{x:-len/2+2,y:-3,width:len,height:10,rx:2.5,fill:'rgba(0,0,0,.3)'},t);
  el('rect',{x:-len/2,y:-5,width:len,height:10,rx:2.5,fill:c,stroke:'rgba(0,0,0,.35)','stroke-width':.8},t);
  el('rect',{x:len/2-8,y:-3.6,width:4,height:7.2,rx:1,fill:'rgba(25,35,50,.65)'},t);el('rect',{x:-len/2+2,y:-3.6,width:3,height:7.2,rx:1,fill:'rgba(25,35,50,.5)'},t);
  if(o.taxi)el('rect',{x:-2,y:-2,width:3,height:4,rx:.8,fill:'#fff6c8'},t);
  if(TH.night){const L2=el('g',{transform:`translate(${x},${y}) rotate(${ang})`},L.light);
    el('path',{d:`M${len/2} -4 L${len/2+30} -11 L${len/2+30} 11 L${len/2} 4Z`,fill:'url(#beamG)'},L2);
    el('circle',{cx:-len/2,cy:-3,r:3,fill:'#ff3b3b',opacity:.8},L2);el('circle',{cx:-len/2,cy:3,r:3,fill:'#ff3b3b',opacity:.8},L2);}}

/* ---------- vẽ một bản đồ ---------- */
function drawWorld(svg){svg.innerHTML='';UID=0;OBJ=[];
  DEFS=el('defs',{},svg);

let curT=0,curS=0;const hs=location.hash;{const m=hs.match(/t=(\w+)/);if(m)curT=Math.max(0,THEMES.findIndex(t=>t.key===m[1]));const s=hs.match(/s=(\d)/);if(s)curS=+s[1];}

  const t=el('text',{y:4,'text-anchor':'middle','font-size':12,'font-weight':900,fill:'#fff','font-family':'Nunito'},bd);t.textContent='2/4';
