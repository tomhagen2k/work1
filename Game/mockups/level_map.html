<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mẫu màn hình danh sách màn</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:844px;height:390px;overflow:hidden;font-family:"Nunito","Segoe UI",sans-serif;background:#222}
  #s{position:relative;width:844px;height:390px;overflow:hidden}
  svg{position:absolute;inset:0}
  .abs{position:absolute}
  .top{left:10px;top:10px;display:flex;gap:8px;align-items:center}
  .chip{background:rgba(20,28,38,.85);color:#fff;border-radius:18px;padding:6px 12px;font-size:13px;font-weight:900}
  .card{background:#fff;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.2);padding:10px 12px;color:#2d3440}
  .card .n{font-size:10px;font-weight:900;color:#1c7ed6}
  .card .t{font-size:16px;font-weight:900;margin:2px 0 4px}
  .card .d{font-size:11px;font-weight:800;color:#6b7686;line-height:1.35}
  .card .row{display:flex;gap:8px;margin-top:6px;font-size:11px;font-weight:900}
  .tag{display:inline-flex;align-items:center;gap:4px;background:#fff3bf;color:#8a6d00;border-radius:8px;padding:2px 7px;font-size:10px;font-weight:900}
  .play{margin-top:8px;background:#37c26b;color:#fff;border-radius:18px;padding:9px;text-align:center;font-weight:900;font-size:14px;box-shadow:0 4px 0 #24995a}
  .ch{background:#fff;border-radius:12px;padding:7px 10px;box-shadow:0 3px 0 rgba(0,0,0,.15);font-size:11px;font-weight:900;color:#2d3440;margin-bottom:7px}
  .ch small{display:block;font-size:9.5px;color:#6b7686}
  .ch .bar{height:5px;border-radius:3px;background:#e9ecef;margin-top:4px;overflow:hidden}
  .ch .bar i{display:block;height:100%;background:#37c26b}
  .ch.on{outline:3px solid #ffd43b}
  .ch.lock{opacity:.6}
</style>
</head>
<body><div id="s"><svg id="g" viewBox="0 0 844 390"></svg><div id="hud"></div></div>
<script>
const V=new URLSearchParams(location.search).get('v')||'1';
const NS='http://www.w3.org/2000/svg',S=document.getElementById('g');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e;}
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
const CUR=5;
const NEW={1:'Làm quen',2:'Chia chuyến',3:'Đường đông',4:'Hạn giao',5:'Chọn xe',11:'Chở khách',16:'Đổi xe',21:'Cầu theo giờ'};
const BEST={1:'0:31',2:'0:52',3:'1:01',4:'1:38'};
function house(x,y,w,h,c){el('rect',{x:x+3,y:y+4,width:w,height:h,fill:'rgba(0,0,0,.15)',rx:2});el('rect',{x,y,width:w,height:h,fill:c,rx:2});
  el('polygon',{points:`${x},${y} ${x+w},${y} ${x+w/2},${y+h/2}`,fill:'rgba(255,255,255,.18)'});}
function tree(x,y,r){el('circle',{cx:x+2,cy:y+3,r,fill:'rgba(0,0,0,.15)'});el('circle',{cx:x,cy:y,r,fill:'#5aa83a'});el('path',{d:`M${x} ${y-r} A${r} ${r} 0 0 1 ${x} ${y+r}Z`,fill:'#3f8526'});}
function scenery(x0,y0,x1,y1,cols){for(let i=0;i<70;i++){const x=x0+rnd()*(x1-x0),y=y0+rnd()*(y1-y0);if(rnd()<.45)tree(x,y,6+rnd()*5);else house(x,y,16+rnd()*14,12+rnd()*10,cols[Math.floor(rnd()*cols.length)]);}}
function road(d,w){el('path',{d,fill:'none',stroke:'#dfe2d9','stroke-width':w+10,'stroke-linecap':'round','stroke-linejoin':'round'});
  el('path',{d,fill:'none',stroke:'#4a4f57','stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'});
  el('path',{d,fill:'none',stroke:'#f6f6f2','stroke-width':2,'stroke-dasharray':'10 10',opacity:.7});}
function node(x,y,n,r){r=r||20;const done=n<CUR,cur=n===CUR;
  if(cur){el('circle',{cx:x,cy:y,r:r+10,fill:'rgba(255,212,59,.35)'});}
  el('circle',{cx:x,cy:y+3,r,fill:'rgba(0,0,0,.25)'});
  el('circle',{cx:x,cy:y,r,fill:done?'#37c26b':cur?'#fff':'#ced4da',stroke:cur?'#ffd43b':'#fff','stroke-width':cur?5:3});
  const t=el('text',{x,y:y+6,'text-anchor':'middle','font-size':r>18?16:13,'font-weight':900,fill:done?'#fff':cur?'#2d3440':'#868e96','font-family':'Nunito'});t.textContent=n;
  if(done){el('circle',{cx:x+r*.75,cy:y-r*.75,r:8,fill:'#fff'});el('path',{d:`M${x+r*.75-4} ${y-r*.75} l3 3 l5 -6`,fill:'none',stroke:'#2b8a3e','stroke-width':2.4,'stroke-linecap':'round'});
    if(BEST[n]){const b=el('text',{x,y:y+r+14,'text-anchor':'middle','font-size':10,'font-weight':900,fill:'#2d3440',stroke:'#fff','stroke-width':3,'paint-order':'stroke','font-family':'Nunito'});b.textContent='⏱ '+BEST[n];}}
  if(NEW[n]&&n>=CUR){const g=el('g',{transform:`translate(${x-r*.8},${y-r*.85})`});el('circle',{r:9,fill:'#ff922b',stroke:'#fff','stroke-width':2},g);
    const s=el('text',{y:4,'text-anchor':'middle','font-size':11,'font-weight':900,fill:'#fff','font-family':'Nunito'},g);s.textContent='!';}
  if(cur){van(x+r+20,y-6);}
}
function van(x,y){const g=el('g',{transform:`translate(${x},${y})`});el('rect',{x:-15,y:-6,width:32,height:16,rx:4,fill:'rgba(0,0,0,.25)'},g);
  el('rect',{x:-17,y:-9,width:32,height:16,rx:4,fill:'#fff',stroke:'#c9ced6'},g);el('rect',{x:-15,y:-7,width:20,height:12,rx:2,fill:'#e9edf2'},g);el('rect',{x:7,y:-7,width:5,height:12,rx:1.5,fill:'#2b3a4a'},g);}
function sign(x,y,txt,sub,col){const g=el('g',{transform:`translate(${x},${y})`});
  el('rect',{x:-2,y:0,width:4,height:26,fill:'#6b5b4b'},g);el('rect',{x:-88,y:-30,width:176,height:34,rx:8,fill:col,stroke:'#fff','stroke-width':3},g);
  const a=el('text',{y:-15,'text-anchor':'middle','font-size':12,'font-weight':900,fill:'#fff','font-family':'Nunito'},g);a.textContent=txt;
  const b=el('text',{y:-2,'text-anchor':'middle','font-size':9.5,'font-weight':800,fill:'rgba(255,255,255,.9)','font-family':'Nunito'},g);b.textContent=sub;}
const H=document.getElementById('hud');
const detail=(n,x,y,w)=>`<div class="abs card" style="left:${x}px;top:${y}px;width:${w}px"><div class="n">MÀN ${n} · CHƯƠNG 1</div><div class="t">${NEW[n]||'Màn '+n}</div>
  <div class="d">Xe máy, xe van hay xe tải? Mỗi xe hợp với một kiểu đường.</div>
  <div class="row"><span>⏱ 1:42</span><span class="tag">MỚI · Chọn xe</span></div><div class="play">Chơi</div></div>`;

if(V==='1'){ // Đường uốn lượn leo lên (cuộn dọc)
  el('rect',{width:844,height:390,fill:'#8fd16a'});
  el('rect',{x:0,y:-10,width:844,height:120,fill:'#9ec9e8',opacity:.35});
  scenery(0,0,600,390,['#c4623f','#5b6b7d','#8b6a52','#4f7a5a']);
  // tọa độ các màn: hàng 3 màn, đổi chiều mỗi hàng, đi từ dưới lên
  const P=[];const xs=[110,290,470];let y=345;
  for(let r=0;r<5;r++){const row=r%2?[...xs].reverse():xs;row.forEach(x=>P.push([x,y]));y-=78;}
  let d=`M${P[0][0]-60} ${P[0][1]} L${P[0][0]} ${P[0][1]}`;
  for(let i=1;i<P.length;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i];if(y0===y1)d+=` L${x1} ${y1}`;else{const side=x0>300?1:-1;d+=` C${x0+side*80} ${y0} ${x1+side*80} ${y1} ${x1} ${y1}`;}}
  road(d,26);
  P.forEach(([x,y],i)=>node(x,y,i+1,i+1===CUR?24:20));
  sign(470,60,'CHƯƠNG 2 · TRUNG TÂM','Mở khóa ở màn 11','#7048e8');
  H.innerHTML=`<div class="abs top"><span class="chip">🏠 Trang chủ</span><span class="chip">Chương 1 · Khu phố nhỏ · 4/10</span></div>`+detail(5,600,40,226)
   +`<div class="abs chip" style="left:10px;bottom:10px;font-size:11px">▲ Cuộn lên để xem màn tiếp theo</div>`;
}
if(V==='2'){ // Đường ngang qua các khu phố (cuộn ngang)
  const bands=[[0,650,'#8fd16a','Khu phố nhỏ'],[650,844,'#b2d98a','Trung tâm']];
  bands.forEach(([a,b,c])=>el('rect',{x:a,y:0,width:b-a,height:390,fill:c}));
  scenery(0,0,844,140,['#c4623f','#5b6b7d','#8b6a52']);scenery(0,280,844,390,['#c4623f','#5b6b7d','#4f7a5a']);
  const P=[];for(let i=0;i<13;i++){P.push([40+i*64,205+Math.sin(i*.9)*42]);}
  let d=`M0 ${P[0][1]}`;P.forEach(([x,y])=>d+=` L${x} ${y}`);d+=` L844 ${P[12][1]}`;
  road(d.replace(/L/g,'L'),26);
  P.forEach(([x,y],i)=>node(x,y,i+1,i+1===CUR?22:18));
  sign(745,120,'CHƯƠNG 2 · TRUNG TÂM','Màn 11–20','#7048e8');
  H.innerHTML=`<div class="abs top"><span class="chip">🏠 Trang chủ</span><span class="chip">4/30 màn đã đạt</span></div>`+detail(5,560,250,270).replace('<div class="d">','<div class="d" style="display:none">')
   +`<div class="abs chip" style="left:10px;bottom:10px;font-size:11px">◀ ▶ Vuốt ngang để đi tiếp</div>`;
}
if(V==='3'){ // Chương bên trái + bậc thang leo trong chương
  el('rect',{width:844,height:390,fill:'#8fd16a'});
  el('rect',{width:200,height:390,fill:'#2b3440'});
  scenery(220,0,844,390,['#c4623f','#5b6b7d','#8b6a52','#4f7a5a']);
  // 10 màn trong chương: 5 tầng x 2, zigzag lên trên
  const P=[];let y=352;for(let r=0;r<5;r++){const a=[300,470],row=r%2?[...a].reverse():a;row.forEach(x=>P.push([x,y]));y-=72;}
  let d=`M${P[0][0]} ${P[0][1]+40} L${P[0][0]} ${P[0][1]}`;
  for(let i=1;i<P.length;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i];if(y0===y1)d+=` L${x1} ${y1}`;else{const s=x0>380?1:-1;d+=` C${x0+s*60} ${y0} ${x1+s*60} ${y1} ${x1} ${y1}`;}}
  road(d,24);
  P.forEach(([x,y],i)=>node(x,y,i+1,i+1===CUR?23:19));
  // đỉnh chương: phần thưởng mở khóa
  const g=el('g',{transform:'translate(385,22)'});el('rect',{x:-60,y:-14,width:120,height:26,rx:13,fill:'#ffd43b',stroke:'#fff','stroke-width':3},g);
  const t=el('text',{y:4,'text-anchor':'middle','font-size':11,'font-weight':900,fill:'#5c3d00','font-family':'Nunito'},g);t.textContent='🏁 Hết chương 1';
  const chs=[['Chương 1 · Khu phố nhỏ','Làm quen, chia chuyến, đường đông, hạn giao, chọn xe',40,'on'],['Chương 2 · Trung tâm','Chở khách, đổi xe',0,'lock'],['Chương 3 · Cảng','Cầu mở theo giờ, xe tải',0,'lock'],['Chương 4 · Ngoại ô','…',0,'lock']];
  H.innerHTML=`<div class="abs" style="left:10px;top:10px;width:180px"><div class="chip" style="display:inline-block;margin-bottom:8px">🏠 Trang chủ</div>`
   +chs.map(([a,b,p,c])=>`<div class="ch ${c}">${a}<small>${b}</small><div class="bar"><i style="width:${p}%"></i></div></div>`).join('')+`</div>`
   +detail(5,600,40,226);
}
</script></body></html>
