<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-isle-1024" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="48" stdDeviation="36" flood-color="#09090b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS Master App Icon 1024x1024 - Exact Concept 4 Artwork -->
  <!-- Scaled from original 120x120 viewBox -->
  <g transform="scale(8.533333)">
    <!-- Base White Squircle Card -->
    <rect x="12" y="12" width="96" height="96" rx="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow-isle-1024)"/>

    <!-- Island 1 (Bottom Left - Start Warehouse) -->
    <rect x="24" y="56" width="32" height="32" rx="8" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="30" y="62" width="12" height="12" rx="2" fill="#d97706" stroke="#92400e" stroke-width="1"/>

    <!-- Island 2 (Top Right - Goal House) -->
    <rect x="64" y="24" width="32" height="32" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="80,28 72,36 88,36" fill="#ef4444"/>
    <rect x="74" y="36" width="12" height="12" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>

    <!-- Golden Connecting Highway Bridging them -->
    <path d="M48,72 L72,72 L72,48 L80,48" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48,72 L72,72 L72,48 L80,48" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cute Trees in Center -->
    <circle cx="34" cy="42" r="6" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
    <circle cx="42" cy="46" r="4.5" fill="#4ade80"/>
  </g>
</svg>
