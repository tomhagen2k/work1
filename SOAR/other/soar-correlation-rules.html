<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOAR Correlation Rules</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const { useState } = React;

/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS  (SOAR Design System)
═══════════════════════════════════════════════════════════ */
const DS = {
  bg0:"#f0f2f5", bg1:"#ffffff", bg2:"#ffffff", bg3:"#f5f7fa", bg4:"#eaecf0",
  border:"#dde1e8", border2:"#c8cdd7",
  accent:"#1d6bf3", accentH:"#2f7bff", accentDim:"rgba(29,107,243,0.10)",
  text:"#1a1d23", text2:"#3d4452", text3:"#6b7280", text4:"#9ca3af",
  crit:"#dc2626", high:"#ea580c", med:"#d97706", low:"#16a34a",
  mono:"'JetBrains Mono',monospace", sans:"'Inter',sans-serif",
};

/* Severity maps */
const SEV = {
  critical:{ text:"#ef4444", bg:"rgba(239,68,68,.12)",  border:"rgba(239,68,68,.28)",  dot:"#ef4444" },
  high:    { text:"#f97316", bg:"rgba(249,115,22,.12)", border:"rgba(249,115,22,.28)", dot:"#f97316" },
  medium:  { text:"#f59e0b", bg:"rgba(245,158,11,.12)", border:"rgba(245,158,11,.28)", dot:"#f59e0b" },
  low:     { text:"#22c55e", bg:"rgba(34,197,94,.12)",  border:"rgba(34,197,94,.28)",  dot:"#22c55e" },
};

/* ═══════════════════════════════════════════════════════════
   SVG ICONS
═══════════════════════════════════════════════════════════ */
const IC = ({ n, s=14, c="" }) => {
  const d = {
    shield:  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
    plus:    <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    search:  <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    filter:  <><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></>,
    edit:    <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
    trash:   <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
    copy:    <><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>,
    play:    <polygon points="5 3 19 12 5 21 5 3"/>,
    chevR:   <polyline points="9 18 15 12 9 6"/>,
    chevL:   <polyline points="15 18 9 12 15 6"/>,
    check:   <polyline points="20 6 9 15 4 10"/>,
    x:       <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    info:    <><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
    link:    <><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></>,
    zap:     <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
    clock:   <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
    alert:   <><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
    layers:  <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
    sliders: <><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></>,
    eye:     <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
    spin:    <path d="M21 12a9 9 0 1 1-6.219-8.56"/>,
    power:   <><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></>,
    tag:     <><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></>,
    settings:<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
  };
  return (
    <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
      className={c} style={{ display:"inline-block", verticalAlign:"middle", flexShrink:0 }}>
      {d[n]}
    </svg>
  );
};

/* ═══════════════════════════════════════════════════════════
   BASE COMPONENTS
═══════════════════════════════════════════════════════════ */

/* Severity badge — JetBrains Mono */
const SevBadge = ({ sev }) => {
  const s = SEV[sev] || SEV.low;
  return (
    <span style={{ fontFamily:DS.mono, fontSize:10, fontWeight:700, letterSpacing:".04em",
      padding:"2px 7px", borderRadius:4,
      color:s.text, background:s.bg, border:`1px solid ${s.border}` }}>
      {sev.toUpperCase()}
    </span>
  );
};

/* Status pill */
const StatusPill = ({ active }) => (
  <span style={{ fontFamily:DS.mono, fontSize:10, fontWeight:700, letterSpacing:".04em",
    padding:"2px 7px", borderRadius:4, display:"inline-flex", alignItems:"center", gap:4,
    color: active ? DS.low : DS.text3,
    background: active ? "rgba(22,163,74,.10)" : "rgba(107,114,128,.10)",
    border: active ? "1px solid rgba(22,163,74,.25)" : "1px solid rgba(107,114,128,.22)" }}>
    <span style={{ width:5, height:5, borderRadius:"50%", background: active?DS.low:DS.text3 }}/>
    {active ? "Hoạt động" : "Không hoạt động"}
  </span>
);

/* Toggle switch */
const Toggle = ({ value, onChange }) => (
  <button onClick={()=>onChange(!value)}
    style={{ position:"relative", width:36, height:20, borderRadius:10, border:"none",
      cursor:"pointer", padding:0, flexShrink:0,
      background: value ? DS.accent : DS.border2, transition:"background .2s" }}>
    <span style={{ position:"absolute", top:2, left: value?18:2, width:16, height:16,
      borderRadius:8, background:"#fff", boxShadow:"0 1px 3px rgba(0,0,0,.2)",
      transition:"left .18s", display:"block" }}/>
  </button>
);

/* Button */
const Btn = ({ children, variant="ghost", size="md", icon, onClick, disabled }) => {
  const h = { sm:26, md:30 }[size] || 30;
  const px = { sm:"4px 8px", md:"5px 11px" }[size] || "5px 11px";
  const styles = {
    primary: { background:DS.accentDim, border:`1px solid rgba(29,107,243,.4)`, color:DS.accent },
    ghost:   { background:"transparent", border:`1px solid ${DS.border}`, color:DS.text3 },
    danger:  { background:"rgba(239,68,68,.10)", border:"1px solid rgba(239,68,68,.30)", color:DS.crit },
    dashed:  { background:"transparent", border:`1px dashed ${DS.border2}`, color:DS.text3 },
  };
  const s = styles[variant] || styles.ghost;
  return (
    <button onClick={disabled?undefined:onClick} disabled={disabled}
      style={{ display:"inline-flex", alignItems:"center", gap:5, height:h, padding:px,
        fontFamily:DS.sans, fontSize:11, fontWeight:600, borderRadius:6,
        cursor:disabled?"not-allowed":"pointer", transition:"all .15s",
        opacity:disabled?0.45:1, whiteSpace:"nowrap", ...s }}
      onMouseEnter={e=>{ if(!disabled) e.currentTarget.style.filter="brightness(1.15)"; }}
      onMouseLeave={e=>{ e.currentTarget.style.filter=""; }}>
      {icon && <IC n={icon} s={12}/>}{children}
    </button>
  );
};

/* Icon action button (toolbar) */
const IconBtn = ({ icon, tip, onClick, danger, disabled }) => (
  <button onClick={disabled?undefined:onClick} title={tip}
    style={{ display:"inline-flex", alignItems:"center", justifyContent:"center",
      width:26, height:26, borderRadius:6, border:`1px solid ${DS.border}`,
      background:DS.bg3, cursor:disabled?"not-allowed":"pointer",
      color: danger ? DS.crit : DS.text2,
      opacity:disabled?0.35:1, transition:"all .15s" }}
    onMouseEnter={e=>{ if(!disabled){ e.currentTarget.style.borderColor=danger?"rgba(239,68,68,.4)":DS.accent; e.currentTarget.style.color=danger?DS.crit:DS.accent; e.currentTarget.style.background=danger?"rgba(239,68,68,.08)":DS.accentDim; }}}
    onMouseLeave={e=>{ e.currentTarget.style.borderColor=DS.border; e.currentTarget.style.color=danger?DS.crit:DS.text2; e.currentTarget.style.background=DS.bg3; }}>
    <IC n={icon} s={12}/>
  </button>
);

/* Input */
const Input = ({ value, onChange, placeholder, type="text", error, mono, style={} }) => {
  const [focus, setFocus] = useState(false);
  return (
    <div style={{ position:"relative" }}>
      <input type={type} value={value} onChange={onChange} placeholder={placeholder}
        onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)}
        style={{ display:"block", width:"100%", height:30, padding:"4px 10px", fontSize:11,
          fontFamily: mono ? DS.mono : DS.sans,
          border:`1px solid ${error ? DS.crit : focus ? DS.accent : DS.border}`,
          borderRadius:6, outline:"none", background:DS.bg3, color:DS.text,
          boxSizing:"border-box", ...style }}/>
      {error && (
        <div style={{ color:DS.crit, fontSize:10, marginTop:3, fontFamily:DS.sans,
          display:"flex", alignItems:"center", gap:3 }}>
          <IC n="alert" s={10}/>{error}
        </div>
      )}
    </div>
  );
};

/* Select */
const Sel = ({ value, onChange, options, style={} }) => {
  const [focus, setFocus] = useState(false);
  return (
    <select value={value} onChange={onChange}
      onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)}
      style={{ height:30, padding:"4px 24px 4px 8px", fontSize:11, fontFamily:DS.sans,
        border:`1px solid ${focus?DS.accent:DS.border}`, borderRadius:6, outline:"none",
        background:`${DS.bg3} url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 8px center`,
        color:DS.text2, cursor:"pointer", appearance:"none", WebkitAppearance:"none",
        transition:"border-color .15s", ...style }}>
      {options.map(o => typeof o==="string"
        ? <option key={o} value={o}>{o}</option>
        : <option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  );
};

/* Section card for step 2 */
const SCard = ({ num, color, icon, title, subtitle, badge, children }) => (
  <div style={{ display:"flex", gap:0 }}>
    <div style={{ width:32, flexShrink:0, display:"flex", flexDirection:"column", alignItems:"center" }}>
      <div style={{ width:24, height:24, borderRadius:"50%", background:color,
        display:"flex", alignItems:"center", justifyContent:"center",
        fontFamily:DS.mono, fontSize:10, fontWeight:700, color:"#fff", flexShrink:0 }}>
        {num}
      </div>
    </div>
    <div style={{ flex:1, border:`1px solid ${DS.border}`, borderRadius:8, background:DS.bg2 }}>
      <div style={{ padding:"8px 14px", borderBottom:`1px solid ${DS.border}`,
        background:`linear-gradient(to right,${color}08,transparent)`, borderRadius:"8px 8px 0 0",
        display:"flex", alignItems:"center", gap:8 }}>
        <IC n={icon} s={13} c="" style={{ color }}/>
        <span style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text }}>{title}</span>
        {subtitle && <span style={{ fontSize:11, color:DS.text3 }}>{subtitle}</span>}
        {badge && (
          <span style={{ marginLeft:"auto", fontFamily:DS.mono, fontSize:9, fontWeight:700,
            letterSpacing:".06em", textTransform:"uppercase",
            padding:"2px 7px", borderRadius:4,
            background:color+"15", color, border:`1px solid ${color}30` }}>
            {badge}
          </span>
        )}
      </div>
      <div style={{ padding:"12px 14px" }}>{children}</div>
    </div>
  </div>
);

const SConnector = () => (
  <div style={{ display:"flex", gap:0, margin:"0" }}>
    <div style={{ width:32, flexShrink:0, display:"flex", justifyContent:"center" }}>
      <div style={{ borderLeft:`2px dashed ${DS.border2}`, height:16 }}/>
    </div>
    <div style={{ flex:1 }}/>
  </div>
);

/* Form label row */
const FLabel = ({ label, required, help }) => (
  <div style={{ display:"flex", alignItems:"center", gap:4, marginBottom:5 }}>
    {required && <span style={{ color:DS.crit, fontSize:12 }}>*</span>}
    <label style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text2 }}>{label}</label>
    {help && (
      <span title={help} style={{ cursor:"help", display:"inline-flex", color:DS.text4 }}>
        <IC n="info" s={11}/>
      </span>
    )}
  </div>
);

const FItem = ({ label, required, help, error, children }) => (
  <div style={{ marginBottom:16 }}>
    <FLabel label={label} required={required} help={help}/>
    {children}
    {error && (
      <div style={{ color:DS.crit, fontFamily:DS.sans, fontSize:10, marginTop:3,
        display:"flex", alignItems:"center", gap:3 }}>
        <IC n="alert" s={10}/>{error}
      </div>
    )}
  </div>
);

/* Summary Grid Components */
const Grid2 = ({ children }) => (
  <div style={{ display:"grid", gridTemplateColumns:"150px 1fr", rowGap:8, alignItems:"start" }}>
    {children}
  </div>
);
const Lbl = ({ children }) => (
  <span style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text3, marginTop:2 }}>{children}</span>
);
const Val = ({ children }) => (
  <span style={{ fontFamily:DS.mono, fontSize:11, color:DS.text, wordBreak:"break-all" }}>{children}</span>
);

/* Stat card */
const StatCard = ({ icon, label, value, color }) => (
  <div style={{ background:DS.bg2, border:`1px solid ${DS.border}`, borderRadius:8,
    padding:"12px 16px", display:"flex", alignItems:"center", gap:12 }}>
    <div style={{ width:36, height:36, borderRadius:8, background:`${color}12`,
      display:"flex", alignItems:"center", justifyContent:"center" }}>
      <IC n={icon} s={18} c="" style={{ color }}/>
    </div>
    <div>
      <div style={{ fontFamily:DS.mono, fontSize:20, fontWeight:700, color:DS.text, lineHeight:1 }}>{value}</div>
      <div style={{ fontFamily:DS.sans, fontSize:11, color:DS.text3, marginTop:3 }}>{label}</div>
    </div>
  </div>
);

/* Toast */
const Toast = ({ msg, type }) => {
  const isOk = type==="success";
  return (
    <div style={{ position:"fixed", bottom:28, right:28, zIndex:9999,
      background:DS.bg2, border:`1px solid ${DS.border}`, borderRadius:10,
      boxShadow:"0 8px 24px rgba(0,0,0,.12)", padding:"12px 16px",
      display:"flex", alignItems:"center", gap:10, maxWidth:340,
      fontFamily:DS.sans, fontSize:12, color:DS.text2,
      animation:"slideUpToast .25s ease-out" }}>
      <span style={{ fontSize:16 }}>{isOk ? "✅" : "🗑️"}</span>
      <span style={{ fontWeight:700, color:DS.text }}>{msg}</span>
    </div>
  );
};

/* Searchable select */
const SearchSel = ({ value, onChange, options }) => {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const filtered = options.filter(o=>o.toLowerCase().includes(q.toLowerCase()));
  return (
    <div style={{ position:"relative" }}>
      <div onClick={()=>setOpen(o=>!o)}
        style={{ display:"flex", alignItems:"center", justifyContent:"space-between", height:30,
          padding:"4px 10px", fontSize:11, fontFamily:DS.sans,
          border:`1px solid ${open?DS.accent:DS.border}`, borderRadius:6,
          background:DS.bg3, cursor:"pointer", color:DS.text2 }}>
        <span>{value||"Chưa chỉ định"}</span>
        <IC n="chevR" s={11} c="" style={{ color:DS.text3,
          transform:open?"rotate(270deg)":"rotate(90deg)", transition:"transform .15s" }}/>
      </div>
      {open && (
        <div style={{ position:"absolute", top:"calc(100% + 3px)", left:0, right:0, zIndex:300,
          background:DS.bg2, border:`1px solid ${DS.border}`, borderRadius:6,
          boxShadow:"0 10px 28px rgba(0,0,0,.12)", overflow:"hidden" }}>
          <div style={{ padding:"5px 7px", borderBottom:`1px solid ${DS.border}` }}>
            <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm tên..."
              style={{ width:"100%", height:26, padding:"2px 8px", fontSize:11, fontFamily:DS.mono,
                border:`1px solid ${DS.border}`, borderRadius:4, outline:"none",
                background:DS.bg3, color:DS.text, boxSizing:"border-box" }}/>
          </div>
          <div style={{ maxHeight:150, overflowY:"auto" }}>
            {filtered.length===0
              ? <div style={{ padding:"9px 12px", fontSize:11, color:DS.text3 }}>Không tìm thấy</div>
              : filtered.map(o=>(
                <div key={o} onClick={()=>{ onChange(o); setOpen(false); setQ(""); }}
                  style={{ padding:"7px 12px", fontSize:11, fontFamily:DS.sans, cursor:"pointer",
                    background:value===o?DS.accentDim:DS.bg2, color:value===o?DS.accent:DS.text2,
                    borderBottom:`1px solid ${DS.border}`,
                    display:"flex", alignItems:"center", justifyContent:"space-between" }}
                  onMouseEnter={e=>{ if(value!==o) e.currentTarget.style.background=DS.bg3; }}
                  onMouseLeave={e=>{ if(value!==o) e.currentTarget.style.background=DS.bg2; }}>
                  {o}{value===o && <IC n="check" s={11} c="" style={{ color:DS.accent }}/>}
                </div>
              ))}
          </div>
        </div>
      )}
    </div>
  );
};

/* Severity dropdown */
const SevSel = ({ value, onChange }) => {
  const [open, setOpen] = useState(false);
  const opts = [
    { v:"critical", l:"Critical", dot:DS.crit },
    { v:"high",     l:"High",     dot:DS.high },
    { v:"medium",   l:"Medium",   dot:DS.med  },
    { v:"low",      l:"Low",      dot:DS.low  },
  ];
  const cur = opts.find(o=>o.v===value) || opts[1];
  return (
    <div style={{ position:"relative" }}>
      <div onClick={()=>setOpen(o=>!o)}
        style={{ display:"flex", alignItems:"center", gap:7, height:30, padding:"4px 10px",
          fontSize:11, fontFamily:DS.sans,
          border:`1px solid ${open?DS.accent:DS.border}`, borderRadius:6,
          background:DS.bg3, cursor:"pointer" }}>
        <span style={{ width:8, height:8, borderRadius:"50%", background:cur.dot, flexShrink:0 }}/>
        <span style={{ flex:1, color:DS.text2, fontWeight:500 }}>{cur.l}</span>
        <IC n="chevR" s={11} c="" style={{ color:DS.text3,
          transform:open?"rotate(270deg)":"rotate(90deg)", transition:"transform .15s" }}/>
      </div>
      {open && (
        <div style={{ position:"absolute", top:"calc(100% + 3px)", left:0, right:0, zIndex:300,
          background:DS.bg2, border:`1px solid ${DS.border}`, borderRadius:6,
          boxShadow:"0 10px 28px rgba(0,0,0,.12)", overflow:"hidden" }}>
          {opts.map(opt=>(
            <div key={opt.v} onClick={()=>{ onChange(opt.v); setOpen(false); }}
              style={{ padding:"7px 12px", fontSize:11, fontFamily:DS.sans, cursor:"pointer",
                background:value===opt.v?DS.accentDim:DS.bg2, color:DS.text2,
                borderBottom:`1px solid ${DS.border}`,
                display:"flex", alignItems:"center", gap:8 }}
              onMouseEnter={e=>{ if(value!==opt.v) e.currentTarget.style.background=DS.bg3; }}
              onMouseLeave={e=>{ if(value!==opt.v) e.currentTarget.style.background=DS.bg2; }}>

          ))}
        </div>
      )}
    </div>
  );
};

      if (!form.customerId) e.customerId="Khách hàng không được để trống";

        e.name = "Tên Rule đã tồn tại trong Khách hàng này";

      if (form.filterGroups.flatMap(g=>g.conditions.map(c=>c.val.trim())).some(v=>!v)) e.f1v="Tất cả điều kiện cần có giá trị";

      if (!form.thrN||form.thrN<1) e.thr="Phải ≥ 1";
    }
    setErrs(e); return !Object.keys(e).length;
  };

    let order = editing?.executionOrder;

      const cusRules = rules.filter(r => r.customerId === form.customerId);

    cusRules.splice(targetIndex, 0, draggedItem);

                                    <button onClick={()=>sf("caseTags", form.caseTags.filter(x=>x!==tag))} style={{ background:"none", border:"none", cursor:"pointer", padding:0, color:DS.accent, display:"flex" }}><IC n="x" s={10} /></button>
                                  </span>
                                )})}
                                <div style={{ flex:1, minWidth:150, display:"flex", alignItems:"center" }}>
                                  <select value="" onChange={e=>{ if(e.target.value) sf("caseTags",[...(form.caseTags||[]), e.target.value]); }}
                                    style={{ flex:1, border:"none", background:"transparent", height:24, outline:"none", padding:0, fontSize:11, color:DS.text, fontFamily:DS.sans }}>
                                    <option value="" disabled style={{ color:DS.text4 }}>-- Chọn nhãn --</option>
                                    {tagList.filter(t=>!(form.caseTags||[]).includes(t.code)).map(t=>(
                                      <option key={t.code} value={t.code}>{t.nameVn}</option>
                                    ))}
                                  </select>
                                </div>
                              </div>
                              <button onClick={()=>setShowTagModal(true)} style={{ flexShrink:0, background:DS.bg2, border:`1px dashed ${DS.border2}`, color:DS.text2, height:34, borderRadius:6, padding:"0 12px", fontSize:11, fontFamily:DS.sans, fontWeight:600, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }} onMouseEnter={e=>{e.currentTarget.style.borderColor=DS.accent;e.currentTarget.style.color=DS.accent;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=DS.border2;e.currentTarget.style.color=DS.text2;}}>
                                <IC n="plus" s={11}/> Tạo nhãn mới
                              </button>
                            </div>
                          </FItem>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* ── STEP 3: XÁC NHẬN CẤU HÌNH ── */}
                {step===3 && (
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:7, marginBottom:10,
                      fontFamily:DS.sans, fontSize:14, fontWeight:700, color:DS.text, textTransform:"uppercase" }}>
                      XÁC NHẬN CẤU HÌNH
                    </div>
                    <div style={{ fontSize:11, color:DS.text4, marginBottom: 20 }}>
                      Xem lại toàn bộ cấu hình trước khi lưu
                    </div>

                    <div style={{ background:DS.bg3, borderRadius:6, border:`1px solid ${DS.border}`, padding:"16px", marginBottom:16 }}>
                      <div style={{ fontSize:12, fontWeight:700, color:DS.text, marginBottom:12 }}>Thông tin chung</div>
                      <Grid2>
                        <Lbl>Khách hàng:</Lbl><Val>{MOCK_CUSTOMERS.find(c=>c.id===form.customerId)?.name || "—"}</Val>
                        <Lbl>Tên quy tắc:</Lbl><Val>{form.name}</Val>
                        <Lbl>Mô tả:</Lbl><Val>{form.desc||"—"}</Val>
                        <Lbl>Trạng thái:</Lbl><Val><StatusPill active={form.active!==false}/></Val>
                      </Grid2>
                    </div>

                    <div style={{ background:DS.bg3, borderRadius:6, border:`1px solid ${DS.border}`, padding:"16px", marginBottom:16 }}>
                      <div style={{ fontSize:12, fontWeight:700, color:DS.text, marginBottom:12 }}>Điều kiện lọc & Threshold</div>
                      <Grid2>
                        <Lbl>Filter:</Lbl>
                        <Val>
                          {form.filterGroups.map((g,gi)=>(
                            <div key={g.id}>
                              {gi>0 && <span style={{ color:DS.high, fontSize:10, fontWeight:700, marginRight:6 }}>OR</span>}
                              {g.conditions.map(c=>`${c.field} ${c.op} "${c.val}"`).join(` ${g.logic} `)}
                            </div>
                          ))}
                        </Val>
                        <Lbl>Group field:</Lbl><Val>{form.groupBy && form.groupBy.length > 0 ? form.groupBy.join(", ") : "—"}</Val>
                        <Lbl>Threshold:</Lbl>
                        <Val>{">"} {form.thrN} sự việc trong khoảng {form.tw} phút</Val>
                      </Grid2>
                    </div>

                    <div style={{ background:DS.bg3, borderRadius:6, border:`1px solid ${DS.border}`, padding:"16px", marginBottom:16 }}>
                      <div style={{ fontSize:12, fontWeight:700, color:DS.text, marginBottom:12 }}>Action & Case Template</div>
                      <Grid2>
                        <Lbl>Tiêu đề sự việc:</Lbl><Val>{form.title}</Val>
                        <Lbl>Loại sự việc:</Lbl><Val>{form.caseType || "Sự cố"}</Val>
                        <Lbl>Đơn vị xử lý:</Lbl><Val>{form.assignUnit}</Val>
                        <Lbl>Người thực hiện:</Lbl><Val>{form.assignPerson||"—"}</Val>
                        <Lbl>Mức độ nghiêm trọng:</Lbl><Val>{form.caseSeverity}</Val>
                        <Lbl>Chính sách SLA:</Lbl><Val>{form.caseSLA}</Val>
                        <Lbl>Cấu hình gộp sự việc:</Lbl><Val>{form.merge?"Bật":"Tắt"}</Val>
                      </Grid2>
                    </div>
                  </div>
                )}

                {/* Footer */}
                <div style={{ display:"flex", justifyContent:"flex-end", gap:10, marginTop:24,
                  paddingTop:20, borderTop:`1px solid ${DS.border}` }}>
                  {step > 1 && (
                    <Btn variant="ghost" onClick={()=>setStep(step-1)}>Quay lại</Btn>
                  )}
                  {step < 3 ? (
                    <Btn variant="primary" onClick={()=>handleNext(step)}>Tiếp tục</Btn>
                  ) : (
                    <Btn variant="primary" icon="check"
                      onClick={()=>{ setModal(false); handleSave(); }}>
                      {editing?"Lưu quy tắc":"Tạo quy tắc"}
                    </Btn>
                  )}
                </div>
              </div>
              </div>
            </div>
            </div>
          )}


          {/* ── TAG MODAL ── */}
          {showTagModal && (
            <div style={{ position:"fixed", inset:0, zIndex:1100, background:"rgba(15,20,30,.45)", backdropFilter:"blur(3px)", display:"flex", alignItems:"center", justifyContent:"center" }} onClick={e=>{if(e.target===e.currentTarget) setShowTagModal(false);}}>
              <div style={{ background:DS.bg1, borderRadius:8, width:500, border:`1px solid ${DS.border}`, boxShadow:"0 20px 60px rgba(0,0,0,.18)", display:"flex", flexDirection:"column" }}>
                <div style={{ padding:"14px 18px", borderBottom:`1px solid ${DS.border}`, background:DS.accent, borderRadius:"8px 8px 0 0", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div style={{ fontFamily:DS.sans, fontSize:13, fontWeight:700, color:"#fff" }}>Tạo mới nhãn dán</div>
                  <button onClick={()=>setShowTagModal(false)} style={{ background:"none", border:"none", color:"#fff", cursor:"pointer", padding:0, display:"flex" }}><IC n="x" s={14}/></button>
                </div>
                <div style={{ padding:"20px 24px", flex:1 }}>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16 }}>
                    <div>
                      <div style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text, marginBottom:6 }}>Tên <span style={{color:DS.crit}}>*</span></div>
                      <input value={newTag.nameVn} onChange={e=>setNewTag({...newTag, nameVn:e.target.value})} placeholder="Nhập tên nhãn dán" style={{ width:"100%", height:32, padding:"0 10px", fontSize:11, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg2, color:DS.text, boxSizing:"border-box" }} />
                    </div>
                    <div>
                      <div style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text, marginBottom:6 }}>&nbsp;</div>
                      <input value={newTag.nameEn} onChange={e=>setNewTag({...newTag, nameEn:e.target.value})} placeholder="Tiếng Anh" style={{ width:"100%", height:32, padding:"0 10px", fontSize:11, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg2, color:DS.text, boxSizing:"border-box" }} />
                    </div>
                  </div>
                  <div style={{ marginBottom:16 }}>
                    <div style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text, marginBottom:6 }}>Mã <span style={{color:DS.crit}}>*</span></div>
                    <input value={newTag.code} onChange={e=>setNewTag({...newTag, code:e.target.value})} placeholder="Nhập mã" style={{ width:"100%", height:32, padding:"0 10px", fontSize:11, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg2, color:DS.text, boxSizing:"border-box" }} />
                  </div>
                  <div style={{ marginBottom:16 }}>
                    <div style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text, marginBottom:6 }}>Trạng thái</div>
                    <div style={{ display:"flex", gap:20, alignItems:"center", height:32 }}>
                      <label style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer", fontFamily:DS.sans, fontSize:11, color:DS.text2 }}>
                        <input type="radio" checked={newTag.active} onChange={()=>setNewTag({...newTag, active:true})} style={{ accentColor:DS.accent }}/> Kích hoạt
                      </label>
                      <label style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer", fontFamily:DS.sans, fontSize:11, color:DS.text2 }}>
                        <input type="radio" checked={!newTag.active} onChange={()=>setNewTag({...newTag, active:false})} style={{ accentColor:DS.accent }}/> Không kích hoạt
                      </label>
                    </div>
                  </div>
                  <div>
                    <div style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text, marginBottom:6 }}>Mô tả</div>
                    <textarea value={newTag.desc} onChange={e=>setNewTag({...newTag, desc:e.target.value})} placeholder="Nhập mô tả" rows={4} style={{ width:"100%", padding:"10px", fontSize:11, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg2, color:DS.text, boxSizing:"border-box", resize:"vertical" }} />
                  </div>
                </div>
                <div style={{ padding:"16px 24px", borderTop:`1px solid ${DS.border}`, background:DS.bg1, borderRadius:"0 0 8px 8px", display:"flex", justifyContent:"flex-end", gap:10 }}>
                  <button onClick={()=>setShowTagModal(false)} style={{ background:"transparent", border:`1px solid ${DS.accent}`, color:DS.accent, padding:"0 16px", height:32, borderRadius:6, fontSize:11, fontFamily:DS.sans, fontWeight:600, cursor:"pointer" }}>HỦY</button>
                  <button onClick={()=>{
                    if(!newTag.nameVn || !newTag.code) { notify("Vui lòng nhập Tên và Mã","error"); return; }
                    const nextList = [...tagList, newTag];
                    setTagList(nextList);
                    sf("caseTags", [...(form.caseTags||[]), newTag.code]);
                    setShowTagModal(false);
                    setNewTag({ nameVn:"", nameEn:"", code:"", active:true, desc:"" });
                    notify("Tạo nhãn thành công");
                  }} style={{ background:DS.accent, border:"none", color:"#fff", padding:"0 16px", height:32, borderRadius:6, fontSize:11, fontFamily:DS.sans, fontWeight:600, cursor:"pointer" }}>TẠO MỚI</button>
                </div>
              </div>
            </div>
          )}

          {/* ── FIELD MODAL ── */}
          {showFieldModal && (
            <FieldModal fields={fields} setFields={setFields} onClose={()=>setShowFieldModal(false)} />
          )}

          {/* ── CLONE MODAL ── */}
          {cloneModal && (
            <CloneModal rule={cloneModal} rules={rules} customers={MOCK_CUSTOMERS}
              onClose={()=>setCloneModal(null)}
              onConfirm={(selectedCustomerIds) => {
                let newRules = [...rules];
                selectedCustomerIds.forEach(cusId => {
                  let name = cloneModal.name;
                  let counter = 1;
                  while (newRules.some(r => r.customerId === cusId && r.name.toLowerCase() === name.toLowerCase())) {
                    name = `${cloneModal.name} (${counter++})`;
                  }
                  const cusRules = newRules.filter(r => r.customerId === cusId);
                  const maxOrder = cusRules.length ? Math.max(...cusRules.map(r=>r.executionOrder)) : 0;
                  newRules.push({
                    ...cloneModal,
                    id: Date.now() + Math.random(),
                    customerId: cusId,
                    name: name,
                    executionOrder: maxOrder + 1,
                    active: false,
                    cases: 0,
                    updated: new Date().toISOString().slice(0,10)
                  });
                });
                setRules(newRules);
                setCloneModal(null);
                notify(`Đã nhân bản Rule cho ${selectedCustomerIds.length} khách hàng`);
              }}
            />
          )}

        </main>
      </div>
    </div>
  );
}

/* ── CLONE MODAL COMPONENT ── */
const CloneModal = ({ rule, rules, customers, onClose, onConfirm }) => {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState([rule.customerId]);
  const filtered = customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
  const allSel = filtered.length > 0 && filtered.every(c=>sel.includes(c.id));
  
  const toggleAll = () => {
    if (allSel) {
      setSel(sel.filter(id => !filtered.some(c=>c.id===id)));
    } else {
      const newSel = new Set([...sel, ...filtered.map(c=>c.id)]);
      setSel(Array.from(newSel));
    }
  };

  return (
    <div style={{ position:"fixed", inset:0, zIndex:1000, background:"rgba(15,20,30,.45)", backdropFilter:"blur(3px)", display:"flex", alignItems:"center", justifyContent:"center" }} onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div style={{ background:DS.bg2, borderRadius:10, width:400, border:`1px solid ${DS.border}`, boxShadow:"0 20px 60px rgba(0,0,0,.18)" }}>
        <div style={{ padding:"14px 18px", borderBottom:`1px solid ${DS.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ fontFamily:DS.sans, fontSize:13, fontWeight:700, color:DS.text }}>Nhân bản Rule</div>
          <IconBtn icon="x" tip="Đóng" onClick={onClose}/>
        </div>
        <div style={{ padding:"16px 18px" }}>
          <div style={{ fontFamily:DS.sans, fontSize:11, color:DS.text3, marginBottom:12 }}>
            Chọn các khách hàng bạn muốn sao chép rule <strong style={{color:DS.text}}>{rule.name}</strong> tới:
          </div>
          <div style={{ position:"relative", marginBottom:10 }}>
            <span style={{ position:"absolute", left:8, top:8, color:DS.text4 }}><IC n="search" s={12}/></span>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm khách hàng..."
              style={{ width:"100%", height:30, padding:"4px 10px 4px 26px", fontSize:11, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg3, color:DS.text }}/>
          </div>
          <div style={{ border:`1px solid ${DS.border}`, borderRadius:6, overflow:"hidden" }}>
            <div style={{ padding:"8px 12px", background:DS.bg3, borderBottom:`1px solid ${DS.border}` }}>
              <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer" }}>
                <input type="checkbox" checked={allSel} onChange={toggleAll} style={{ accentColor:DS.accent }}/>
                <span style={{ fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.text2 }}>Chọn tất cả</span>
              </label>
            </div>
            <div style={{ maxHeight:200, overflowY:"auto" }}>
              {filtered.map(c=>(
                <label key={c.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 12px", cursor:"pointer", borderBottom:`1px solid ${DS.border}`, background:DS.bg2 }}>
                  <input type="checkbox" checked={sel.includes(c.id)} onChange={e=>{
                    if(e.target.checked) setSel([...sel, c.id]);
                    else setSel(sel.filter(id=>id!==c.id));
                  }} style={{ accentColor:DS.accent }}/>
                  <span style={{ fontFamily:DS.sans, fontSize:11, color:DS.text }}>{c.name}</span>
                </label>
              ))}
              {!filtered.length && <div style={{ padding:"12px", textAlign:"center", fontSize:11, color:DS.text4 }}>Không tìm thấy khách hàng</div>}
            </div>
          </div>
        </div>
        <div style={{ padding:"12px 18px", borderTop:`1px solid ${DS.border}`, background:DS.bg3, borderRadius:"0 0 10px 10px", display:"flex", justifyContent:"flex-end", gap:8 }}>
          <Btn variant="ghost" onClick={onClose}>Huỷ</Btn>
          <Btn variant="primary" onClick={()=>onConfirm(sel)} disabled={sel.length===0}>Xác nhận Nhân bản</Btn>
        </div>
      </div>
    </div>
  );
};

/* ── FIELD MODAL COMPONENT ── */
const FieldModal = ({ fields, setFields, onClose }) => {
  const [step, setStep] = useState(1); // 1: list, 2: edit/add
  const [editItem, setEditItem] = useState(null);

  const TYPES = ["STRING", "NUMBER", "BOOLEAN", "DATETIME", "ARRAY"];

  const handleEdit = (f) => {
    setEditItem(f);
    setStep(2);
  };
  const handleAdd = () => {
    setEditItem({ key:"", labelVn:"", labelEn:"", valuePath:"", type:"STRING" });
    setStep(2);
  };
  const handleDelete = (id) => {
    if(confirm("Bạn có chắc muốn xóa trường này?")) {
      setFields(fields.filter(f=>f.id !== id));
    }
  };
  const handleSave = () => {
    if(!editItem.key || !editItem.valuePath) {
      alert("Vui lòng điền đủ Field Key và Value Path");
      return;
    }
    if (editItem.id) {
      setFields(fields.map(f => f.id === editItem.id ? editItem : f));
    } else {
      setFields([...fields, { ...editItem, id: Date.now() + Math.random() }]);
    }
    setStep(1);
  };

  return (
    <div style={{ position:"fixed", inset:0, zIndex:1100, background:"rgba(15,20,30,.45)", backdropFilter:"blur(3px)", display:"flex", alignItems:"center", justifyContent:"center" }} onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div style={{ background:DS.bg1, borderRadius:8, width:800, maxHeight:"90vh", display:"flex", flexDirection:"column", border:`1px solid ${DS.border}`, boxShadow:"0 20px 60px rgba(0,0,0,.18)" }}>
        
        {step === 1 && (
          <>
            <div style={{ padding:"16px 24px", borderBottom:`1px solid ${DS.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div style={{ fontFamily:DS.sans, fontSize:15, fontWeight:700, color:DS.text }}>Quản lý Trường dữ liệu</div>
              <div style={{ display:"flex", gap:16, alignItems:"center" }}>
                <button onClick={handleAdd} style={{ background:"#2684FF", border:"none", borderRadius:6, padding:"8px 16px", color:"#fff", fontFamily:DS.sans, fontSize:11, fontWeight:700, cursor:"pointer" }}>+ THÊM TRƯỜNG</button>
                <IconBtn icon="x" onClick={onClose} tip="Đóng"/>
              </div>
            </div>
            <div style={{ padding:"24px", overflowY:"auto", flex:1 }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead>
                  <tr>
                    {["STT","Field Key","Nhãn (VI)","Nhãn (EN)","Value Path","Kiểu dữ liệu",""].map(h => (
                      <th key={h} style={{ padding:"12px 10px", textAlign:"left", fontFamily:DS.sans, fontSize:11, fontWeight:600, color:DS.accent, borderBottom:`2px solid #2684FF`, whiteSpace:"nowrap" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {fields.map((f, i) => (
                    <tr key={f.id} style={{ borderBottom:`1px solid ${DS.border}` }}>
                      <td style={{ padding:"12px 10px", fontFamily:DS.sans, fontSize:12, color:DS.text3, textAlign:"center" }}>{i+1}</td>
                      <td style={{ padding:"12px 10px", fontFamily:DS.sans, fontSize:12, color:"#2684FF", fontWeight:600 }}>{f.key}</td>
                      <td style={{ padding:"12px 10px", fontFamily:DS.sans, fontSize:12, color:DS.text2 }}>{f.labelVn}</td>
                      <td style={{ padding:"12px 10px", fontFamily:DS.sans, fontSize:12, color:DS.text3 }}>{f.labelEn}</td>
                      <td style={{ padding:"12px 10px", fontFamily:DS.sans, fontSize:12, color:DS.text4 }}>{f.valuePath}</td>
                      <td style={{ padding:"12px 10px", fontFamily:DS.sans, fontSize:12, color:"#2684FF", fontWeight:700 }}>{f.type}</td>
                      <td style={{ padding:"12px 10px", display:"flex", gap:12, justifyContent:"flex-end" }}>
                        <button onClick={()=>handleEdit(f)} style={{ background:"none", border:"none", cursor:"pointer", color:"#2684FF", padding:0 }}><IC n="edit" s={14}/></button>
                        <button onClick={()=>handleDelete(f.id)} style={{ background:"none", border:"none", cursor:"pointer", color:DS.crit, padding:0 }}><IC n="trash" s={14}/></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}

        {step === 2 && (
          <>
            <div style={{ padding:"16px 24px", borderBottom:`1px solid ${DS.border}`, display:"flex", alignItems:"center", gap:12 }}>
              <button onClick={()=>setStep(1)} style={{ background:"transparent", border:"none", cursor:"pointer", padding:0, color:"#2684FF", display:"flex" }}>
                <IC n="chevL" s={16}/>
              </button>
              <span style={{ fontFamily:DS.sans, fontSize:15, fontWeight:700, color:DS.text }}>{editItem.id ? "Cập nhật trường dữ liệu" : "Thêm trường dữ liệu mới"}</span>
            </div>
            <div style={{ padding:"24px", overflowY:"auto", flex:1 }}>
              <div style={{ marginBottom:20 }}>
                <div style={{ fontFamily:DS.sans, fontSize:12, fontWeight:700, color:DS.text, marginBottom:8 }}>Field Key <span style={{color:DS.crit}}>*</span></div>
                <input value={editItem.key} onChange={e=>setEditItem({...editItem, key:e.target.value})} placeholder="vd: protocol, src_ip" style={{ width:"100%", height:36, padding:"0 12px", fontSize:12, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg1, color:DS.text, boxSizing:"border-box" }} />
                <div style={{ fontFamily:DS.sans, fontSize:11, color:DS.text4, marginTop:4 }}>Khóa duy nhất, dùng làm tên trường trong điều kiện lọc</div>
              </div>

              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginBottom:20 }}>
                <div>
                  <div style={{ fontFamily:DS.sans, fontSize:12, fontWeight:700, color:DS.text, marginBottom:8 }}>Nhãn tiếng Việt</div>
                  <input value={editItem.labelVn} onChange={e=>setEditItem({...editItem, labelVn:e.target.value})} placeholder="vd: Giao thức" style={{ width:"100%", height:36, padding:"0 12px", fontSize:12, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg1, color:DS.text, boxSizing:"border-box" }} />
                </div>
                <div>
                  <div style={{ fontFamily:DS.sans, fontSize:12, fontWeight:700, color:DS.text, marginBottom:8 }}>Nhãn tiếng Anh</div>
                  <input value={editItem.labelEn} onChange={e=>setEditItem({...editItem, labelEn:e.target.value})} placeholder="vd: Protocol" style={{ width:"100%", height:36, padding:"0 12px", fontSize:12, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg1, color:DS.text, boxSizing:"border-box" }} />
                </div>
              </div>

              <div style={{ marginBottom:20 }}>
                <div style={{ fontFamily:DS.sans, fontSize:12, fontWeight:700, color:DS.text, marginBottom:8 }}>Value Path <span style={{color:DS.crit}}>*</span></div>
                <input value={editItem.valuePath} onChange={e=>setEditItem({...editItem, valuePath:e.target.value})} placeholder="vd: severity, rawData.protocol" style={{ width:"100%", height:36, padding:"0 12px", fontSize:12, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg1, color:DS.text, boxSizing:"border-box" }} />
                <div style={{ fontFamily:DS.sans, fontSize:11, color:DS.text4, marginTop:4 }}>Đường dẫn lấy giá trị từ alert. Cột trực tiếp: severity, source. Dữ liệu thô: rawData.&lt;key&gt;</div>
              </div>

              <div style={{ marginBottom:30 }}>
                <div style={{ fontFamily:DS.sans, fontSize:12, fontWeight:700, color:DS.text, marginBottom:8 }}>Kiểu dữ liệu</div>
                <select value={editItem.type} onChange={e=>setEditItem({...editItem, type:e.target.value})} style={{ width:"100%", height:36, padding:"0 12px", fontSize:12, fontFamily:DS.sans, border:`1px solid ${DS.border}`, borderRadius:6, outline:"none", background:DS.bg1, color:"#2684FF", boxSizing:"border-box", appearance:"none" }}>
                  {TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>

              <div style={{ display:"flex", gap:12 }}>
                <button onClick={()=>setStep(1)} style={{ background:"transparent", border:`1px solid #2684FF`, color:"#2684FF", padding:"0 24px", height:36, borderRadius:6, fontSize:12, fontFamily:DS.sans, fontWeight:600, cursor:"pointer" }}>HỦY</button>
                <button onClick={handleSave} style={{ background:"#2684FF", border:"none", color:"#fff", padding:"0 24px", height:36, borderRadius:6, fontSize:12, fontFamily:DS.sans, fontWeight:600, cursor:"pointer" }}>{editItem.id ? "CẬP NHẬT TRƯỜNG" : "THÊM TRƯỜNG"}</button>
              </div>
            </div>
          </>
        )}

      </div>
    </div>
  );
};

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
