        :root {
            --radius: .75rem;
            --main: #29A3F1;
            --light-main: #53CEFF;
            --white: #FFFFFF;
            --neu1: #0c1033;
            --neu2: #12173b;
            --neu3: #181F53;
            --neu4: #FEFEFE;
            --red: #FF4D4F;
            --orange: #FA8C16;
            --yellow: #FAAD14;
            --green: #29DCBE;
            --blue: #1890FF;
            --line: #234082;
            --border-subtle: rgba(35, 64, 130, 0.6);
            --text-menu: #8c9ba5;
            --text-muted: #94A3B8;
            --row-hover: #182860;
            --card-bg: #151d4d;
            --card-inner: #11173d;
            --input-bg: #0e1335;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--neu1);
            color: #FEFEFE;
            font-size: 13px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0e1335; }
        ::-webkit-scrollbar-thumb { background: #234082; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #29A3F1; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.98) translateY(-6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes toastSlide {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .animate-fade { animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-modal { animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-toast { animation: toastSlide 0.25s ease-out forwards; }

        /* Form elements styling */
        input[type="text"], input[type="number"], select, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--line);
            color: #FEFEFE;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
            font-family: inherit;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: var(--main);
            box-shadow: 0 0 0 2px rgba(41, 163, 241, 0.2);
        }
        input:disabled, select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: rgba(14, 19, 53, 0.6);
        }

        /* Checkbox styling */
        .custom-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
        }
        .custom-checkbox input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #3b5998;
            border-radius: 4px;
            background: #0e1335;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .custom-checkbox input[type="checkbox"]:checked {
            background: var(--main);
            border-color: var(--main);
        }
        .custom-checkbox input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Radio styling */
        .custom-radio {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
        }
        .custom-radio input[type="radio"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #3b5998;
            border-radius: 50%;
            background: #0e1335;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .custom-radio input[type="radio"]:checked {
            border-color: var(--main);
        }
        .custom-radio input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--main);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #233469;
            transition: .3s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--green);
        }
        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* Severity Category Chips */
        .sev-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.18s ease;
            border: 1px solid #234082;
            background: #0e1438;
            color: #cbd5e1;
            user-select: none;
        }
        .sev-chip:hover {
            border-color: #3b5998;
            background: #141c4d;
            color: #fff;
        }
        .sev-chip.selected {
            background: #163675;
            border-color: #29A3F1;
            color: #53CEFF;
            font-weight: 600;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-family: inherit;
        }
        .btn-primary {
            background: #1890FF;
            color: #fff;
        }
        .btn-primary:hover {
            background: #40a9ff;
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.35);
        }
        .btn-default {
            background: #16224f;
            color: #FEFEFE;
            border-color: var(--line);
        }
        .btn-default:hover {
            background: #1e306e;
            border-color: #3b5998;
        }
        .btn-danger-ghost {
            background: transparent;
            color: #ff7875;
        }
        .btn-danger-ghost:hover {
            background: rgba(255, 77, 79, 0.15);
        }

        /* Level Sidebar Item */
        .level-card-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s;
            border: 1px solid #1a2559;
            background: #0d1233;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }
        .level-card-item:hover {
            background: #141c4d;
            border-color: #28448f;
        }
        .level-card-item.active {
            background: #14285e;
            border-color: #29A3F1;
            box-shadow: 0 2px 8px rgba(41, 163, 241, 0.25);
        }

        /* Multi-select Dropdown */
        .multiselect-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f153d;
            border: 1px solid #29A3F1;
            border-radius: 6px;
            margin-top: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 50;
            max-height: 220px;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

/* ═══════════════════════════════════════════════════════════
   SEARCHABLE MULTISELECT USER COMPONENT
═══════════════════════════════════════════════════════════ */
const SearchableUserMultiSelect = ({ selectedNames, onAdd, onRemove }) => {
  const [isOpen, setIsOpen] = useState(false);
  const [searchKeyword, setSearchKeyword] = useState("");
  const dropdownRef = useRef(null);

  useEffect(() => {
    const handleClickOutside = (e) => {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setIsOpen(false);
      }
    };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  const filteredUsers = useMemo(() => {
    const kw = searchKeyword.toLowerCase();
    return ALL_SYSTEM_USERS.filter(u => 
      u.name.toLowerCase().includes(kw) || u.email.toLowerCase().includes(kw)
    );
  }, [searchKeyword]);

  const toggleUser = (userName) => {
    if (selectedNames.includes(userName)) {
      onRemove(userName);
    } else {
      onAdd(userName);
    }
  };

  return (
    <div style={{ position: "relative" }} ref={dropdownRef}>
      <div 
        onClick={() => setIsOpen(!isOpen)}
        style={{
          background: "var(--input-bg)",
          border: `1px solid ${isOpen ? "var(--main)" : "var(--line)"}`,
          borderRadius: 6,
          padding: "6px 10px",
          minHeight: 38,
          display: "flex",
          alignItems: "center",
          gap: 6,
          flexWrap: "wrap",
          cursor: "pointer",
          transition: "border-color 0.2s"
        }}>
        {selectedNames.length === 0 ? (
          <span style={{ color: "#64748B", fontSize: 12.5 }}>Chọn hoặc tìm kiếm người dùng...</span>
        ) : (
          selectedNames.map((name, idx) => (
            <span key={idx} style={{
              background: "#182a63",
              border: "1px solid #2b4b9b",
              color: "#53CEFF",
              padding: "2px 8px",
              borderRadius: 4,
              fontSize: 12,
              display: "inline-flex",
              alignItems: "center",
              gap: 6
            }}>
              {name}
              <span 
                onClick={(e) => { e.stopPropagation(); onRemove(name); }}
                style={{ cursor: "pointer", color: "#ff7875", fontWeight: 700 }}
                title="Gỡ bỏ">
                ✕
              </span>
            </span>
          ))
        )}
        <div style={{ marginLeft: "auto", color: "#64748B" }}>
          <Icon name="chevronDown" size={14} />
        </div>
      </div>

      {isOpen && (
        <div className="multiselect-dropdown">
          <div style={{ padding: "8px 10px", borderBottom: "1px solid var(--line)" }}>
            <div style={{ position: "relative" }}>
              <input 
                type="text"
                autoFocus
                placeholder="Nhập từ khóa tìm kiếm người dùng..."
                value={searchKeyword}
                onChange={e => setSearchKeyword(e.target.value)}
                style={{ height: 32, paddingLeft: 28, fontSize: 12 }}
              />
              <span style={{ position: "absolute", left: 8, top: 8, color: "#64748B" }}>
                <Icon name="search" size={14} />
              </span>
            </div>
          </div>

          <div style={{ overflowY: "auto", flex: 1, padding: "4px 0" }}>
            {filteredUsers.length === 0 ? (
              <div style={{ padding: "10px 14px", color: "#64748B", fontSize: 12, textAlign: "center" }}>
                Không tìm thấy người dùng phù hợp
              </div>
            ) : (
              filteredUsers.map(user => {
                const isChecked = selectedNames.includes(user.name);
                return (
                  <div
                    key={user.id}
                    onClick={() => toggleUser(user.name)}
                    style={{
                      padding: "7px 12px",
                      display: "flex",
                      alignItems: "center",
                      gap: 10,
                      cursor: "pointer",
                      background: isChecked ? "rgba(41, 163, 241, 0.12)" : "transparent",
                      transition: "background 0.15s"
                    }}
                    onMouseEnter={e => e.currentTarget.style.backgroundColor = "var(--row-hover)"}
                    onMouseLeave={e => e.currentTarget.style.backgroundColor = isChecked ? "rgba(41, 163, 241, 0.12)" : "transparent"}
                  >
                    <input 
                      type="checkbox" 
                      readOnly 
                      checked={isChecked}
                      style={{ width: 14, height: 14, accentColor: "#29A3F1", cursor: "pointer" }}
                    />
                    <div style={{ flex: 1 }}>
                      <div style={{ color: isChecked ? "#53CEFF" : "#FEFEFE", fontSize: 12.5, fontWeight: isChecked ? 600 : 400 }}>
                        {user.name}
                      </div>
                      <div style={{ color: "#64748B", fontSize: 11 }}>{user.email}</div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      )}
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════
   MAIN SOAR APP COMPONENT
═══════════════════════════════════════════════════════════ */
function App() {
  const [rules, setRules] = useState(INITIAL_RULES);
  const [searchTerm, setSearchTerm] = useState("");
  const [modalOpen, setModalOpen] = useState(true);
  const [editingRule, setEditingRule] = useState(null);
  const [activeLevelIdx, setActiveLevelIdx] = useState(0);
  const [toast, setToast] = useState({ show: false, message: "", type: "success" });

  useEffect(() => {
    openEditModal(rules[0]);
  }, []);

  const showToast = (message, type = "success") => {
    setToast({ show: true, message, type });
    setTimeout(() => setToast({ show: false, message: "", type: "success" }), 3500);
  };

  const openCreateModal = () => {
    const newRule = {
      id: "sla-rule-" + Date.now(),
      code: "SLA_" + Math.floor(Math.random() * 899 + 100),
      name: "Quy tắc cảnh báo SLA mới",
      description: "",
      applies_to: { case: true, task: true },
      customer_id: "",
      sla_policy: "test",
      is_active: true,
      creator: "current_user",
      created_at: new Date().toLocaleString("vi-VN"),
      levels: [
        {
          level_index: 1,
          level_name: "Mức 1",
          use_time: true,
          time_operator: "BEFORE",
          time_value: 30,
          time_unit: "MINUTE",
          use_severity: false,
          severities: [],
          action_type: "NOTIFY_ONLY",
          reassign_type: "CURRENT_SHIFT_LEADER",
          reassign_user: "",
          notify_roles: ["ASSIGNEE"],
          custom_users: []
        }
      ]
    };
    setEditingRule(JSON.parse(JSON.stringify(newRule)));
    setActiveLevelIdx(0);
    setModalOpen(true);
  };

  const openEditModal = (rule) => {
    const cloned = JSON.parse(JSON.stringify(rule));
    if (cloned.description === undefined) cloned.description = "";
    setEditingRule(cloned);
    setActiveLevelIdx(0);
    setModalOpen(true);
  };

  const handleToggleRuleActive = (ruleId) => {
    setRules(prev => prev.map(r => {
      if (r.id === ruleId) {
        const updated = !r.is_active;
        showToast(`Đã ${updated ? "kích hoạt" : "tạm dừng"} quy tắc [${r.code}]`, "info");
        return { ...r, is_active: updated };
      }
      return r;
    }));
  };

  const handleDeleteRule = (ruleId, code) => {
    if (confirm(`Bạn có chắc chắn muốn xóa quy tắc cảnh báo SLA [${code}]?`)) {
      setRules(prev => prev.filter(r => r.id !== ruleId));
      showToast(`Đã xóa quy tắc [${code}] thành công!`, "info");
    }
  };

  const currentLevel = editingRule?.levels?.[activeLevelIdx] || null;

  // Kiểm tra xem mức đã cấu hình hoàn tất hay chưa
  const checkLevelIncomplete = (lvl) => {
    if (!lvl) return false;
    // 1. Chưa bật điều kiện nào
    if (!lvl.use_time && !lvl.use_severity) return true;
    // 2. Bật mức độ nghiêm trọng nhưng chưa chọn mức nào
    if (lvl.use_severity && (!lvl.severities || lvl.severities.length === 0)) return true;
    // 3. Chọn Chuyển người xử lý -> Người dùng cấu hình chỉ định nhưng chưa chọn người tiếp nhận
    if (lvl.action_type === "REASSIGN" && lvl.reassign_type === "CONFIGURED_USER" && !lvl.reassign_user) return true;
    return false;
  };

  const handleAddLevel = () => {
    if (!editingRule) return;
    const newIdx = editingRule.levels.length + 1;
    const newLevel = {
      level_index: newIdx,
      level_name: `Mức ${newIdx}`,
      use_time: false, // Mặc định chưa chọn điều kiện để hiển thị trạng thái chưa hoàn tất
      time_operator: "BEFORE",
      time_value: 15,
      time_unit: "MINUTE",
      use_severity: false,
      severities: [],
      action_type: "NOTIFY_ONLY",
      reassign_type: "CURRENT_SHIFT_LEADER",
      reassign_user: "",
      notify_roles: ["ASSIGNEE"],
      custom_users: []
    };
    setEditingRule(prev => ({
      ...prev,
      levels: [...prev.levels, newLevel]
    }));
    setActiveLevelIdx(editingRule.levels.length);
    showToast(`Đã thêm Mức ${newIdx}`);
  };

  const handleDeleteLevel = (idxToDelete, e) => {
    if (e) e.stopPropagation();
    if (!editingRule) return;
    if (editingRule.levels.length <= 1) {
      alert("Quy tắc cảnh báo SLA phải có ít nhất 1 mức cảnh báo!");
      return;
    }
    const updatedLevels = editingRule.levels
      .filter((_, i) => i !== idxToDelete)
      .map((lvl, i) => ({
        ...lvl,
        level_index: i + 1,
        level_name: `Mức ${i + 1}`
      }));
    setEditingRule(prev => ({ ...prev, levels: updatedLevels }));
    setActiveLevelIdx(Math.max(0, idxToDelete - 1));
    showToast("Đã xóa mức cảnh báo", "info");
  };

  const updateCurrentLevel = (fields) => {
    if (!editingRule || activeLevelIdx < 0) return;
    setEditingRule(prev => {
      const updatedLevels = [...prev.levels];
      updatedLevels[activeLevelIdx] = {
        ...updatedLevels[activeLevelIdx],
        ...fields
      };
      return { ...prev, levels: updatedLevels };
    });
  };

  const toggleSeverityInCurrentLevel = (sevId) => {
    if (!currentLevel) return;
    const curSevs = currentLevel.severities || [];
    let updated;
    if (curSevs.includes(sevId)) {
      updated = curSevs.filter(s => s !== sevId);
    } else {
      updated = [...curSevs, sevId];
    }
    updateCurrentLevel({ severities: updated });
  };

  const toggleNotifyRole = (role) => {
    if (!currentLevel) return;
    const curRoles = currentLevel.notify_roles || [];
    let updated;
    if (curRoles.includes(role)) {
      updated = curRoles.filter(r => r !== role);
    } else {
      updated = [...curRoles, role];
    }
    updateCurrentLevel({ notify_roles: updated });
  };

  const handleSaveConfig = () => {
    if (!editingRule.name.trim()) {
      alert("Vui lòng nhập Tên cảnh báo!");
      return;
    }
    if (!editingRule.code.trim()) {
      alert("Vui lòng nhập Mã cảnh báo!");
      return;
    }
    if (!editingRule.applies_to.case && !editingRule.applies_to.task) {
      alert("Vui lòng chọn áp dụng cho Sự việc, Công việc hoặc cả hai!");
      return;
    }

    // Validate levels
    for (let i = 0; i < editingRule.levels.length; i++) {
      const lvl = editingRule.levels[i];
      if (!lvl.use_time && !lvl.use_severity) {
        alert(`Tại ${lvl.level_name}: Vui lòng bật ít nhất 1 điều kiện kích hoạt!`);
        setActiveLevelIdx(i);
        return;
      }
      if (lvl.use_severity && (!lvl.severities || lvl.severities.length === 0)) {
        alert(`Tại ${lvl.level_name}: Vui lòng chọn ít nhất 1 mức độ nghiêm trọng!`);
        setActiveLevelIdx(i);
        return;
      }
      if (lvl.action_type === "REASSIGN") {
        if (!editingRule.customer_id) {
          alert(`Tại ${lvl.level_name}: Hành động "Chuyển người xử lý" chỉ được hỗ trợ khi chọn 1 Khách hàng cụ thể.`);
          setActiveLevelIdx(i);
          return;
        }
        if (lvl.reassign_type === "CONFIGURED_USER" && !lvl.reassign_user) {
          alert(`Tại ${lvl.level_name}: Vui lòng chọn người tiếp nhận khi chọn phương thức "Người dùng cấu hình chỉ định"!`);
          setActiveLevelIdx(i);
          return;
        }
      }
    }

    setRules(prev => {
      const exists = prev.some(r => r.id === editingRule.id);
      if (exists) {
        return prev.map(r => r.id === editingRule.id ? editingRule : r);
      } else {
        return [editingRule, ...prev];
      }
    });

    setModalOpen(false);
    showToast(`Đã lưu thành công cấu hình cảnh báo [${editingRule.code}]!`);
  };

  const filteredRules = useMemo(() => {
    const term = searchTerm.toLowerCase();
    return rules.filter(r => 
      r.code.toLowerCase().includes(term) ||
      r.name.toLowerCase().includes(term) ||
      r.creator.toLowerCase().includes(term)
    );
  }, [rules, searchTerm]);

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", backgroundColor: "var(--neu1)" }}>
      {/* ═══════════════════════════════════════════════════════════
          1. TOP APP HEADER (NCS SOAR)
      ═══════════════════════════════════════════════════════════ */}
      <header style={{
        height: 54,
        background: "#0c1033",
        borderBottom: "1px solid var(--line)",
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        padding: "0 20px",
        position: "sticky",
        top: 0,
        zIndex: 40
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 32 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
            <Icon name="ncsLogo" size={26} />
            <span style={{ fontWeight: 800, fontSize: 17, letterSpacing: 1.2, color: "#fff" }}>NCS</span>
          </div>

          <nav style={{ display: "flex", alignItems: "center", gap: 22, fontSize: 12, fontWeight: 600 }}>
            {["TRANG CHỦ", "BẢNG ĐIỀU KHIỂN", "BÁO CÁO", "QUY TRÌNH", "SỰ VIỆC", "CÔNG VIỆC", "CẢNH BÁO", "QUẢN TRỊ"].map((item) => (
              <span key={item} style={{
                color: item === "QUẢN TRỊ" ? "var(--main)" : "var(--text-menu)",
                cursor: "pointer",
                padding: "6px 2px",
                borderBottom: item === "QUẢN TRỊ" ? "2px solid var(--main)" : "2px solid transparent"
              }}>
                {item}
              </span>
            ))}
          </nav>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <div style={{ position: "relative", cursor: "pointer" }}>
            <Icon name="bell" size={18} color="#94A3B8" />
            <span style={{
              position: "absolute", top: -6, right: -8,
              background: "#FF4D4F", color: "#fff", fontSize: 10, fontWeight: 700,
              padding: "1px 5px", borderRadius: 10
            }}>39</span>
          </div>
          <span style={{ fontSize: 12, color: "#cbd5e1", cursor: "pointer" }}>Tiếng Việt ▾</span>
          <div style={{
            width: 28, height: 28, borderRadius: "50%",
            background: "#234082", color: "#FEFEFE",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontWeight: 700, fontSize: 12
          }}>T</div>
        </div>
      </header>

      {/* ═══════════════════════════════════════════════════════════
          2. MAIN WRAPPER (SIDEBAR + CONTENT)
      ═══════════════════════════════════════════════════════════ */}

          flexDirection: "column",
          gap: 2
        }}>
          {[
            { icon: "shield", label: "Lực lượng bảo vệ" },
            { icon: "license", label: "Bản quyền" },
            { icon: "department", label: "Phòng ban" },
            { icon: "roles", label: "Nhóm quyền" },
            { icon: "users", label: "Người dùng" },
            { icon: "customer", label: "Khách hàng" },
            { 
              icon: "sla", label: "SLA", expanded: true, 
              children: [
                { label: "Loại SLA", active: false },
                { label: "Leo thang & thông báo", active: true }
              ] 
            },
            { icon: "category", label: "Danh mục" },
            { icon: "shift", label: "Quản lý Ca - Kíp" },
            { icon: "rules", label: "Mẫu công việc" },
            { icon: "system", label: "Cấu hình hệ thống" },
            { icon: "source", label: "Nguồn tích hợp" }
          ].map((item, idx) => (
            <div key={idx}>
              <div style={{
                display: "flex", alignItems: "center", gap: 10,
                padding: "9px 20px", cursor: "pointer",
                color: item.label === "SLA" ? "var(--main)" : "#94A3B8",
                fontSize: 13, fontWeight: item.label === "SLA" ? 600 : 400
              }}>
                <Icon name={item.icon} size={16} />
                <span style={{ flex: 1 }}>{item.label}</span>
                {item.children && <Icon name="chevronDown" size={14} />}
              </div>

              {item.children && (
                <div style={{ marginLeft: 34, paddingLeft: 10, borderLeft: "1px solid #1c2b5e", marginTop: 4, marginBottom: 6 }}>

                    <div key={sidx} style={{

                      borderRadius: 4, margin: "2px 0", cursor: "pointer",
                      fontWeight: sub.active ? 600 : 400,
                      display: "flex", alignItems: "center", gap: 6
                    }}>
                      {sub.active && <span style={{ width: 4, height: 4, borderRadius: "50%", background: "#53CEFF" }}></span>}
                      {sub.label}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </aside>

        {/* Main Content Area */}
        <main style={{ flex: 1, padding: "24px 28px", background: "#0c1033", overflowY: "auto" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
            <div>
              <div style={{ fontSize: 12, color: "#64748B", marginBottom: 4 }}>Quản trị / SLA / Leo thang & thông báo</div>

            </div>

            <button

              style={{ padding: "8px 18px", fontWeight: 600 }}>
              <Icon name="plus" size={16} />
              + Tạo cảnh báo SLA
            </button>
          </div>

          {/* Search & Actions Bar */}
          <div style={{
            background: "var(--card-bg)",
            borderRadius: 8,
            padding: "14px 18px",
            border: "1px solid var(--line)",
            marginBottom: 18,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 16
          }}>
            <div style={{ position: "relative", width: 400 }}>
              <input
                type="text"
                placeholder="Tìm kiếm theo Mã, Tên cảnh báo SLA, Người tạo..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
                style={{ paddingLeft: 34, height: 38 }}
              />
              <span style={{ position: "absolute", left: 10, top: 11, color: "#64748B" }}>
                <Icon name="search" size={16} />
              </span>
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 10, color: "#94A3B8", fontSize: 12.5 }}>

              <button className="btn btn-default" style={{ padding: "6px 10px" }} title="Làm mới">
                <Icon name="refresh" size={15} />

          {/* Data Table */}

                <tr style={{ background: "#11173d", color: "#94A3B8", borderBottom: "1px solid var(--line)", height: 42 }}>

                  <th style={{ padding: "8px 16px", width: 180 }}>Khách hàng</th>
                  <th style={{ padding: "8px 16px", width: 100, textAlign: "center" }}>Số mức</th>
                  <th style={{ padding: "8px 16px", width: 120, textAlign: "center" }}>Trạng thái</th>
                  <th style={{ padding: "8px 16px", width: 110 }}>Người tạo</th>
                  <th style={{ padding: "8px 16px", width: 150 }}>Ngày tạo</th>
                  <th style={{ padding: "8px 16px", width: 100, textAlign: "center" }}>Hành động</th>
                </tr>
              </thead>
              <tbody>
                {filteredRules.map((rule, idx) => (

                    borderBottom: "1px solid #1a2559",
                    background: idx % 2 === 0 ? "transparent" : "rgba(18, 23, 59, 0.4)"
                  }}>
                    <td style={{ padding: "12px 16px", color: "#64748B" }}>{idx + 1}</td>

                    <td style={{ padding: "12px 16px" }}>

                          </span>
                        )}
                        {rule.applies_to.task && (
                          <span style={{ background: "rgba(41, 220, 190, 0.15)", color: "#29DCBE", padding: "2px 7px", borderRadius: 4, fontSize: 11 }}>
                            Công việc
                          </span>
                        )}
                      </div>
                    </td>

                      <span style={{
                        background: "#182659",

                        borderRadius: 12,
                        fontSize: 12,
                        fontWeight: 600

                        {rule.levels ? rule.levels.length : 0}

                      type="text"

                  <div>

                      type="text"

                      value={editingRule.sla_policy}

                        <option key={p.id} value={p.id}>{p.name}</option>

                    <label style={{ display: "block", fontSize: 12, color: "#94A3B8", marginBottom: 5 }}>

                        const newCust = e.target.value;
                        setEditingRule(prev => {
                          const updatedLevels = !newCust 
                            ? prev.levels.map(l => ({ ...l, action_type: "NOTIFY_ONLY" }))
                            : prev.levels;
                          return { ...prev, customer_id: newCust, levels: updatedLevels };

                    <div style={{ fontSize: 11, color: editingRule.customer_id ? "#94A3B8" : "#FAAD14", marginTop: 4 }}>

                      const isIncomplete = checkLevelIncomplete(lvl);

                          key={lvl.level_index}

                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                            <span style={{ fontWeight: 600, color: isActive ? "#53CEFF" : "#FEFEFE", fontSize: 13 }}>
                              {lvl.level_name}
                            </span>
                            {editingRule.levels.length > 1 && (
                              <span 
                                onClick={(e) => handleDeleteLevel(idx, e)}
                                style={{ color: "#64748B", cursor: "pointer", fontSize: 14, padding: "0 2px" }}
                                title="Xóa mức này"
                                onMouseEnter={e => e.target.style.color = "#ff7875"}
                                onMouseLeave={e => e.target.style.color = "#64748B"}>

                              </span>
                            )}
                          </div>

                              <span>Không xét thời gian</span>
                            )}
                          </div>

                          {/* Text hành động */}

                            <span style={{
                              fontSize: 10.5,
                              padding: "1px 6px",
                              borderRadius: 4,
                              background: lvl.action_type === "REASSIGN" ? "rgba(41, 220, 190, 0.15)" : "rgba(35, 64, 130, 0.4)",
                              color: lvl.action_type === "REASSIGN" ? "#29DCBE" : "#94A3B8"
                            }}>
                              {lvl.action_type === "REASSIGN" ? "Chuyển xử lý" : "Chỉ thông báo"}
                            </span>
                          </div>

                          {/* Dòng text màu đỏ nhỏ cảnh báo 'Chưa cấu hình xong' */}

                            <div style={{
                              fontSize: 10.5,
                              color: "#ff7875",
                              fontWeight: 500,
                              display: "flex",
                              alignItems: "center",
                              gap: 4,
                              marginTop: 2

                              <span style={{ width: 5, height: 5, borderRadius: "50%", background: "#ff4d4f", flexShrink: 0 }}></span>
                              <span>Chưa cấu hình xong</span>

                      );

                      background: "#0a0e29",

                        </div>

                        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                          {/* 1. Mốc thời gian SLA */}
                          <div>
                            <label className="custom-checkbox" style={{ fontWeight: 500 }}>
                              <input 
                                type="checkbox"
                                checked={currentLevel.use_time}
                                onChange={e => updateCurrentLevel({ use_time: e.target.checked })}
                              />
                              <span>Theo mốc thời gian SLA</span>
                            </label>

                            {/* Khi bật: hiển thị cụm chọn thời gian; Khi tắt: không hiển thị chữ gì */}

                              <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8, paddingLeft: 24, flexWrap: "wrap" }}>

                                  <option value="OVERDUE">Quá hạn</option>

                                />

                                <select 
                                  value={currentLevel.time_unit}
                                  onChange={e => updateCurrentLevel({ time_unit: e.target.value })}
                                  style={{ width: 100 }}
                                >
                                  <option value="MINUTE">Phút</option>
                                  <option value="HOUR">Giờ</option>
                                  <option value="DAY">Ngày</option>

                                  updateCurrentLevel({ 
                                    use_severity: checked,
                                    severities: checked && (!currentLevel.severities || currentLevel.severities.length === 0) 
                                      ? ["CRITICAL", "VERY_HIGH", "HIGH"] 
                                      : currentLevel.severities
                                  });
                                }}
                              />
                              <span>Theo mức độ nghiêm trọng</span>
                            </label>

                                    return (
                                      <div
                                        key={sev.id}
                                        onClick={() => toggleSeverityInCurrentLevel(sev.id)}
                                        className={`sev-chip ${isSelected ? "selected" : ""}`}

                                        <input 
                                          type="checkbox" 
                                          readOnly 
                                          checked={isSelected}
                                          style={{ width: 13, height: 13, accentColor: "#29A3F1", cursor: "pointer" }}
                                        />
                                        <span>{sev.name}</span>
                                      </div>
                                    );
                                  })}
                                </div>
                                {(!currentLevel.severities || currentLevel.severities.length === 0) && (
                                  <div style={{ color: "#ff4d4f", fontSize: 11.5, marginTop: 6, display: "flex", alignItems: "center", gap: 4 }}>
                                    <span>⚠️ Vui lòng chọn ít nhất 1 mức độ nghiêm trọng!</span>
                                  </div>
                                )}
                              </div>
                            )}
                          </div>

                          {/* Dòng mô tả lỗi màu đỏ nếu chưa chọn điều kiện nào */}

                            <div style={{
                              color: "#ff4d4f",

                          {/* Hàng 1: Loại hành động */}

                              Loại hành động
                            </label>
                            <select 
                              value={currentLevel.action_type}
                              onChange={e => updateCurrentLevel({ action_type: e.target.value })}

                              <option value="NOTIFY_ONLY">Chỉ thông báo</option>

                              </option>
                            </select>
                            {!editingRule.customer_id && (
                              <div style={{ fontSize: 11, color: "#FAAD14", marginTop: 4 }}>
                                * Chỉ được chọn "Chuyển người xử lý" khi chọn 1 khách hàng cụ thể.
                              </div>

                              borderTop: "1px solid #1c2b5e",

                            }}>
                              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#53CEFF" }}>

                                  <label className="custom-radio">
                                    <input 
                                      type="radio"
                                      name="reassignOption"
                                      checked={currentLevel.reassign_type === "CURRENT_SHIFT_LEADER"}
                                      onChange={() => updateCurrentLevel({ reassign_type: "CURRENT_SHIFT_LEADER" })}
                                    />
                                    <span style={{ color: currentLevel.reassign_type === "CURRENT_SHIFT_LEADER" ? "#29DCBE" : "#FEFEFE", fontWeight: 500 }}>
                                      Trưởng ca kíp hiện tại
                                    </span>
                                  </label>
                                </div>

                                {/* Tùy chọn 2: Người dùng cấu hình chỉ định */}

                                  <label className="custom-radio">
                                    <input 
                                      type="radio"
                                      name="reassignOption"
                                      checked={currentLevel.reassign_type === "CONFIGURED_USER"}
                                      onChange={() => updateCurrentLevel({ reassign_type: "CONFIGURED_USER" })}
                                    />
                                    <span>Người dùng cấu hình chỉ định:</span>
                                  </label>

                                  {currentLevel.reassign_type === "CONFIGURED_USER" && (
                                    <div style={{ paddingLeft: 24, width: 280 }}>
                                      <select 
                                        value={currentLevel.reassign_user}
                                        onChange={e => updateCurrentLevel({ reassign_user: e.target.value })}
                                        style={{
                                          borderColor: !currentLevel.reassign_user ? "#ff4d4f" : "var(--line)"
                                        }}
                                      >
                                        <option value="">-- Chọn người tiếp nhận --</option>
                                        {MOCK_CONFIGURED_USERS.map(u => (
                                          <option key={u.id} value={u.id}>{u.name}</option>
                                        ))}
                                      </select>
                                      {!currentLevel.reassign_user && (
                                        <div style={{ fontSize: 11, color: "#ff4d4f", marginTop: 4 }}>
                                          * Bắt buộc phải chọn một người tiếp nhận cụ thể
                                        </div>
                                      )}
                                    </div>
                                  )}
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* ─────────────────────────────────────────────────────
                          KHỐI C: ĐỐI TƯỢNG NHẬN THÔNG BÁO
                      ───────────────────────────────────────────────────── */}
                      <div style={{
                        background: "rgba(18, 25, 64, 0.7)",
                        border: "1px solid #234082",
                        borderRadius: 6,
                        padding: "14px 16px"
                      }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: "#53CEFF", marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
                          <Icon name="bell" size={15} />
                          <span>Đối tượng nhận thông báo</span>
                        </div>

                        {/* Hàng vai trò */}
                        <div style={{ display: "flex", gap: 24, flexWrap: "wrap", marginBottom: 14 }}>
                          <label className="custom-checkbox">
                            <input 
                              type="checkbox"
                              checked={currentLevel.notify_roles?.includes("CREATOR")}
                              onChange={() => toggleNotifyRole("CREATOR")}
                            />
                            <span>Người tạo</span>
                          </label>

                          <label className="custom-checkbox">
                            <input 
                              type="checkbox"
                              checked={currentLevel.notify_roles?.includes("ASSIGNEE")}
                              onChange={() => toggleNotifyRole("ASSIGNEE")}
                            />
                            <span>Người thực hiện</span>
                          </label>

                          <label className="custom-checkbox">
                            <input 
                              type="checkbox"
                              checked={currentLevel.notify_roles?.includes("COLLABORATORS")}
                              onChange={() => toggleNotifyRole("COLLABORATORS")}
                            />
                            <span>Người tham gia</span>
                          </label>

                          <label className="custom-checkbox">
                            <input 
                              type="checkbox"
                              checked={currentLevel.notify_roles?.includes("DEPT_MANAGERS")}
                              onChange={() => toggleNotifyRole("DEPT_MANAGERS")}
                            />
                            <span>Quyền xem phòng ban</span>
                          </label>
                        </div>

                        {/* Người dùng chỉ định thêm dạng SEARCHABLE MULTISELECT */}
                        <div>
                          <label style={{ display: "block", fontSize: 12, color: "#94A3B8", marginBottom: 6 }}>
                            Người dùng chỉ định thêm
                          </label>
                          <SearchableUserMultiSelect
                            selectedNames={currentLevel.custom_users || []}
                            onAdd={(userName) => {
                              updateCurrentLevel({
                                custom_users: [...(currentLevel.custom_users || []), userName]
                              });
                            }}
                            onRemove={(userName) => {
                              updateCurrentLevel({
                                custom_users: (currentLevel.custom_users || []).filter(u => u !== userName)
                              });
                            }}
                          />
                        </div>
                      </div>

                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Modal Footer */}
            <div style={{
              padding: "12px 22px",
              background: "#162052",
              borderTop: "1px solid var(--line)",
              display: "flex",
              alignItems: "center",
              justifyContent: "flex-end",
              gap: 12
            }}>
              <button 
                onClick={() => setModalOpen(false)}
                className="btn btn-default" 
                style={{ minWidth: 90 }}>
                Hủy
              </button>
              <button 
                onClick={handleSaveConfig}
                className="btn btn-primary" 
                style={{ minWidth: 120, fontWeight: 600 }}>
                <Icon name="check" size={16} />
                Lưu cấu hình
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toast Notification */}
      {toast.show && (
        <div className="animate-toast" style={{
          position: "fixed",
          bottom: 24,
          right: 24,
          background: toast.type === "info" ? "#182659" : "#0d2b27",
          border: `1px solid ${toast.type === "info" ? "#29A3F1" : "#29DCBE"}`,
          color: toast.type === "info" ? "#53CEFF" : "#29DCBE",
          padding: "10px 18px",
          borderRadius: 8,
          boxShadow: "0 8px 24px rgba(0, 0, 0, 0.4)",
          display: "flex",
          alignItems: "center",
          gap: 10,
          zIndex: 200,
          fontWeight: 500,
          fontSize: 13
        }}>
          <Icon name={toast.type === "info" ? "info" : "checkCircle"} size={16} />
          <span>{toast.message}</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
