/* ═══════════════════════════════════════════════════════════
   BUSINESS LOGIC HELPERS: Overlap Detection, Duration, Overnight
═══════════════════════════════════════════════════════════ */

// Convert "HH:mm" to minutes from 00:00
const timeToMinutes = (timeStr) => {
  if (!timeStr) return 0;
  const [h, m] = timeStr.split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
};

// [BR-02] & [BR-03] Calculate duration and overnight flag
const calculateShiftProperties = (startTime, endTime) => {
  if (!startTime || !endTime) return { durationHours: 0, isNextDay: false, minutes: 0 };
  const sMin = timeToMinutes(startTime);
  const eMin = timeToMinutes(endTime);

  let minutes = 0;
  let isNextDay = false;

  if (eMin <= sMin) {
    // Ends next day (Cross-midnight)
    minutes = (24 * 60 - sMin) + eMin;
    isNextDay = true;
  } else {
    // Same day
    minutes = eMin - sMin;
    isNextDay = false;
  }

  const durationHours = parseFloat((minutes / 60).toFixed(1));
  return { durationHours, isNextDay, minutes };
};

// [BR-04] Strict Non-Overlapping Shift Algorithm
// Converts a shift into 1 or 2 discrete intervals [start, end) within 24h (0..1440)
const getShiftIntervals = (startTime, endTime) => {
  const s = timeToMinutes(startTime);
  const e = timeToMinutes(endTime);
  if (e > s) {
    return [{ start: s, end: e }];
  } else {
    // Overnight: [s, 1440) and [0, e)
    return [
      { start: s, end: 1440 },
      { start: 0, end: e }
    ];
  }
};

// Check if two interval sets intersect (overlap)
const checkIntervalsOverlap = (intervalsA, intervalsB) => {
  for (const a of intervalsA) {
    for (const b of intervalsB) {
      const maxStart = Math.max(a.start, b.start);
      const minEnd = Math.min(a.end, b.end);
      if (maxStart < minEnd) {
        return true; // Overlap detected!
      }
    }
  }
  return false;
};

// Validate a candidate shift against all active shifts
const validateShiftOverlap = (candidateShift, existingShifts, currentShiftId = null) => {
  if (!candidateShift.start_time || !candidateShift.end_time) return null;
  
  // If candidate start == end => invalid duration
  if (candidateShift.start_time === candidateShift.end_time) {
    return {
      error: true,
      message: "Giờ kết thúc không được trùng hoàn toàn với giờ bắt đầu (Thời lượng = 0h)!"
    };
  }

  // Only validate overlap if the candidate is active
  if (!candidateShift.is_active) return null;

  const candidateIntervals = getShiftIntervals(candidateShift.start_time, candidateShift.end_time);

  // Compare against all other ACTIVE shifts
  for (const shift of existingShifts) {
    if (shift.id === currentShiftId) continue; // skip self when editing
    if (!shift.is_active) continue; // skip inactive shifts

    const shiftIntervals = getShiftIntervals(shift.start_time, shift.end_time);
    if (checkIntervalsOverlap(candidateIntervals, shiftIntervals)) {
      const { isNextDay } = calculateShiftProperties(shift.start_time, shift.end_time);
      const shiftTag = isNextDay ? " (+1)" : "";
      return {
        error: true,
        conflictingShift: shift,
        message: `Lỗi xung đột khung giờ: Khoảng thời gian [${candidateShift.start_time} - ${candidateShift.end_time}] bị đè/chồng lấn với ca đang hoạt động "${shift.shift_name}" (${shift.start_time} - ${shift.end_time}${shiftTag}).`
      };
    }
  }

  return null; // Valid, no overlap!
};

// [BR-01] Dynamic Auto-Rotate Schedule Generator (Any shifts & Any crews)
const generateDynamicRoster = (startDateStr, endDateStr, shiftIds = ['shift-01', 'shift-02', 'shift-03'], crewOrder = ['crew-01', 'crew-02', 'crew-03', 'crew-04']) => {
  if (!shiftIds || shiftIds.length === 0 || !crewOrder || crewOrder.length === 0) return [];
  const start = new Date(startDateStr);
  const end = new Date(endDateStr);
  const results = [];

  let cur = new Date(start);
  let dayIndex = 0;
  const numShifts = shiftIds.length;
  const numCrews = crewOrder.length;

  while (cur <= end) {
    const yyyy = cur.getFullYear();
    const mm = String(cur.getMonth() + 1).padStart(2, '0');
    const dd = String(cur.getDate()).padStart(2, '0');
    const dateKey = yyyy + '-' + mm + '-' + dd;

    shiftIds.forEach((shiftId, sIdx) => {
      const crewIdx = (dayIndex * numShifts + sIdx) % numCrews;
      const assignedCrewId = crewOrder[crewIdx];

      results.push({
        id: "rst-" + dateKey + "-" + shiftId,
        shift_id: shiftId,
        crew_id: assignedCrewId,
        shift_date: dateKey,
        is_override: false,
        reinforcements: []
      });
    });

    cur.setDate(cur.getDate() + 1);
    dayIndex++;
  }

  return results;
};

const generate3Shifts4CrewsRoster = (s, e, c) => generateDynamicRoster(s, e, ['shift-01', 'shift-02', 'shift-03'], c);

    const d = new Date(baseDate);
    const dayOfWeek = d.getDay(); // 0 is Sun, 1 is Mon...
    const distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(d);
    monday.setDate(d.getDate() + distanceToMonday);

    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      const cur = new Date(monday);
      cur.setDate(monday.getDate() + i);
      const yyyy = cur.getFullYear();
      const mm = String(cur.getMonth() + 1).padStart(2, '0');
      const dd = String(cur.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;
      const dayNames = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
      weekDays.push({
        date: cur,
        dateStr,
        dayName: dayNames[cur.getDay()],
        isToday: dateStr === "2026-09-08"
      });
    }
    return weekDays;
  };

  const getMonthCalendarDays = (baseDate) => {
    const year = baseDate.getFullYear();
    const month = baseDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);

    // Padding for Monday start
    const startDayOfWeek = firstDay.getDay();
    const padPrev = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

    const days = [];
    for (let i = padPrev; i > 0; i--) {
      const d = new Date(year, month, 1 - i);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      days.push({ date: d, dateStr: `${yyyy}-${mm}-${dd}`, isCurrentMonth: false, isToday: `${yyyy}-${mm}-${dd}` === "2026-09-08" });
    }

    for (let i = 1; i <= lastDay.getDate(); i++) {
      const d = new Date(year, month, i);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;
      days.push({ date: d, dateStr, isCurrentMonth: true, isToday: dateStr === "2026-09-08" });
    }

    // Pad end of month to complete week
    while (days.length % 7 !== 0) {
      const d = new Date(year, month + 1, days.length - lastDay.getDate() - padPrev + 1);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      days.push({ date: d, dateStr: `${yyyy}-${mm}-${dd}`, isCurrentMonth: false, isToday: `${yyyy}-${mm}-${dd}` === "2026-09-08" });

    return days;
  };

  // Resolve Slot details with Transfer & Reinforcements [BR-02]
  function resolveEffectiveSlot(shiftId, dateStr) {
    const slot = rosterSlots.find(s => s.shift_id === shiftId && s.shift_date === dateStr);
    const shift = shifts.find(s => s.id === shiftId);
    if (!slot || !slot.crew_id) {
      return { slot: null, shift, crew: null, lead: null, effectiveMembers: [], transfers: [] };
    }

    const crew = crews.find(c => c.id === slot.crew_id);
    const lead = crew ? MOCK_SOC_USERS.find(u => u.id === crew.crew_lead_id) : null;
    const baseMemberIds = crew ? [...crew.member_ids] : [];

    // Check transfers for this slot
    const slotTransfers = approvedTransfers.filter(t => t.shift_id === shiftId && t.shift_date === dateStr && t.status === "APPROVED");

    // Effective members: Remove transferred-out, add transferred-in
    let effectiveList = [];
    baseMemberIds.forEach(mId => {
      const user = MOCK_SOC_USERS.find(u => u.id === mId);
      if (!user) return;
      const transferOut = slotTransfers.find(t => t.original_user_id === mId);
      if (transferOut) {
        // Transferred out, replace with substitute
        const subUser = MOCK_SOC_USERS.find(u => u.id === transferOut.substitute_user_id);
        if (subUser) {
          effectiveList.push({
            user: subUser,
            statusType: "SUBSTITUTE",
            note: `Trực thay cho ${user.name}`,
            severity: crew.severity_mapping.critical.member_ids.includes(mId) ? "Critical" :
                      crew.severity_mapping.high.member_ids.includes(mId) ? "High" : "Low & Medium"
          });
        }
      } else {
        effectiveList.push({
          user,
          statusType: "STANDARD",
          note: "Trực chuẩn",
          severity: crew.severity_mapping.critical.member_ids.includes(mId) ? "Critical" :
                    crew.severity_mapping.high.member_ids.includes(mId) ? "High" : "Low & Medium"
        });
      }
    });

    // Add reinforcements [BR-02 Step 3]
    if (slot.reinforcements && slot.reinforcements.length > 0) {
      slot.reinforcements.forEach(r => {
        const user = MOCK_SOC_USERS.find(u => u.id === r.user_id);
        if (user && !effectiveList.some(item => item.user.id === user.id)) {

            user,
            statusType: "REINFORCEMENT",
            note: r.reason || "Nhân sự tăng cường",

    setShowSlotDrawer(false);
  };

  // Add reinforcement to current slot
  const handleAddReinforcement = () => {
    if (!reinforceUserId) {
      showToast("Vui lòng chọn nhân sự tăng cường!", "error");
      return;
    }
    const { shiftId, dateStr } = selectedSlotData;
    setRosterSlots(prev => prev.map(s => {
      if (s.shift_id === shiftId && s.shift_date === dateStr) {
        const currentReinf = s.reinforcements || [];
        return {
          ...s,
          reinforcements: [...currentReinf, { user_id: reinforceUserId, reason: reinforceReason || "Tăng cường tác chiến", added_at: "Vừa xong" }]
        };
      }
      return s;
    }));

    const user = MOCK_SOC_USERS.find(u => u.id === reinforceUserId);
    showToast(`Đã bổ sung nhân sự tăng cường "${user ? user.name : reinforceUserId}" vào ca!`);
    setReinforceUserId("");
    setReinforceReason("");
  };

  // Wizard handlers
  const handleStartAutoRotateWizard = () => {
    const activeShifts = shifts.filter(s => s.is_active).map(s => s.id);
    const activeCrews = crews.filter(c => c.is_active).map(c => c.id);
    setWizardConfig({
      selectedShiftIds: activeShifts.length > 0 ? activeShifts : ["shift-01"],
      startDate: "2026-10-01",
      endDate: "2026-10-31",
      selectedCrewIds: activeCrews.length > 0 ? activeCrews : ["crew-01"],
      crewOrder: activeCrews.length > 0 ? [...activeCrews] : ["crew-01"]
    });
    setWizardStep(1);
    setShowAutoRotateWizard(true);
  };

  const handleToggleWizardShift = (shiftId) => {
    setWizardConfig(prev => {
      const current = prev.selectedShiftIds;
      if (current.includes(shiftId)) {
        if (current.length <= 1) {
          showToast("Tối thiểu phải chọn 1 khung ca để lập lịch!", "warning");
          return prev;
        }
        return { ...prev, selectedShiftIds: current.filter(id => id !== shiftId) };
      } else {
        return { ...prev, selectedShiftIds: [...current, shiftId] };
      }
    });
  };

  const handleToggleWizardCrew = (crewId) => {
    setWizardConfig(prev => {
      const current = prev.selectedCrewIds;
      if (current.includes(crewId)) {
        if (current.length <= 1) {
          showToast("Tối thiểu phải chọn 1 kíp trực để lập lịch!", "warning");
          return prev;
        }
        const updated = current.filter(id => id !== crewId);
        return {
          ...prev,
          selectedCrewIds: updated,
          crewOrder: prev.crewOrder.filter(id => id !== crewId)
        };
      } else {
        const updated = [...current, crewId];
        return {
          ...prev,
          selectedCrewIds: updated,
          crewOrder: [...prev.crewOrder, crewId]
        };
      }
    });
  };

  const handleWizardNextToStep2 = () => {
    if (!wizardConfig.selectedShiftIds || wizardConfig.selectedShiftIds.length === 0) {
      showToast("Vui lòng chọn tối thiểu 1 khung ca!", "error");
      return;
    }
    setWizardStep(2);
  };

  const handleWizardNextToStep3 = () => {
    if (!wizardConfig.crewOrder || wizardConfig.crewOrder.length === 0) {
      showToast("Vui lòng chọn tối thiểu 1 kíp trực!", "error");
      return;
    }
    // Generate dynamic preview
    const preview = generateDynamicRoster(
      wizardConfig.startDate,
      wizardConfig.endDate,
      wizardConfig.selectedShiftIds,
      wizardConfig.crewOrder
    );
    setWizardPreviewSlots(preview);
    setWizardStep(3);
  };

  const handleApplyAutoRotate = () => {
    // Apply generated slots to master roster
    const newSlotsMap = new Map();
    wizardPreviewSlots.forEach(s => newSlotsMap.set(`${s.shift_id}_${s.shift_date}`, s));

    setRosterSlots(prev => {
      const filtered = prev.filter(s => !newSlotsMap.has(`${s.shift_id}_${s.shift_date}`));
      return [...filtered, ...wizardPreviewSlots];
    });

    setShowAutoRotateWizard(false);
    showToast(`Áp dụng lịch trực thành công từ ${wizardConfig.startDate} đến ${wizardConfig.endDate}!`);
  };

  // Reorder crew order in Step 2
  const handleMoveCrewOrder = (index, direction) => {
    const list = [...wizardConfig.crewOrder];
    const targetIdx = index + direction;
    if (targetIdx < 0 || targetIdx >= list.length) return;
    const temp = list[index];
    list[index] = list[targetIdx];
    list[targetIdx] = temp;
    setWizardConfig(prev => ({ ...prev, crewOrder: list }));
  };

  // Save Fallback Policy
  const handleSaveFallback = () => {
    setFallbackPolicy({ ...fallbackFormData });
    setShowFallbackDrawer(false);
    showToast("Đã lưu cấu hình Phân công Dự phòng (Fallback Policy) thành công!");
  };

  // Quick Transfer submit [BR-03]
  const handleQuickTransferSubmit = () => {
    if (!transferSubstituteId) {
      showToast("Vui lòng chọn kỹ sư nhận trực thay!", "error");
      return;
    }
    const newTransfer = {
      id: `trf-${Date.now()}`,
      shift_id: transferTargetSlot.shift.id,
      shift_date: transferTargetSlot.dateStr,
      original_user_id: currentAnalystId,
      substitute_user_id: transferSubstituteId,
      status: "APPROVED",
      reason: transferReason || "Nhờ trực hộ việc cá nhân",
      approved_by: "superadmin",
      approved_at: "Vừa xong"
    };

    setApprovedTransfers(prev => [...prev, newTransfer]);
    setShowQuickTransferModal(false);
    setPersonalShiftPopover(null);
    const subUser = MOCK_SOC_USERS.find(u => u.id === transferSubstituteId);
    showToast(`Đã tạo và duyệt đơn chuyển ca! ${subUser ? subUser.name : ""} sẽ trực thay ca này.`);
  };

  /* ═══════════════════════════════════════════════════════════
     SHIFT TRANSFERS MANAGEMENT STATE (SOAR_SHIFT_TRANSFER_04)
  ═══════════════════════════════════════════════════════════ */
  const [transferRequests, setTransferRequests] = useState(INITIAL_TRANSFER_REQUESTS);
  const [transferActiveTab, setTransferActiveTab] = useState("ACTION_REQUIRED"); // "ACTION_REQUIRED" | "MY_REQUESTS" | "ALL"
  const [transferSearchQuery, setTransferSearchQuery] = useState("");
  const [transferStatusFilter, setTransferStatusFilter] = useState("ALL"); // ALL | PENDING_ACCEPTANCE | PENDING_APPROVAL | APPROVED | REJECTED | CANCELLED
  const [transferRequesterFilter, setTransferRequesterFilter] = useState("ALL"); // ALL | user_id
  const [transferCreatorFilter, setTransferCreatorFilter] = useState("ALL"); // ALL | user_id
  const [transferPage, setTransferPage] = useState(1);
  const [transferPageSize, setTransferPageSize] = useState(10);

  // Detail & Action Drawer
  const [selectedTransferDetail, setSelectedTransferDetail] = useState(null);
  const [showTransferDetailDrawer, setShowTransferDetailDrawer] = useState(false);

  // Modal: Tạo đơn chuyển ca 1 chiều
  const [showCreateTransferModal, setShowCreateTransferModal] = useState(false);
  const [transferCreateForm, setTransferCreateForm] = useState({
    shiftSlotKey: "",
    substituteUserId: "",
    reason: ""
  });
  const [transferCreateErrors, setTransferCreateErrors] = useState({});

  // Modal: Từ chối / Bác bỏ đơn
  const [showRejectionModal, setShowRejectionModal] = useState(false);
  const [rejectionTarget, setRejectionTarget] = useState(null); // { transfer, action: "DECLINE" | "REJECT" }
  const [rejectionReasonText, setRejectionReasonText] = useState("");
  const [rejectionError, setRejectionError] = useState("");

  // Modal: Hủy đơn đề nghị
  const [showCancelModal, setShowCancelModal] = useState(false);
  const [cancelTargetTransfer, setCancelTargetTransfer] = useState(null);

  // Current logged in user object
  const currentUserObj = useMemo(() => {
    return MOCK_SOC_USERS.find(u => u.id === currentAnalystId) || MOCK_SOC_USERS[0];
  }, [currentAnalystId]);

  // Action Required badge count for currently logged-in user
  const actionRequiredCount = useMemo(() => {
    return transferRequests.filter(t => {
      if (t.status === "PENDING_ACCEPTANCE" && t.substitute_user_id === currentAnalystId) return true;
      if (t.status === "PENDING_APPROVAL" && (currentUserObj.role.includes("Lead") || currentUserObj.role.includes("Manager") || currentAnalystId === "usr-01" || currentAnalystId === "usr-07")) return true;
      return false;
    }).length;
  }, [transferRequests, currentAnalystId, currentUserObj]);

  // Future shifts of current user for Transfer Combobox
  const myFutureShifts = useMemo(() => {
    const list = [];
    const todayStr = "2026-09-08";
    rosterSlots.forEach(slot => {
      if (slot.shift_date < todayStr) return;
      const resolved = resolveEffectiveSlot(slot.shift_id, slot.shift_date);
      const isScheduled = resolved && resolved.effectiveMembers && resolved.effectiveMembers.some(em => em && em.user && em.user.id === currentAnalystId && em.statusType !== "SUBSTITUTE");
      const alreadyTransferred = transferRequests.some(t => 
        t.shift_id === slot.shift_id && 
        t.shift_date === slot.shift_date && 
        t.original_user_id === currentAnalystId && 
        (t.status === "PENDING_ACCEPTANCE" || t.status === "PENDING_APPROVAL" || t.status === "APPROVED")
      );
      if (isScheduled && !alreadyTransferred) {
        list.push({
          key: `${slot.shift_id}_${slot.shift_date}`,
          shift_id: slot.shift_id,
          shift_date: slot.shift_date,
          shift: resolved.shift,
          crew: resolved.crew
        });
      }
    });
    list.sort((a, b) => a.shift_date.localeCompare(b.shift_date));
    return list;
  }, [rosterSlots, currentAnalystId, transferRequests, shifts, crews]);

  // Check substitute engineer availability for a slot [BR-02]
  const getEngineerAvailability = (userId, shiftSlotKey) => {
    if (!shiftSlotKey) return { free: true, label: "Rảnh", color: "var(--green)" };
    const [shiftId, dateStr] = shiftSlotKey.split('_');
    const resolved = resolveEffectiveSlot(shiftId, dateStr);
    const isAssigned = resolved && resolved.effectiveMembers && resolved.effectiveMembers.some(em => em && em.user && em.user.id === userId);
    if (isAssigned) {
      return { free: false, label: "Đã có ca trùng", color: "var(--orange)" };
    }
    return { free: true, label: "Rảnh", color: "var(--green)" };
  };

  // Filtered Transfers list
  const filteredTransfers = useMemo(() => {
    return transferRequests.filter(item => {
      // Tab filter
      if (transferActiveTab === "ACTION_REQUIRED") {
        const isTargetSubstitute = item.status === "PENDING_ACCEPTANCE" && item.substitute_user_id === currentAnalystId;
        const isApprover = item.status === "PENDING_APPROVAL" && (currentUserObj.role.includes("Lead") || currentUserObj.role.includes("Manager") || currentAnalystId === "usr-01" || currentAnalystId === "usr-07");
        if (!isTargetSubstitute && !isApprover) return false;
      } else if (transferActiveTab === "MY_REQUESTS") {
        if (item.original_user_id !== currentAnalystId) return false;
      }

      // Status filter
      if (transferStatusFilter !== "ALL" && item.status !== transferStatusFilter) {
        return false;
      }

      // Requester filter (Người nhờ)
      if (transferRequesterFilter !== "ALL" && item.original_user_id !== transferRequesterFilter) {
        return false;
      }

      // Creator filter (Người tạo)
      if (transferCreatorFilter !== "ALL") {
        const creatorId = item.created_by || item.original_user_id;
        if (creatorId !== transferCreatorFilter) return false;
      }

      // Search query filter
      if (transferSearchQuery.trim()) {
        const q = transferSearchQuery.toLowerCase().trim();
        const userA = MOCK_SOC_USERS.find(u => u.id === item.original_user_id);
        const userB = MOCK_SOC_USERS.find(u => u.id === item.substitute_user_id);
        const shift = shifts.find(s => s.id === item.shift_id);
        
        const matchCode = item.id.toLowerCase().includes(q);
        const matchReason = (item.reason || "").toLowerCase().includes(q);
        const matchUserA = userA ? (userA.name.toLowerCase().includes(q) || userA.username.toLowerCase().includes(q)) : false;
        const matchUserB = userB ? (userB.name.toLowerCase().includes(q) || userB.username.toLowerCase().includes(q)) : false;
        const matchShift = shift ? shift.shift_name.toLowerCase().includes(q) : false;

        if (!matchCode && !matchReason && !matchUserA && !matchUserB && !matchShift) {
          return false;
        }
      }

      return true;
    });
  }, [transferRequests, transferActiveTab, transferStatusFilter, transferSearchQuery, currentAnalystId, currentUserObj, shifts]);

  // Handlers for Transfer
  const handleOpenCreateTransferModal = (preselectedSlot = null) => {
    let slotKey = "";
    if (preselectedSlot) {
      slotKey = `${preselectedSlot.shift.id}_${preselectedSlot.dateStr}`;
    } else if (myFutureShifts.length > 0) {
      slotKey = myFutureShifts[0].key;
    }
    setTransferCreateForm({
      shiftSlotKey: slotKey,
      substituteUserId: "",
      reason: ""
    });
    setTransferCreateErrors({});
    setShowCreateTransferModal(true);
  };

  const handleCreateTransferSubmit = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const errors = {};

    if (!transferCreateForm.shiftSlotKey) {
      errors.shiftSlotKey = "Vui lòng chọn ca trực cần chuyển giao!";
    }

    if (!transferCreateForm.substituteUserId) {
      errors.substituteUserId = "Vui lòng chọn kỹ sư tiếp nhận trực hộ!";
    } else if (transferCreateForm.substituteUserId === currentAnalystId) {
      errors.substituteUserId = "Không thể chuyển ca cho chính mình!";
    }

    const trimmedReason = (transferCreateForm.reason || "").trim();
    if (!trimmedReason) {
      errors.reason = "Lý do chuyển ca là bắt buộc!";
    } else if (trimmedReason.length > 500) {
      errors.reason = "Lý do chuyển ca không được vượt quá 500 ký tự!";
    }

    if (Object.keys(errors).length > 0) {
      setTransferCreateErrors(errors);
      return;
    }

    const [shiftId, dateStr] = transferCreateForm.shiftSlotKey.split('_');
    const userB = MOCK_SOC_USERS.find(u => u.id === transferCreateForm.substituteUserId);
    const nextSeq = transferRequests.length + 1;
    const newCode = `TR-2026-${String(nextSeq).padStart(4, '0')}`;

    const newTransfer = {
      id: newCode,
      shift_id: shiftId,
      shift_date: dateStr,
      original_user_id: currentAnalystId,
      substitute_user_id: transferCreateForm.substituteUserId,
      reason: trimmedReason,
      status: "PENDING_ACCEPTANCE",
      created_at: "Vừa xong",
      timeline: [
        {
          step: "CREATED",
          time: "Vừa xong",
          actor_id: currentAnalystId,
          text: `${currentUserObj.username} (${currentUserObj.name}) đã gửi đề nghị chuyển giao ca trực 1 chiều.`
        }
      ]
    };

    setTransferRequests(prev => [newTransfer, ...prev]);
    setShowCreateTransferModal(false);
    showToast(`Đã gửi đề nghị trực hộ thành công tới Kỹ sư ${userB ? userB.name : ""}!`, "success");
  };

  const handleAcceptTransfer = (transfer) => {
    const userB = MOCK_SOC_USERS.find(u => u.id === transfer.substitute_user_id);
    const updated = {
      ...transfer,
      status: "PENDING_APPROVAL",
      accepted_at: "Vừa xong",
      accepted_by: currentAnalystId,
      timeline: [
        ...transfer.timeline,
        {
          step: "ACCEPTED",
          time: "Vừa xong",
          actor_id: currentAnalystId,
          text: `${userB ? `${userB.username} (${userB.name})` : "Người trực hộ"} đã xác nhận đồng ý trực hộ.`
        }
      ]
    };

    setTransferRequests(prev => prev.map(t => t.id === transfer.id ? updated : t));
    if (selectedTransferDetail && selectedTransferDetail.id === transfer.id) {
      setSelectedTransferDetail(updated);
    }
    showToast(`Đã đồng ý trực hộ! Đang chờ Trưởng kíp / Quản lý SOC phê duyệt.`, "success");
  };

  const handleOpenDeclineModal = (transfer) => {
    setRejectionTarget({ transfer, action: "DECLINE" });
    setRejectionReasonText("");
    setRejectionError("");
    setShowRejectionModal(true);
  };

  const handleOpenRejectModal = (transfer) => {
    setRejectionTarget({ transfer, action: "REJECT" });
    setRejectionReasonText("");
    setRejectionError("");
    setShowRejectionModal(true);
  };

  const handleConfirmRejectionSubmit = () => {
    if (!rejectionReasonText.trim()) {
      setRejectionError("Lý do từ chối là bắt buộc!");
      return;
    }
    const { transfer, action } = rejectionTarget;
    const actor = currentUserObj;
    const actionLabel = action === "DECLINE" ? "từ chối tiếp nhận trực hộ" : "bác bỏ đơn chuyển ca";

    const updated = {
      ...transfer,
      status: "REJECTED",
      rejection_reason: rejectionReasonText.trim(),
      declined_at: action === "DECLINE" ? "Vừa xong" : transfer.declined_at,
      declined_by: action === "DECLINE" ? currentAnalystId : transfer.declined_by,
      rejected_at: action === "REJECT" ? "Vừa xong" : undefined,
      rejected_by: action === "REJECT" ? currentAnalystId : undefined,
      timeline: [
        ...transfer.timeline,
        {
          step: "REJECTED",
          time: "Vừa xong",
          actor_id: currentAnalystId,
          text: `${actor.username} (${actor.name}) đã ${action === "DECLINE" ? "từ chối trực hộ" : "bác bỏ đơn"}: "${rejectionReasonText.trim()}."`
        }
      ]
    };

    setTransferRequests(prev => prev.map(t => t.id === transfer.id ? updated : t));
    if (selectedTransferDetail && selectedTransferDetail.id === transfer.id) {
      setSelectedTransferDetail(updated);
    }
    setShowRejectionModal(false);
    showToast(`Đã ${actionLabel} thành công!`, "warning");
  };

  const handleApproveTransfer = (transfer) => {
    const actor = currentUserObj;
    const subUser = MOCK_SOC_USERS.find(u => u.id === transfer.substitute_user_id);
    const updated = {
      ...transfer,
      status: "APPROVED",
      approved_at: "Vừa xong",
      approved_by: currentAnalystId,
      timeline: [
        ...transfer.timeline,
        {
          step: "APPROVED",
          time: "Vừa xong",
          actor_id: currentAnalystId,
          text: `${actor.username} (${actor.name}) đã phê duyệt lịch chuyển ca.`
        }
      ]
    };

    setTransferRequests(prev => prev.map(t => t.id === transfer.id ? updated : t));
    if (selectedTransferDetail && selectedTransferDetail.id === transfer.id) {
      setSelectedTransferDetail(updated);
    }

    // [BR-04] Sync with approvedTransfers for calendar & effective schedule
    setApprovedTransfers(prev => {
      const filtered = prev.filter(t => t.id !== transfer.id && !(t.shift_id === transfer.shift_id && t.shift_date === transfer.shift_date && t.original_user_id === transfer.original_user_id));
      return [...filtered, {
        id: transfer.id,
        shift_id: transfer.shift_id,
        shift_date: transfer.shift_date,
        original_user_id: transfer.original_user_id,
        substitute_user_id: transfer.substitute_user_id,
        status: "APPROVED",
        reason: transfer.reason,
        approved_by: actor.username,
        approved_at: "Vừa xong"
      }];
    });

    showToast(`Phê duyệt đơn chuyển ca thành công! Trách nhiệm trực ca đã khóa trực tiếp vào User ID của Kỹ sư tiếp nhận.`, "success");
  };

  const handleOpenCancelModal = (transfer) => {
    setCancelTargetTransfer(transfer);
    setShowCancelModal(true);
  };

  const handleConfirmCancelSubmit = () => {
    if (!cancelTargetTransfer) return;
    const transfer = cancelTargetTransfer;
    const updated = {
      ...transfer,
      status: "CANCELLED",
      cancelled_at: "Vừa xong",
      cancelled_by: currentAnalystId,
      timeline: [
        ...transfer.timeline,
        {
          step: "CANCELLED",
          time: "Vừa xong",
          actor_id: currentAnalystId,
          text: `${currentUserObj.username} (${currentUserObj.name}) đã chủ động hủy bỏ đơn đề nghị.`
        }
      ]
    };

    setTransferRequests(prev => prev.map(t => t.id === transfer.id ? updated : t));
    setApprovedTransfers(prev => prev.filter(t => t.id !== transfer.id));
    if (selectedTransferDetail && selectedTransferDetail.id === transfer.id) {
      setSelectedTransferDetail(updated);
    }
    setShowCancelModal(false);
    showToast(`Đã hủy đơn đề nghị chuyển ca!`, "warning");
  };

  const handleOpenTransferDetail = (transfer) => {
    setSelectedTransferDetail(transfer);
    setShowTransferDetailDrawer(true);
  };


  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: "#0c1033", color: "#FEFEFE" }}>
      
      {/* ═══════════════════════════════════════════════════════════
          1. TOP NAVBAR (NCS SOAR HEADER - Pixel Clone)
      ═══════════════════════════════════════════════════════════ */}
      <header style={{
        height: 52,
        background: "var(--neu1)",
        borderBottom: "1px solid var(--line)",
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        padding: "0 20px",
        position: "sticky",
        top: 0,
        zIndex: 1000
      }}>
        {/* Left Brand & Global Menus */}
        <div style={{ display: "flex", alignItems: "center", gap: 32 }}>
          {/* NCS Logo */}
          <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
            <Icon name="ncsLogo" size={26} />
            <span style={{ fontSize: 18, fontWeight: 800, letterSpacing: 1.2, color: "#FEFEFE" }}>NCS</span>
          </div>

          {/* Header Navigation Tabs */}
          <nav style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {["TRANG CHỦ", "BẢNG ĐIỀU KHIỂN", "BÁO CÁO", "QUY TRÌNH", "SỰ VIỆC", "CÔNG VIỆC", "CẢNH BÁO"].map(item => (
              <a key={item} href={`#${item}`} style={{
                color: "var(--text-menu)",
                textDecoration: "none",
                fontSize: 12,
                fontWeight: 600,
                padding: "8px 12px",
                borderRadius: 4,
                transition: "all 0.15s ease"
              }}
              onMouseEnter={e => e.currentTarget.style.color = "var(--white)"}
              onMouseLeave={e => e.currentTarget.style.color = "var(--text-menu)"}>
                {item}
              </a>
            ))}
            
            {/* Active QUẢN TRỊ Menu */}
            <a href="#settings" style={{
              color: "var(--main)",
              background: "rgba(41, 163, 241, 0.1)",
              borderBottom: "2px solid var(--main)",
              textDecoration: "none",
              fontSize: 12,
              fontWeight: 700,
              padding: "8px 14px",
              borderRadius: "4px 4px 0 0"
            }}>
              QUẢN TRỊ
            </a>
          </nav>
        </div>

        {/* Right Header Controls */}
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          {/* Notification Bell */}
          <div style={{ position: "relative", cursor: "pointer" }}>

            </p>

              onChange={e => {

            name={toast.type === "error" ? "alertCircle" : toast.type === "warning" ? "alertCircle" : "checkCircle"}
            size={20}
            color={toast.type === "error" ? "var(--red)" : toast.type === "warning" ? "var(--orange)" : "var(--green)"}
          />
          <div style={{ fontSize: 12.5, color: "#FEFEFE", lineHeight: 1.4, flex: 1 }}>
            {toast.message}
          </div>
          <button onClick={() => setToast(null)} style={{ background: "none", border: "none", color: "var(--text-menu)", cursor: "pointer" }}>
            <Icon name="close" size={14} />
          </button>
        </div>
      )}

    </div>
  );
}

// Mount the App
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
