  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
      strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className={className}
      style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0 }}>

};

/* ═══════════════════════════════════════════════════════════
   MAIN APPLICATION COMPONENT
═══════════════════════════════════════════════════════════ */
function App() {
  // Application States
  const [rules, setRules] = useState(INITIAL_RULES);
  const [role, setRole] = useState("ADMIN"); // "ANALYST" | "ADMIN"
  const [selectedTenant, setSelectedTenant] = useState("ALL");
  const [selectedStatus, setSelectedStatus] = useState("ALL");
  const [searchQuery, setSearchQuery] = useState("");
  const [collapsedTenants, setCollapsedTenants] = useState({});
  
  // Modals States
  const [showEditorModal, setShowEditorModal] = useState(false);
  const [editingRule, setEditingRule] = useState(null); // null = new, rule = edit/resubmit
  const [isResubmitMode, setIsResubmitMode] = useState(false);
  
  const [showApprovalModal, setShowApprovalModal] = useState(false);
  const [targetRuleForApproval, setTargetRuleForApproval] = useState(null);
  
  const [showRejectModal, setShowRejectModal] = useState(false);
  const [targetRuleForReject, setTargetRuleForReject] = useState(null);
  const [rejectReasonInput, setRejectReasonInput] = useState("");
  
  const [showViewRejectModal, setShowViewRejectModal] = useState(false);
  const [viewingRejectRule, setViewingRejectRule] = useState(null);
  
  const [showDeleteModal, setShowDeleteModal] = useState(false);
  const [targetRuleForDelete, setTargetRuleForDelete] = useState(null);

  // Toast Notification State
  const [toast, setToast] = useState(null);

  const showToast = (message, type = "success") => {
    setToast({ message, type });
    setTimeout(() => setToast(null), 3500);
  };

  // Filtered Rules computation
  const filteredRules = useMemo(() => {
    return rules.filter(r => {
      const matchTenant = selectedTenant === "ALL" || r.tenantId === selectedTenant;
      const matchStatus = selectedStatus === "ALL" || r.status === selectedStatus;
      const matchQuery = !searchQuery.trim() || 
        r.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        r.reason.toLowerCase().includes(searchQuery.toLowerCase()) ||
        r.id.toLowerCase().includes(searchQuery.toLowerCase());
      return matchTenant && matchStatus && matchQuery;
    });
  }, [rules, selectedTenant, selectedStatus, searchQuery]);

  // Metrics summary
  const metrics = useMemo(() => {
    return {
      total: rules.length,
      active: rules.filter(r => r.status === "ACTIVE" && r.isEnabled).length,
      pending: rules.filter(r => r.status === "PENDING").length,
      rejected: rules.filter(r => r.status === "REJECTED").length
    };
  }, [rules]);

  // Group rules by Tenant for Display
  const groupedRulesByTenant = useMemo(() => {
    const groups = {};
    MOCK_TENANTS.forEach(t => {
      groups[t.id] = { tenant: t, rules: [] };
    });
    filteredRules.forEach(r => {
      if (groups[r.tenantId]) {
        groups[r.tenantId].rules.push(r);
      } else {
        groups[r.tenantId] = { 
          tenant: { id: r.tenantId, name: r.tenantName }, 
          rules: [r] 
        };
      }
    });
    return Object.values(groups).filter(g => g.rules.length > 0);
  }, [filteredRules]);

  // Actions
  const handleToggleRuleStatus = (ruleId) => {
    if (role !== "ADMIN") {
      showToast("Chỉ Trưởng ca / Admin mới có quyền Bật/Tắt quy tắc đang hoạt động!", "error");
      return;
    }
    setRules(prev => prev.map(r => {
      if (r.id === ruleId) {
        const nextEnabled = !r.isEnabled;
        showToast(`Đã ${nextEnabled ? "BẬT" : "TẮT"} quy tắc "${r.name}"`);
        return { ...r, isEnabled: nextEnabled };
      }
      return r;
    }));
  };

  const handleOpenCreateModal = () => {
    setEditingRule(null);
    setIsResubmitMode(false);
    setShowEditorModal(true);
  };

  const handleOpenEditModal = (rule) => {
    if (rule.status === "ACTIVE" && role !== "ADMIN") {
      showToast("Bạn không có quyền chỉnh sửa quy tắc đang Hoạt động!", "error");
      return;
    }
    setEditingRule(rule);
    setIsResubmitMode(rule.status === "REJECTED");
    setShowEditorModal(true);
  };

  const handleSaveRule = (formData, isDirectApprove = false) => {
    if (editingRule) {
      // Update existing
      setRules(prev => prev.map(r => {
        if (r.id === editingRule.id) {
          const isCriticalChange = r.status === "ACTIVE" && (
            JSON.stringify(r.conditionTree) !== JSON.stringify(formData.conditionTree) ||
            r.validUntil !== formData.validUntil
          );
          
          let nextStatus = r.status;
          if (isResubmitMode) nextStatus = "PENDING";
          else if (isCriticalChange) nextStatus = "PENDING";

          if (isCriticalChange) {
            showToast("Quy tắc đã được cập nhật và chuyển về CHỜ DUYỆT LẠI do thay đổi điều kiện/thời hạn!", "warning");
          } else {
            showToast(isResubmitMode ? "Đã gửi duyệt lại quy tắc thành công!" : "Đã cập nhật thông tin quy tắc!");
          }

          return {
            ...r,
            name: formData.name,
            tenantId: formData.tenantId,
            tenantName: MOCK_TENANTS.find(t => t.id === formData.tenantId)?.name || r.tenantName,
            validUntil: formData.validUntil,
            reason: formData.reason,
            conditionTree: formData.conditionTree,
            status: nextStatus,
            rejectionReason: isResubmitMode ? null : r.rejectionReason
          };
        }
        return r;
      }));
    } else {
      // Create new
      const newId = `SUP-00${rules.length + 1}`;
      const newRule = {
        id: newId,
        name: formData.name,
        tenantId: formData.tenantId,
        tenantName: MOCK_TENANTS.find(t => t.id === formData.tenantId)?.name || "Khách hàng",
        validUntil: formData.validUntil,
        reason: formData.reason,
        status: isDirectApprove ? "ACTIVE" : "PENDING",
        isEnabled: true,
        createdBy: role === "ADMIN" ? "tomhagen (SOC Admin)" : "analyst_01 (Kỹ sư SOC)",
        createdAt: new Date().toISOString().replace('T', ' ').slice(0, 16),
        approvedBy: isDirectApprove ? (role === "ADMIN" ? "tomhagen (SOC Admin)" : "System") : null,
        approvedAt: isDirectApprove ? new Date().toISOString().replace('T', ' ').slice(0, 16) : null,
        rejectionReason: null,
        conditionTree: formData.conditionTree
      };
      setRules(prev => [newRule, ...prev]);
      showToast(isDirectApprove ? "Tạo và Phê duyệt ngay quy tắc thành công!" : "Đã tạo đề xuất quy tắc loại trừ! Vui lòng chờ Trưởng ca duyệt.");
    }
    setShowEditorModal(false);
  };

  const handleApproveRule = () => {
    if (!targetRuleForApproval) return;
    setRules(prev => prev.map(r => {
      if (r.id === targetRuleForApproval.id) {
        return {
          ...r,
          status: "ACTIVE",
          isEnabled: true,
          approvedBy: "tomhagen (SOC Lead)",
          approvedAt: new Date().toISOString().replace('T', ' ').slice(0, 16),
          rejectionReason: null
        };
      }
      return r;
    }));
    showToast(`Đã PHÊ DUYỆT quy tắc "${targetRuleForApproval.name}"`);
    setShowApprovalModal(false);
    setTargetRuleForApproval(null);
  };

  const handleRejectRule = () => {
    if (!targetRuleForReject) return;
    if (!rejectReasonInput.trim()) {
      alert("Vui lòng nhập lý do từ chối!");
      return;
    }
    setRules(prev => prev.map(r => {
      if (r.id === targetRuleForReject.id) {
        return {
          ...r,
          status: "REJECTED",
          isEnabled: false,
          approvedBy: "tomhagen (SOC Lead)",
          approvedAt: new Date().toISOString().replace('T', ' ').slice(0, 16),
          rejectionReason: rejectReasonInput.trim()
        };
      }
      return r;
    }));
    showToast(`Đã TỪ CHỐI quy tắc "${targetRuleForReject.name}"`, "warning");
    setShowRejectModal(false);
    setTargetRuleForReject(null);
    setRejectReasonInput("");
  };

  const handleDeleteRule = () => {
    if (!targetRuleForDelete) return;
    setRules(prev => prev.filter(r => r.id !== targetRuleForDelete.id));
    showToast(`Đã XÓA quy tắc "${targetRuleForDelete.name}"`);
    setShowDeleteModal(false);
    setTargetRuleForDelete(null);
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: DS.bgPage }}>
      
      {/* 1. TOP NAVBAR (NCS SOAR HEADER) */}
      <header style={{
        background: DS.headerBg, color: DS.headerText, height: 50,
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "0 20px", boxShadow: "0 2px 8px rgba(0,0,0,0.15)", zIndex: 100
      }}>
        {/* Brand & Main Nav */}
        <div style={{ display: "flex", alignItems: "center", gap: 24 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700, fontSize: 16, letterSpacing: 0.5 }}>
            <div style={{
              width: 28, height: 28, borderRadius: 6, background: DS.accent,
              display: "flex", alignItems: "center", justifyContent: "center", color: "#fff"
            }}>
              <Icon name="shield" size={16} />
            </div>
            <span>NCS SOAR</span>
          </div>

          <nav style={{ display: "flex", gap: 4 }}>

            <span>tomhagen</span>
            <span style={{

      {/* 2. ROLE SIMULATION BANNER */}
      <div style={{
        background: role === "ADMIN" ? "#eff6ff" : "#fefce8",

        padding: "8px 24px", display: "flex", alignItems: "center", justifyContent: "space-between",
        fontSize: 12
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, color: role === "ADMIN" ? "#1e40af" : "#854d0e" }}>
          <Icon name="info" size={14} />
          <span>
            Đang giả lập vai trò người dùng: <strong>{role === "ADMIN" ? "Người dùng có quyền phê duyệt (SOC Lead / Admin)" : "Người dùng có quyền tạo/sửa/xóa (Kỹ sư SOC)"}</strong>
          </span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: "#64748b" }}>Chuyển đổi vai trò để thử nghiệm giao diện:</span>
          <button onClick={() => setRole(r => r === "ADMIN" ? "ANALYST" : "ADMIN")} style={{
            padding: "4px 10px", fontSize: 11, fontWeight: 600, borderRadius: 4,
            border: `1px solid ${role === "ADMIN" ? "#3b82f6" : "#eab308"}`,
            background: "#fff", cursor: "pointer", color: role === "ADMIN" ? "#1d6bf3" : "#ca8a04"

      {/* 3. SUB-HEADER SETTINGS TABS */}
      <div style={{ background: "#fff", borderBottom: `1px solid ${DS.border}`, padding: "0 24px" }}>
        <div style={{ display: "flex", gap: 24, fontSize: 13, fontWeight: 500 }}>
          <a href="#rules" style={{ padding: "12px 0", color: DS.textMuted, textDecoration: "none" }}>
            Quy tắc tương quan (Correlation Rules)
          </a>
          <a href="#suppression" style={{
            padding: "12px 0", color: DS.accent, textDecoration: "none",
            borderBottom: `2px solid ${DS.accent}`, fontWeight: 600
          }}>
            Quy tắc loại trừ cảnh báo (Suppression Rules)
          </a>
          <a href="#sla" style={{ padding: "12px 0", color: DS.textMuted, textDecoration: "none" }}>
            Chính sách SLA
          </a>
          <a href="#shifts" style={{ padding: "12px 0", color: DS.textMuted, textDecoration: "none" }}>
            Quản lý Ca & Kíp trực
          </a>
          <a href="#tenants" style={{ padding: "12px 0", color: DS.textMuted, textDecoration: "none" }}>
            Khách hàng (Tenants)

          <div>
            <h1 style={{ fontSize: 20, fontWeight: 700, color: DS.textPrimary }}>
              QUẢN LÝ QUY TẮC LOẠI TRỪ CẢNH BÁO
            </h1>
            <p style={{ fontSize: 12, color: DS.textMuted, marginTop: 4 }}>
              Cấu hình các quy tắc loại trừ tự động cảnh báo nhiễu, hoạt động quét bảo trì hoặc diễn tập trước khi đưa vào bộ quy tắc tương quan tạo Case.
            </p>
          </div>

          <button onClick={handleOpenCreateModal} style={{
            display: "inline-flex", alignItems: "center", gap: 6,
            background: DS.accent, color: "#fff", border: "none",
            padding: "8px 16px", borderRadius: 6, fontSize: 12, fontWeight: 600,
            cursor: "pointer", boxShadow: "0 2px 4px rgba(29, 107, 243, 0.2)",
            transition: "background 0.15s"
          }}
          onMouseEnter={e => e.currentTarget.style.background = DS.accentHover}
          onMouseLeave={e => e.currentTarget.style.background = DS.accent}>
            <Icon name="plus" size={14} />
            <span>+ Tạo quy tắc loại trừ</span>
          </button>
        </div>

        {/* FILTER TOOLBAR */}

          background: DS.bgCard, border: `1px solid ${DS.border}`, borderRadius: 8,
          padding: 16, marginBottom: 20, display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap"
        }}>

            <div style={{ position: "absolute", left: 10, top: 8, color: DS.textMuted }}>
              <Icon name="search" size={14} />
            </div>
            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
              placeholder="Tìm theo: Tên quy tắc, Lý do loại trừ, Mã quy tắc..."
              style={{
                width: "100%", height: 32, paddingLeft: 32, paddingRight: 10,
                border: `1px solid ${DS.border}`, borderRadius: 6, fontSize: 12,
                outline: "none", background: DS.bgSubtle
              }}
              onFocus={e => e.target.style.borderColor = DS.accent}
              onBlur={e => e.target.style.borderColor = DS.border}
            />
          </div>

          {/* Tenant Filter */}
          <div style={{ width: 220 }}>
            <select value={selectedTenant} onChange={e => setSelectedTenant(e.target.value)}
              style={{
                width: "100%", height: 32, padding: "0 10px", fontSize: 12,
                border: `1px solid ${DS.border}`, borderRadius: 6, outline: "none",
                background: DS.bgSubtle, cursor: "pointer"
              }}>
              <option value="ALL">Tất cả Khách hàng (Tenants)</option>
              {MOCK_TENANTS.map(t => (
                <option key={t.id} value={t.id}>{t.name}</option>
              ))}
            </select>
          </div>

          {/* Status Filter */}
          <div style={{ width: 180 }}>
            <select value={selectedStatus} onChange={e => setSelectedStatus(e.target.value)}
              style={{
                width: "100%", height: 32, padding: "0 10px", fontSize: 12,
                border: `1px solid ${DS.border}`, borderRadius: 6, outline: "none",
                background: DS.bgSubtle, cursor: "pointer"
              }}>
              <option value="ALL">Tất cả Trạng thái</option>
              <option value="PENDING">Chờ duyệt (Pending)</option>
              <option value="ACTIVE">Đã duyệt (Active)</option>
              <option value="REJECTED">Bị từ chối (Rejected)</option>
            </select>
          </div>

          {/* Refresh button */}
          <button onClick={() => showToast("Đã tải lại danh sách quy tắc loại trừ")} style={{
            height: 32, padding: "0 12px", border: `1px solid ${DS.border}`,
            background: DS.bgSubtle, borderRadius: 6, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: DS.textSecondary
          }}>
            <Icon name="refresh" size={13} />
            <span>Làm mới</span>
          </button>
        </div>

        {/* RULES LISTING BY TENANT */}
        {groupedRulesByTenant.length === 0 ? (
          <div style={{
            background: DS.bgCard, border: `1px solid ${DS.border}`, borderRadius: 8,
            padding: 48, textAlign: "center", color: DS.textMuted
          }}>
            <Icon name="sliders" size={32} color="#cbd5e1" />
            <p style={{ marginTop: 12, fontSize: 14, fontWeight: 500 }}>Không tìm thấy quy tắc loại trừ nào phù hợp bộ lọc</p>
            <button onClick={handleOpenCreateModal} style={{
              marginTop: 16, background: DS.accent, color: "#fff", border: "none",
              padding: "6px 14px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer"
            }}>
              + Tạo quy tắc mới
            </button>
          </div>
        ) : (
          groupedRulesByTenant.map(group => {
            const isCollapsed = !!collapsedTenants[group.tenant.id];
            return (
              <div key={group.tenant.id} style={{
                background: DS.bgCard, border: `1px solid ${DS.border}`, borderRadius: 8,
                marginBottom: 20, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.05)"
              }}>
                {/* Tenant Header with Expand/Collapse Toggle */}
                <div 
                  onClick={() => setCollapsedTenants(prev => ({ ...prev, [group.tenant.id]: !prev[group.tenant.id] }))}
                  style={{
                    background: "#f8fafc", borderBottom: isCollapsed ? "none" : `1px solid ${DS.border}`,
                    padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between",
                    cursor: "pointer", userSelect: "none", transition: "background 0.15s"
                  }}
                  onMouseEnter={e => e.currentTarget.style.background = "#f1f5f9"}
                  onMouseLeave={e => e.currentTarget.style.background = "#f8fafc"}>
                  
                  <div style={{ display: "flex", alignItems: "center", gap: 10, fontWeight: 600, fontSize: 13, color: DS.textPrimary }}>
                    <Icon name={isCollapsed ? "chevronRight" : "chevronDown"} size={16} color={DS.textMuted} />
                    <Icon name="sliders" size={14} color={DS.accent} />
                    <span>{group.tenant.name}</span>
                    <span style={{
                      fontFamily: DS.monoFont, fontSize: 11, background: "#e2e8f0",
                      padding: "1px 6px", borderRadius: 10, color: DS.textSecondary
                    }}>
                      {group.rules.length} quy tắc
                    </span>
                  </div>

                  <div style={{ fontSize: 11, color: DS.textMuted, display: "flex", alignItems: "center", gap: 4 }}>
                    <span>{isCollapsed ? "Nhấn để mở rộng" : "Nhấn để thu gọn"}</span>
                  </div>
                </div>

                {/* Rules Table */}
                {!isCollapsed && (
                  <table style={{ width: "100%", borderCollapse: "collapse", textAlign: "left", fontSize: 12 }}>
                    <thead>
                      <tr style={{ background: "#fafafa", borderBottom: `1px solid ${DS.border}`, color: DS.textMuted, fontSize: 11, textTransform: "uppercase" }}>
                        <th style={{ padding: "10px 16px", width: 90 }}>Mã Rule</th>
                        <th style={{ padding: "10px 16px" }}>Tên Quy tắc & Lý do loại trừ</th>
                        <th style={{ padding: "10px 16px", width: 220 }}>Thời hạn hiệu lực</th>
                        <th style={{ padding: "10px 16px", width: 240 }}>Điều kiện so khớp (AST)</th>
                        <th style={{ padding: "10px 16px", width: 140 }}>Trạng thái</th>
                        <th style={{ padding: "10px 16px", width: 160 }}>Người tạo / Duyệt</th>
                        <th style={{ padding: "10px 16px", width: 120, textAlign: "right" }}>Thao tác</th>
                      </tr>
                    </thead>
                    <tbody>
                      {group.rules.map(rule => (
                        <RuleTableRow key={rule.id} rule={rule} role={role}
                          onToggleStatus={() => handleToggleRuleStatus(rule.id)}
                          onEdit={() => handleOpenEditModal(rule)}
                          onApprove={() => { setTargetRuleForApproval(rule); setShowApprovalModal(true); }}
                          onReject={() => { setTargetRuleForReject(rule); setShowRejectModal(true); }}
                          onViewReject={() => { setViewingRejectRule(rule); setShowViewRejectModal(true); }}
                          onDelete={() => { setTargetRuleForDelete(rule); setShowDeleteModal(true); }}
                        />
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            );
          })
        )}

      </main>

      {/* 5. MODALS CONTAINER */}
      {/* 5.1 Editor Modal (Create / Edit / Resubmit) */}
      {showEditorModal && (
        <EditorModal
          rule={editingRule}
          isResubmit={isResubmitMode}
          role={role}
          onClose={() => setShowEditorModal(false)}
          onSave={handleSaveRule}
        />
      )}

      {/* 5.2 Approval Modal */}
      {showApprovalModal && targetRuleForApproval && (
        <ApprovalModal
          rule={targetRuleForApproval}
          onClose={() => setShowApprovalModal(false)}
          onConfirm={handleApproveRule}
        />
      )}

      {/* 5.3 Reject Modal */}
      {showRejectModal && targetRuleForReject && (
        <RejectModal
          rule={targetRuleForReject}
          reason={rejectReasonInput}
          setReason={setRejectReasonInput}
          onClose={() => setShowRejectModal(false)}
          onConfirm={handleRejectRule}
        />
      )}

      {/* 5.4 View Rejection Reason Modal */}
      {showViewRejectModal && viewingRejectRule && (
        <ViewRejectModal
          rule={viewingRejectRule}
          onClose={() => setShowViewRejectModal(false)}
          onResubmit={() => {
            setShowViewRejectModal(false);
            handleOpenEditModal(viewingRejectRule);
          }}
        />
      )}

      {/* 5.5 Delete Modal */}
      {showDeleteModal && targetRuleForDelete && (
        <DeleteModal
          rule={targetRuleForDelete}
          onClose={() => setShowDeleteModal(false)}
          onConfirm={handleDeleteRule}
        />
      )}

      {/* Toast Notification */}
      {toast && (
        <div className="animate-slide" style={{
          position: "fixed", bottom: 24, right: 24, zIndex: 9999,
          background: toast.type === "error" ? "#fee2e2" : toast.type === "warning" ? "#fef3c7" : "#d1fae5",
          border: `1px solid ${toast.type === "error" ? "#fca5a5" : toast.type === "warning" ? "#fde68a" : "#a7f3d0"}`,
          color: toast.type === "error" ? "#b91c1c" : toast.type === "warning" ? "#b45309" : "#047857",
          padding: "12px 16px", borderRadius: 8, boxShadow: "0 10px 25px rgba(0,0,0,0.1)",
          display: "flex", alignItems: "center", gap: 10, fontSize: 13, fontWeight: 500
        }}>
          <Icon name={toast.type === "error" ? "alert" : toast.type === "warning" ? "info" : "check"} size={16} />
          <span>{toast.message}</span>
        </div>
      )}

    </div>
  );
}

// Stat Card
const MetricCard = ({ title, count, color, bg, border, icon }) => (
  <div style={{
    background: bg, border: `1px solid ${border}`, borderRadius: 8,
    padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between"
  }}>
    <div>
      <div style={{ fontSize: 11, fontWeight: 600, color: DS.textMuted, textTransform: "uppercase" }}>{title}</div>
      <div style={{ fontSize: 22, fontWeight: 700, color, fontFamily: DS.monoFont, marginTop: 2 }}>{count}</div>
    </div>
    <div style={{
      width: 36, height: 36, borderRadius: 8, background: "#fff",
      display: "flex", alignItems: "center", justifyContent: "center",
      boxShadow: "0 1px 3px rgba(0,0,0,0.05)"
    }}>
      <Icon name={icon} size={18} color={color} />
    </div>
  </div>
);

// Rule Table Row Component
const RuleTableRow = ({ rule, role, onToggleStatus, onEdit, onApprove, onReject, onViewReject, onDelete }) => {
  const isExpired = new Date(rule.validUntil) < new Date();
  
  const statusBadge = {
    PENDING: { label: "Chờ duyệt", theme: DS.pending },
    ACTIVE: { label: rule.isEnabled ? "Đã duyệt" : "Đã tắt", theme: rule.isEnabled ? DS.active : DS.inactive },
    REJECTED: { label: "Bị từ chối", theme: DS.rejected }
  }[rule.status];

  return (
    <tr style={{ borderBottom: `1px solid ${DS.border}`, transition: "background 0.1s" }}
      onMouseEnter={e => e.currentTarget.style.background = "#f8fafc"}
      onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
      
      {/* Rule Code */}
      <td style={{ padding: "12px 16px", fontFamily: DS.monoFont, fontWeight: 600, color: DS.accent }}>
        {rule.id}
      </td>

      {/* Name & Reason */}
      <td style={{ padding: "12px 16px" }}>
        <div style={{ fontWeight: 600, color: DS.textPrimary, cursor: "pointer" }} onClick={onEdit}>
          {rule.name}
        </div>
        <div style={{ fontSize: 11, color: DS.textMuted, marginTop: 4, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
          Lý do: {rule.reason}
        </div>
      </td>

      {/* Valid Until */}
      <td style={{ padding: "12px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: DS.monoFont, fontSize: 11 }}>
          <Icon name="clock" size={13} color={isExpired ? "#ef4444" : DS.textMuted} />
          <span style={{ color: isExpired ? "#ef4444" : DS.textPrimary, fontWeight: isExpired ? 600 : 400 }}>
            {rule.validUntil.replace('T', ' ')}
          </span>
        </div>
        {isExpired && (
          <span style={{
            fontSize: 10, color: "#ef4444", background: "#fee2e2",
            padding: "1px 6px", borderRadius: 4, marginTop: 4, display: "inline-block"
          }}>
            Hết hạn hiệu lực
          </span>
        )}
      </td>

      {/* Condition Tree summary */}
      <td style={{ padding: "12px 16px" }}>
        <div style={{
          fontFamily: DS.monoFont, fontSize: 10, background: "#f1f5f9",
          padding: "4px 8px", borderRadius: 4, border: `1px solid ${DS.border}`,
          color: "#334155", maxWidth: 240, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap"
        }}>
          ({rule.conditionTree.conditions.map(c => `${c.field} ${c.operator} "${c.value}"`).join(` ${rule.conditionTree.logic} `)})
        </div>
      </td>

      {/* Status Badge & Toggle */}
      <td style={{ padding: "12px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{
            background: statusBadge.theme.bg, color: statusBadge.theme.text,
            border: `1px solid ${statusBadge.theme.border}`,
            padding: "2px 8px", borderRadius: 12, fontSize: 10, fontWeight: 600
          }}>
            {statusBadge.label}
          </span>

          {rule.status === "ACTIVE" && (
            <button onClick={onToggleStatus} title={rule.isEnabled ? "Bấm để Tắt" : "Bấm để Bật"} style={{
              width: 32, height: 18, borderRadius: 9, border: "none", cursor: "pointer",
              background: rule.isEnabled ? DS.accent : "#cbd5e1", position: "relative",
              transition: "background 0.2s"
            }}>
              <div style={{
                width: 14, height: 14, borderRadius: "50%", background: "#fff",
                position: "absolute", top: 2, left: rule.isEnabled ? 16 : 2,
                transition: "left 0.2s"
              }} />
            </button>
          )}
        </div>
      </td>

      {/* Creator & Approver */}
      <td style={{ padding: "12px 16px", fontSize: 11 }}>
        <div>Tạo: <span style={{ color: DS.textPrimary }}>{rule.createdBy}</span></div>
        <div style={{ color: DS.textMuted, fontSize: 10 }}>{rule.createdAt}</div>
        {rule.approvedBy && (
          <div style={{ marginTop: 2, color: "#047857" }}>Duyệt: {rule.approvedBy}</div>
        )}
      </td>

      {/* Action Buttons */}
      <td style={{ padding: "12px 16px", textAlign: "right" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 6 }}>
          
          {/* Pending Actions */}
          {rule.status === "PENDING" && (
            <>
              {role === "ADMIN" && (
                <>
                  <button onClick={onApprove} title="Phê duyệt" style={actionBtnStyle("#10b981", "#d1fae5")}>
                    <Icon name="check" size={13} />
                  </button>
                  <button onClick={onReject} title="Từ chối" style={actionBtnStyle("#ef4444", "#fee2e2")}>
                    <Icon name="x" size={13} />
                  </button>
                </>
              )}
              <button onClick={onEdit} title="Sửa đề xuất" style={actionBtnStyle(DS.accent, "#eff6ff")}>
                <Icon name="edit" size={13} />
              </button>
              <button onClick={onDelete} title="Xóa đề xuất" style={actionBtnStyle("#64748b", "#f1f5f9")}>
                <Icon name="trash" size={13} />
              </button>
            </>
          )}

          {/* Rejected Actions */}
          {rule.status === "REJECTED" && (
            <>
              <button onClick={onViewReject} title="Xem lý do từ chối" style={actionBtnStyle("#ca8a04", "#fef9c3")}>
                <Icon name="eye" size={13} />
              </button>
              <button onClick={onEdit} title="Sửa & Gửi duyệt lại" style={actionBtnStyle(DS.accent, "#eff6ff")}>
                <Icon name="resubmit" size={13} />
              </button>
              <button onClick={onDelete} title="Xóa quy tắc" style={actionBtnStyle("#64748b", "#f1f5f9")}>
                <Icon name="trash" size={13} />
              </button>
            </>
          )}

          {/* Active Actions */}
          {rule.status === "ACTIVE" && (
            <>
              <button onClick={onEdit} title="Sửa quy tắc" style={actionBtnStyle(DS.accent, "#eff6ff")}>
                <Icon name="edit" size={13} />
              </button>
              {role === "ADMIN" && (
                <button onClick={onDelete} title="Xóa quy tắc" style={actionBtnStyle("#ef4444", "#fee2e2")}>
                  <Icon name="trash" size={13} />
                </button>
              )}
            </>
          )}

        </div>
      </td>
    </tr>
  );
};

const actionBtnStyle = (color, bg) => ({
  width: 26, height: 26, borderRadius: 4, border: "none", cursor: "pointer",
  background: bg, color: color, display: "flex", alignItems: "center", justifyContent: "center",
  transition: "all 0.15s"
});

/* ═══════════════════════════════════════════════════════════
   MODAL 1: EDITOR MODAL (CREATE / EDIT / RESUBMIT)
═══════════════════════════════════════════════════════════ */
function EditorModal({ rule, isResubmit, role, onClose, onSave }) {
  const [name, setName] = useState(rule ? rule.name : "");
  const [tenantId, setTenantId] = useState(rule ? rule.tenantId : MOCK_TENANTS[0].id);
  const [validUntil, setValidUntil] = useState(rule ? rule.validUntil : "2026-10-31T23:59");
  const [reason, setReason] = useState(rule ? rule.reason : "");
  const [conditionTree, setConditionTree] = useState(rule ? rule.conditionTree : {
    logic: "AND",
    conditions: [{ field: "srcAddr", operator: "cidr", value: "192.168.1.0/24" }]
  });

  const [errors, setErrors] = useState({});

  const handleAddCondition = () => {
    setConditionTree(prev => ({
      ...prev,
      conditions: [...prev.conditions, { field: "srcAddr", operator: "=", value: "" }]
    }));
  };

  const handleRemoveCondition = (index) => {
    if (conditionTree.conditions.length <= 1) {
      alert("Cần giữ lại tối thiểu 01 điều kiện lọc!");
      return;
    }
    setConditionTree(prev => ({
      ...prev,
      conditions: prev.conditions.filter((_, i) => i !== index)
    }));
  };

  const handleConditionChange = (index, key, value) => {
    setConditionTree(prev => {
      const nextConds = [...prev.conditions];
      nextConds[index] = { ...nextConds[index], [key]: value };
      return { ...prev, conditions: nextConds };
    });
  };

  const handleValidateAndSubmit = (isDirectApprove = false) => {
    const err = {};
    if (!name.trim()) err.name = "Tên quy tắc là bắt buộc!";
    if (!reason.trim()) err.reason = "Lý do loại trừ là bắt buộc!";
    if (!validUntil) err.validUntil = "Thời hạn hiệu lực là bắt buộc!";
    
    // Check condition tree
    const hasEmptyCond = conditionTree.conditions.some(c => !c.value.trim());
    if (hasEmptyCond) err.conditions = "Vui lòng nhập đầy đủ giá trị so sánh cho tất cả các điều kiện!";

    if (Object.keys(err).length > 0) {
      setErrors(err);
      return;
    }

    onSave({ name: name.trim(), tenantId, validUntil, reason: reason.trim(), conditionTree }, isDirectApprove);
  };

  return (
    <div style={modalOverlayStyle}>
      <div className="animate-fade" style={{ ...modalContentStyle, maxWidth: 760 }}>
        
        {/* Modal Header */}
        <div style={modalHeaderStyle}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700, fontSize: 15 }}>
            <Icon name="sliders" size={16} color={DS.accent} />
            <span>
              {isResubmit ? "ĐIỀU CHỈNH & GỬI DUYỆT LẠI QUY TẮC" : rule ? "CHỈNH SỬA QUY TẮC LOẠI TRỪ CẢNH BÁO" : "TẠO QUY TẮC LOẠI TRỪ CẢNH BÁO MỚI"}
            </span>
          </div>
          <button onClick={onClose} style={closeBtnStyle}><Icon name="x" size={16} /></button>
        </div>

        {/* Modal Body */}
        <div style={{ padding: 20, maxHeight: "75vh", overflowY: "auto" }}>
          
          {/* Rejection Alert Banner if in Resubmit mode */}
          {isResubmit && rule && rule.rejectionReason && (
            <div style={{
              background: "#fef2f2", border: "1px solid #fca5a5", borderRadius: 6,
              padding: 12, marginBottom: 16, color: "#991b1b", fontSize: 12
            }}>
              <div style={{ fontWeight: 700, marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}>
                <Icon name="alert" size={14} color="#dc2626" />
                <span>Lý do bị từ chối trước đó do {rule.approvedBy || "Quản lý"} ghi nhận:</span>
              </div>
              <p style={{ marginLeft: 20 }}>"{rule.rejectionReason}"</p>
            </div>
          )}

          {/* Form Grid */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            
            {/* Tên quy tắc */}
            <div style={{ gridColumn: "span 2" }}>
              <label style={labelStyle}>Tên quy tắc loại trừ <span style={{ color: "#ef4444" }}>*</span></label>
              <input type="text" value={name} onChange={e => setName(e.target.value)}
                placeholder="Ví dụ: Bỏ qua quét lỗ hổng Nessus Server định kỳ"
                style={{ ...inputStyle, borderColor: errors.name ? "#ef4444" : DS.border }}
              />
              {errors.name && <div style={errorTextStyle}>{errors.name}</div>}
            </div>

            {/* Khách hàng */}
            <div>
              <label style={labelStyle}>Khách hàng (Tenant) <span style={{ color: "#ef4444" }}>*</span></label>
              <select value={tenantId} onChange={e => setTenantId(e.target.value)} disabled={!!rule}
                style={{ ...inputStyle, cursor: rule ? "not-allowed" : "pointer", background: rule ? "#f1f5f9" : "#fff" }}>
                {MOCK_TENANTS.map(t => (
                  <option key={t.id} value={t.id}>{t.name}</option>
                ))}
              </select>
            </div>

            {/* Thời hạn hiệu lực */}
            <div>
              <label style={labelStyle}>Thời hạn hiệu lực <span style={{ color: "#ef4444" }}>*</span></label>
              <input type="datetime-local" value={validUntil} onChange={e => setValidUntil(e.target.value)}
                style={{ ...inputStyle, borderColor: errors.validUntil ? "#ef4444" : DS.border }}
              />
              <div style={{ fontSize: 10, color: DS.textMuted, marginTop: 4 }}>Tối đa 90 ngày kể từ ngày tạo</div>
              {errors.validUntil && <div style={errorTextStyle}>{errors.validUntil}</div>}
            </div>

            {/* Lý do loại trừ */}
            <div style={{ gridColumn: "span 2" }}>
              <label style={labelStyle}>Lý do loại trừ nghiệp vụ <span style={{ color: "#ef4444" }}>*</span></label>
              <textarea value={reason} onChange={e => setReason(e.target.value)} rows={3}
                placeholder="Nhập chi tiết căn cứ nghiệp vụ (ví dụ: IP scan theo kế hoạch pentest quý 3 đã được phê duyệt)..."
                style={{ ...inputStyle, height: "auto", padding: 8, borderColor: errors.reason ? "#ef4444" : DS.border }}
              />
              <div style={{ fontSize: 10, color: DS.textMuted, marginTop: 2, textAlign: "right" }}>{reason.length}/500 ký tự</div>
              {errors.reason && <div style={errorTextStyle}>{errors.reason}</div>}
            </div>

          </div>

          {/* CONDITION TREE BUILDER */}
          <div style={{ border: `1px solid ${DS.border}`, borderRadius: 6, padding: 16, background: "#fafafa" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <div style={{ fontWeight: 600, fontSize: 12, color: DS.textPrimary, display: "flex", alignItems: "center", gap: 8 }}>
                <span>BỘ LỌC ĐIỀU KIỆN LOẠI TRỪ (CONDITION TREE)</span>
                <span style={{ fontSize: 11, fontWeight: 400, color: DS.textMuted }}>Toán tử nhóm:</span>
                <button onClick={() => setConditionTree(prev => ({ ...prev, logic: prev.logic === "AND" ? "OR" : "AND" }))} style={{
                  padding: "2px 8px", fontSize: 11, fontWeight: 700, borderRadius: 4, cursor: "pointer",
                  background: conditionTree.logic === "AND" ? "#dbeafe" : "#fef3c7",
                  color: conditionTree.logic === "AND" ? "#1d6bf3" : "#d97706",
                  border: `1px solid ${conditionTree.logic === "AND" ? "#bfdbfe" : "#fde68a"}`
                }}>
                  {conditionTree.logic === "AND" ? "VÀ (ALL MATCH)" : "HOẶC (ANY MATCH)"}
                </button>
              </div>

              <button onClick={handleAddCondition} style={{
                background: "#fff", border: `1px solid ${DS.border}`, padding: "4px 8px",
                borderRadius: 4, fontSize: 11, fontWeight: 600, color: DS.accent, cursor: "pointer"
              }}>
                + Thêm điều kiện
              </button>
            </div>

            {/* Condition Lines */}
            {conditionTree.conditions.map((cond, idx) => (
              <div key={idx} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
                {/* Field Select */}
                <select value={cond.field} onChange={e => handleConditionChange(idx, "field", e.target.value)}
                  style={{ ...inputStyle, width: 180 }}>
                  {MOCK_FIELDS.map(f => (
                    <option key={f.id} value={f.id}>{f.label}</option>
                  ))}
                </select>

                {/* Operator Select */}
                <select value={cond.operator} onChange={e => handleConditionChange(idx, "operator", e.target.value)}
                  style={{ ...inputStyle, width: 180 }}>
                  {MOCK_OPERATORS.map(op => (
                    <option key={op.id} value={op.id}>{op.label}</option>
                  ))}
                </select>

                {/* Value Input */}
                <input type="text" value={cond.value} onChange={e => handleConditionChange(idx, "value", e.target.value)}
                  placeholder="Nhập giá trị so sánh (ví dụ: 192.168.1.50)..."
                  style={{ ...inputStyle, flex: 1, fontFamily: DS.monoFont }}
                />

                {/* Remove Line Button */}
                <button onClick={() => handleRemoveCondition(idx)} style={{
                  width: 30, height: 30, borderRadius: 4, border: "none",
                  background: "#fee2e2", color: "#ef4444", cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center"
                }}>
                  <Icon name="x" size={14} />
                </button>
              </div>
            ))}

            {errors.conditions && <div style={{ ...errorTextStyle, marginTop: 8 }}>{errors.conditions}</div>}
          </div>

        </div>

        {/* Modal Footer */}
        <div style={modalFooterStyle}>
          <button onClick={onClose} style={btnSecondaryStyle}>Hủy bỏ</button>
          
          {role === "ADMIN" && !rule && (
            <button onClick={() => handleValidateAndSubmit(true)} style={{
              padding: "8px 16px", borderRadius: 6, border: "none", background: "#10b981",
              color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer"
            }}>
              Lưu & Phê duyệt ngay
            </button>
          )}

          <button onClick={() => handleValidateAndSubmit(false)} style={btnPrimaryStyle}>
            {isResubmit ? "Lưu & Gửi duyệt lại" : rule ? "Cập nhật quy tắc" : "Lưu đề xuất quy tắc"}
          </button>
        </div>

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MODAL 2: APPROVAL CONFIRMATION MODAL
═══════════════════════════════════════════════════════════ */
function ApprovalModal({ rule, onClose, onConfirm }) {
  return (
    <div style={modalOverlayStyle}>
      <div className="animate-fade" style={{ ...modalContentStyle, maxWidth: 500 }}>
        <div style={modalHeaderStyle}>
          <div style={{ fontWeight: 700, fontSize: 14, color: "#047857", display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="check" size={16} color="#10b981" />
            <span>XÁC NHẬN PHÊ DUYỆT QUY TẮC LOẠI TRỪ</span>
          </div>
          <button onClick={onClose} style={closeBtnStyle}><Icon name="x" size={16} /></button>
        </div>

        <div style={{ padding: 20 }}>
          <p style={{ fontSize: 13, color: DS.textPrimary }}>
            Bạn có chắc chắn muốn phê duyệt quy tắc loại trừ <strong>"{rule.name}"</strong> không?
          </p>

          <div style={{ background: "#f8fafc", border: `1px solid ${DS.border}`, borderRadius: 6, padding: 12, margin: "16px 0", fontSize: 12 }}>
            <div><strong>Khách hàng:</strong> {rule.tenantName}</div>
            <div style={{ marginTop: 4 }}><strong>Thời hạn:</strong> {rule.validUntil.replace('T', ' ')}</div>
            <div style={{ marginTop: 4 }}><strong>Lý do:</strong> {rule.reason}</div>
          </div>

          <div style={{ background: "#d1fae5", color: "#047857", padding: 10, borderRadius: 6, fontSize: 11 }}>
            💡 <strong>Lưu ý:</strong> Sau khi phê duyệt, các cảnh báo phát sinh khớp với điều kiện quy tắc này sẽ tự động được đánh dấu là Đã xử lý (Closed) và ngắt luồng không tạo Case.
          </div>
        </div>

        <div style={modalFooterStyle}>
          <button onClick={onClose} style={btnSecondaryStyle}>Hủy bỏ</button>
          <button onClick={onConfirm} style={{ ...btnPrimaryStyle, background: "#10b981" }}>
            Xác nhận Phê duyệt
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MODAL 3: REJECT MODAL
═══════════════════════════════════════════════════════════ */
function RejectModal({ rule, reason, setReason, onClose, onConfirm }) {
  return (
    <div style={modalOverlayStyle}>
      <div className="animate-fade" style={{ ...modalContentStyle, maxWidth: 500 }}>
        <div style={modalHeaderStyle}>
          <div style={{ fontWeight: 700, fontSize: 14, color: "#b91c1c", display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="x" size={16} color="#ef4444" />
            <span>TỪ CHỐI DUYỆT QUY TẮC LOẠI TRỪ</span>
          </div>
          <button onClick={onClose} style={closeBtnStyle}><Icon name="x" size={16} /></button>
        </div>

        <div style={{ padding: 20 }}>
          <p style={{ fontSize: 12, color: DS.textSecondary, marginBottom: 12 }}>
            Vui lòng nhập lý do từ chối để người đề xuất (Analyst) biết nguyên nhân và điều chỉnh lại quy tắc:
          </p>

          <textarea value={reason} onChange={e => setReason(e.target.value)} rows={4}
            placeholder="Nhập lý do từ chối (ví dụ: Dải IP quá rộng, cần thu hẹp CIDR từ /16 thành /24)..."
            style={{ ...inputStyle, height: "auto", padding: 8 }}
          />
        </div>

        <div style={modalFooterStyle}>
          <button onClick={onClose} style={btnSecondaryStyle}>Hủy bỏ</button>
          <button onClick={onConfirm} style={{ ...btnPrimaryStyle, background: "#ef4444" }}>
            Xác nhận Từ chối
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MODAL 4: VIEW REJECTION REASON MODAL
═══════════════════════════════════════════════════════════ */
function ViewRejectModal({ rule, onClose, onResubmit }) {
  return (
    <div style={modalOverlayStyle}>
      <div className="animate-fade" style={{ ...modalContentStyle, maxWidth: 480 }}>
        <div style={modalHeaderStyle}>
          <div style={{ fontWeight: 700, fontSize: 14, color: "#b45309", display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="info" size={16} color="#ca8a04" />
            <span>LÝ DO TỪ CHỐI DUYỆT QUY TẮC</span>
          </div>
          <button onClick={onClose} style={closeBtnStyle}><Icon name="x" size={16} /></button>
        </div>

        <div style={{ padding: 20 }}>
          <div style={{ fontWeight: 600, fontSize: 13, color: DS.textPrimary, marginBottom: 8 }}>
            {rule.name}
          </div>

          <div style={{ background: "#fef2f2", border: "1px solid #fca5a5", borderRadius: 6, padding: 12, color: "#991b1b", fontSize: 12 }}>
            <div style={{ fontWeight: 600, marginBottom: 4 }}>Ghi chú từ {rule.approvedBy || "Quản lý"}:</div>
            <p style={{ fontStyle: "italic" }}>"{rule.rejectionReason}"</p>
          </div>
        </div>

        <div style={modalFooterStyle}>
          <button onClick={onClose} style={btnSecondaryStyle}>Đóng</button>
          <button onClick={onResubmit} style={btnPrimaryStyle}>
            Điều chỉnh & Gửi duyệt lại
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MODAL 5: DELETE CONFIRMATION MODAL
═══════════════════════════════════════════════════════════ */
function DeleteModal({ rule, onClose, onConfirm }) {
  return (
    <div style={modalOverlayStyle}>
      <div className="animate-fade" style={{ ...modalContentStyle, maxWidth: 460 }}>
        <div style={modalHeaderStyle}>
          <div style={{ fontWeight: 700, fontSize: 14, color: "#b91c1c", display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="trash" size={16} color="#ef4444" />
            <span>XÁC NHẬN XÓA QUY TẮC LOẠI TRỪ</span>
          </div>
          <button onClick={onClose} style={closeBtnStyle}><Icon name="x" size={16} /></button>
        </div>

        <div style={{ padding: 20 }}>
          <p style={{ fontSize: 13, color: DS.textPrimary }}>
            Bạn có chắc chắn muốn xóa quy tắc <strong>"{rule.name}"</strong> không?
          </p>

          {rule.status === "ACTIVE" && (
            <div style={{ background: "#fee2e2", color: "#b91c1c", border: "1px solid #fca5a5", padding: 10, borderRadius: 6, marginTop: 12, fontSize: 11 }}>
              ⚠️ <strong>CẢNH BÁO:</strong> Quy tắc này đang HOẠT ĐỘNG. Khi xóa, các cảnh báo phát sinh khớp điều kiện sẽ không còn bị loại trừ và có thể sinh Sự việc.
            </div>
          )}
        </div>

        <div style={modalFooterStyle}>
          <button onClick={onClose} style={btnSecondaryStyle}>Hủy bỏ</button>
          <button onClick={onConfirm} style={{ ...btnPrimaryStyle, background: "#ef4444" }}>
            Xác nhận Xóa
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   COMMON STYLES FOR MODALS & FORMS
═══════════════════════════════════════════════════════════ */
const modalOverlayStyle = {
  position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
  background: "rgba(15, 23, 42, 0.5)", zIndex: 1000,
  display: "flex", alignItems: "center", justifyContent: "center", padding: 20
};

const modalContentStyle = {
  background: "#fff", borderRadius: 8, width: "100%",
  boxShadow: "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)",
  overflow: "hidden"
};

const modalHeaderStyle = {
  padding: "12px 20px", borderBottom: `1px solid ${DS.border}`, background: "#f8fafc",
  display: "flex", alignItems: "center", justifyContent: "space-between"
};

const modalFooterStyle = {
  padding: "12px 20px", borderTop: `1px solid ${DS.border}`, background: "#f8fafc",
  display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 10
};

const labelStyle = {
  display: "block", fontSize: 12, fontWeight: 600, color: DS.textPrimary, marginBottom: 4
};

const inputStyle = {
  width: "100%", height: 32, padding: "0 10px", fontSize: 12,
  border: `1px solid ${DS.border}`, borderRadius: 6, outline: "none",
  background: "#fff", color: DS.textPrimary
};

const errorTextStyle = {
  color: "#ef4444", fontSize: 11, marginTop: 4
};

const btnPrimaryStyle = {
  padding: "8px 16px", borderRadius: 6, border: "none",
  background: DS.accent, color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer"
};

const btnSecondaryStyle = {
  padding: "8px 16px", borderRadius: 6, border: `1px solid ${DS.border}`,
  background: "#fff", color: DS.textSecondary, fontSize: 12, fontWeight: 600, cursor: "pointer"
};

const closeBtnStyle = {
  background: "none", border: "none", cursor: "pointer", color: DS.textMuted
};

// Render React App
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
